                      </div>
                    )}
                  </div>
                );
              })}
            </div>

            <button
              style={{ ...styles.secondaryBtn, marginTop: 12 }}
              onClick={() => {
                const lastRow = rows[rows.length - 1];
                const suggestedWeight = lastRow?.lastSetCoachWeight;
                updateRows([...rows, {
                  weight: String(suggestedWeight !== undefined ? suggestedWeight : (currentEx.weight || "")),
                  reps: "", rpe: "7", note: "", noteOpen: false, weightManuallyEdited: false, done: false,
                }]);
              }}
            >
              <Plus size={14} /> Add set
            </button>
          </Card>
          </div>
        );
      })}

      {/* Strong lets you finish whenever you want — but if there are real, unfinished sets
          with data actually typed into them, it's worth a beat to ask what you want to do
          with them, matching Strong's own "Finish Workout?" confirmation exactly. */}
      <button
        style={styles.primaryBtn}
        onClick={handleFinishTap}
      >
        <Check size={14} /> Finish workout
      </button>

      {finishConfirm && (
        <div style={styles.sheetOverlay} onClick={() => setFinishConfirm(false)}>
          <div style={styles.sheet} onClick={(e) => e.stopPropagation()}>
            <div style={styles.sheetHandle} />
            <div style={{ textAlign: "center", padding: "8px 0 4px" }}>
              <div style={{ fontSize: 32, marginBottom: 8 }}>🎉</div>
              <div style={{ fontFamily: "var(--font-display)", fontSize: 20, fontWeight: 700, marginBottom: 8 }}>Finish workout?</div>
              <div style={{ fontSize: 13, color: "var(--ink-dim)", lineHeight: 1.5, marginBottom: 20 }}>
                There are sets with weight and reps entered that haven't been checked off yet. Invalid or empty sets won't be logged either way.
              </div>
            </div>
            <button
              style={{ ...styles.primaryBtn, width: "100%", marginBottom: 8, background: "var(--fun-green)", boxShadow: "0 4px 14px rgba(52,199,89,0.35)" }}
              onClick={finishUnfinishedSets}
            >
              Complete Unfinished Sets
            </button>
            <button
              style={{ ...styles.secondaryBtn, width: "100%", marginBottom: 8, color: "#FF6B6B", borderColor: "#FF6B6B" }}
              onClick={() => { setFinishConfirm(false); setSessionComplete(true); }}
            >
              Discard Unfinished Sets
            </button>
            <button style={{ ...styles.secondaryBtn, width: "100%" }} onClick={() => setFinishConfirm(false)}>
              Cancel
            </button>
          </div>
        </div>
      )}

      {freeformMode && (
        <button
          style={styles.secondaryBtn}
          onClick={() => { setPickerIntent("addMore"); setSwapTargetIdx(exercises.length); setSwapPickerOpen(true); }}
        >
          <Plus size={14} /> Add another exercise
        </button>
      )}

      {swapPickerOpen && (
        <ExercisePickerSheet
          title={pickerIntent === "addMore" ? "Add exercises" : `Swap "${exercises[swapTargetIdx]?.name}" for…`}
          allLibraryExercises={allLibraryExercises}
          highlightExId={pickerIntent === "swap" ? getEffectiveEx(swapTargetIdx)?.exId : null}
          swapGroup={pickerIntent === "swap" ? (getEffectiveEx(swapTargetIdx)?.group || findLibraryExercise(getEffectiveEx(swapTargetIdx)?.exId, data.customExercises)?.group) : null}
          excludeIds={exercises.map((ex, i) => getEffectiveEx(i)?.exId).filter((id, i) => id && !(pickerIntent === "swap" && i === swapTargetIdx))}
          multiSelect={pickerIntent === "addMore"}
          onCreateCustom={createCustomExercise}
          onPick={(ex) => swapExercise(ex)}
          onConfirmMulti={(exs) => addFreeformExercisesMultiple(exs)}
          onClose={() => setSwapPickerOpen(false)}
        />
      )}
    </div>
  );
}

const REST_TIMER_KEY = "restTimerState";

function RestTimer({ seconds = 120, autoStartSignal }) {
  const [targetDuration, setTargetDuration] = useState(seconds);
  const [running, setRunning] = useState(false);
  // The real wall-clock timestamp the timer should hit zero at — not a tick counter. This
  // is the actual fix for the timer stopping/drifting when the app is backgrounded.
  const [endTime, setEndTime] = useState(null);
  const [remaining, setRemaining] = useState(seconds); // display value only, always recomputed from endTime while running
  const [customInput, setCustomInput] = useState("");
  const [completed, setCompleted] = useState(false);
  const [settingsOpen, setSettingsOpen] = useState(false); // presets/custom tucked away by default — this is a compact utility strip, not a hero feature

  // Resume a still-active timer on mount — covers the component itself remounting (e.g.
  // navigating to another tab and back), which a plain tick-counter would have no way to
  // recover from, since that state would just be gone.
  useEffect(() => {
    try {
      const raw = localStorage.getItem(REST_TIMER_KEY);
      if (raw) {
        const saved = JSON.parse(raw);
        if (saved.endTime && saved.endTime > Date.now()) {
          setEndTime(saved.endTime);
          setTargetDuration(saved.targetDuration || seconds);
          setRunning(true);
        } else {
          localStorage.removeItem(REST_TIMER_KEY);
        }
      }
    } catch (e) {}
    // Deliberately mount-only — this restores a persisted in-progress timer once, it
    // shouldn't re-fire on every prop change.
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  useEffect(() => { if (!running) { setRemaining(seconds); setTargetDuration(seconds); } }, [seconds]);

  // Strong/Hevy pattern: rest timer starts itself the moment a set is checked off,
  // instead of waiting for the person to remember to tap play.
  useEffect(() => {
    if (autoStartSignal === undefined || autoStartSignal === 0) return;
    const newEndTime = Date.now() + seconds * 1000;
    setEndTime(newEndTime);
    setTargetDuration(seconds);
    setCompleted(false);
    setRunning(true);
    try { localStorage.setItem(REST_TIMER_KEY, JSON.stringify({ endTime: newEndTime, targetDuration: seconds })); } catch (e) {}
  }, [autoStartSignal]);

  // Keep a ref to the latest tick logic so both the interval AND the explicit
  // visibility/focus listeners below always call the CURRENT version — avoiding a stale
  // closure over old endTime/running values — while there's still only one place that
  // actually defines what "check the timer" means.
  const tickRef = useRef(null);
  tickRef.current = () => {
    if (!running || !endTime) return;
    const real = Math.max(0, Math.ceil((endTime - Date.now()) / 1000));
    setRemaining(real);
    if (real <= 0) {
      setRunning(false);
      setCompleted(true);
      setEndTime(null);
      try { localStorage.removeItem(REST_TIMER_KEY); } catch (e) {}
      // Vibration on completion
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);

      // ENHANCED Audio beep for gym use (louder, double beep)
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();

        // First beep - loud and noticeable
        const osc1 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        osc1.connect(gain1);
        gain1.connect(ctx.destination);
        osc1.frequency.value = 800; // Clear gym frequency
        gain1.gain.setValueAtTime(0.7, ctx.currentTime); // LOUDER for gym
        gain1.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
        osc1.start(ctx.currentTime);
        osc1.stop(ctx.currentTime + 0.25);

        // Second beep - slight delay for double beep effect (gym style)
        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.connect(gain2);
        gain2.connect(ctx.destination);
        osc2.frequency.value = 800;
        gain2.gain.setValueAtTime(0.7, ctx.currentTime + 0.3); // Slightly delayed
        gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.55);
        osc2.start(ctx.currentTime + 0.3);
        osc2.stop(ctx.currentTime + 0.55);
      } catch (e) {}

      // Auto-clear completed state after 2 seconds
      setTimeout(() => setCompleted(false), 2000);
    }
  };

  // Main timer loop — the interval only triggers a re-render; the actual remaining time is
  // ALWAYS recomputed from the real clock (endTime - Date.now()), never by decrementing a
  // counter on each tick. This is the real fix: mobile browsers throttle or fully suspend
  // setInterval while the app is backgrounded (switching to Spotify, minimizing, the phone
  // locking), so a naive tick-based countdown effectively freezes and never catches back up
  // once you return. Recomputing from a fixed real timestamp means the displayed number is
  // always correct the instant this fires again or the app returns to the foreground — no
  // drift, no catch-up needed, matching how Strong's own timer actually behaves.
  useEffect(() => {
    if (!running || !endTime) return;
    tickRef.current();
    const interval = setInterval(() => tickRef.current(), 1000);
    return () => clearInterval(interval);
  }, [running, endTime]);

  // Explicit correction the INSTANT the app becomes visible/focused again — switching back
  // from Spotify, unlocking the phone, returning to this browser tab — instead of waiting
  // for the next scheduled interval tick. The timestamp-based math above is already
  // correct whenever it runs, but some mobile browsers noticeably delay the first interval
  // tick after throttling ends, which can leave a stale number on screen for up to a second
  // or more even though nothing is actually wrong yet — this closes that visible gap.
  // Three separate signals because no single one is reliably fired by every mobile browser
  // in every backgrounding scenario: visibilitychange for tab/app switches, focus for
  // window-level regains some browsers use instead, pageshow for iOS Safari's back-forward
  // cache restoring a suspended page without a full reload.
  useEffect(() => {
    const handleVisible = () => {
      if (document.visibilityState === "visible") tickRef.current();
    };
    document.addEventListener("visibilitychange", handleVisible);
    window.addEventListener("focus", handleVisible);
    window.addEventListener("pageshow", handleVisible);
    return () => {
      document.removeEventListener("visibilitychange", handleVisible);
      window.removeEventListener("focus", handleVisible);
      window.removeEventListener("pageshow", handleVisible);
    };
  }, []);

  const mm = String(Math.floor(remaining / 60)).padStart(2, "0");
  const ss = String(remaining % 60).padStart(2, "0");
  const pct = Math.max(0, Math.min(1, remaining / targetDuration));

  const presets = [30, 60, 90, 120, 180];
  
  const setDuration = (secs) => {
    setRemaining(secs);
    setTargetDuration(secs);
    setRunning(false);
    setEndTime(null);
    setCompleted(false);
    try { localStorage.removeItem(REST_TIMER_KEY); } catch (e) {}
  };

  const handleCustomSet = () => {
    const val = parseInt(customInput);
    if (val && val > 0 && val <= 600) {
      setDuration(val);
      setCustomInput("");
    }
  };

  // Pausing freezes at the CURRENT real remaining value (recomputed fresh, not whatever
  // the last tick happened to display) and clears endTime so nothing keeps recomputing.
  // Resuming picks a fresh real endTime from wherever it was frozen.
  const togglePlayPause = () => {
    if (running) {
      const real = endTime ? Math.max(0, Math.ceil((endTime - Date.now()) / 1000)) : remaining;
      setRemaining(real);
      setRunning(false);
      setEndTime(null);
      try { localStorage.removeItem(REST_TIMER_KEY); } catch (e) {}
    } else {
      const newEndTime = Date.now() + remaining * 1000;
      setEndTime(newEndTime);
      setRunning(true);
      try { localStorage.setItem(REST_TIMER_KEY, JSON.stringify({ endTime: newEndTime, targetDuration })); } catch (e) {}
    }
  };

  const handleSkip = () => {
    setRunning(false);
    setRemaining(0);
    setEndTime(null);
    setCompleted(false);
    try { localStorage.removeItem(REST_TIMER_KEY); } catch (e) {}
  };

  const handleReset = () => {
    setRunning(false);
    setRemaining(seconds);
    setEndTime(null);
    setCompleted(false);
    try { localStorage.removeItem(REST_TIMER_KEY); } catch (e) {}
  };

  return (
    <div style={{
      background: completed ? "var(--energy-dim)" : "var(--surface-2)", borderRadius: 10,
      padding: "8px 10px", display: "flex", flexDirection: "column", gap: settingsOpen ? 8 : 0,
    }}>
      {/* Compact default row — small ring, countdown, play/pause, and a toggle for the
          presets/custom panel below. This is a utility strip, not a hero feature. Capped at
          3 simultaneous buttons max (not 4) — Skip and Reset are now one contextual button,
          since you rarely need both while actually resting. A prior version showed all 4 at
          once while running, which overflowed the row entirely on a real narrow iPhone. */}
      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
        <div style={{ position: "relative", width: 26, height: 26, flexShrink: 0 }}>
          <svg width="26" height="26" viewBox="0 0 26 26">
            <circle cx="13" cy="13" r="10.5" fill="none" stroke="var(--line)" strokeWidth="2.5" />
            <circle
              cx="13" cy="13" r="10.5" fill="none" stroke={completed ? "var(--energy)" : "var(--accent)"} strokeWidth="2.5"
              strokeDasharray={2 * Math.PI * 10.5}
              strokeDashoffset={2 * Math.PI * 10.5 * (1 - pct)}
              strokeLinecap="round"
              transform="rotate(-90 13 13)"
              style={{ transition: "stroke-dashoffset 1s linear, stroke 0.2s" }}
            />
          </svg>
        </div>
        <div style={{ fontFamily: "var(--font-mono)", fontSize: 14, fontWeight: 700, letterSpacing: "0.01em", flexShrink: 0 }}>
          {mm}:{ss}
        </div>
        {completed && <div style={{ fontSize: 10, color: "var(--energy)", fontWeight: 700, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>✓ Done</div>}
        <div style={{ flex: 1, minWidth: 4 }} />
        <button style={{ ...styles.iconBtn, width: 30, height: 30, minWidth: 30, minHeight: 30, flexShrink: 0 }} onClick={togglePlayPause} title={running ? "Pause" : "Start"}>
          {running ? <Pause size={13} /> : <Play size={13} />}
        </button>
        {running ? (
          <button
            style={{ ...styles.iconBtn, width: 30, height: 30, minWidth: 30, minHeight: 30, flexShrink: 0 }}
            onClick={handleSkip}
            title="Skip rest"
          >
            <ChevronRight size={15} strokeWidth={2.5} />
          </button>
        ) : (
          <button style={{ ...styles.iconBtn, width: 30, height: 30, minWidth: 30, minHeight: 30, flexShrink: 0 }} onClick={handleReset} title="Reset">
            <RotateCcw size={13} />
          </button>
        )}
        <button
          style={{ ...styles.iconBtn, width: 30, height: 30, minWidth: 30, minHeight: 30, flexShrink: 0 }}
          onClick={() => setSettingsOpen(v => !v)}
          title="Rest duration settings"
        >
          <SettingsIcon size={13} />
        </button>
      </div>

      {settingsOpen && (
        <div>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
            {presets.map(p => (
              <button
                key={p}
                onClick={() => setDuration(p)}
                style={{
                  padding: "5px 10px", fontSize: 11, fontFamily: "var(--font-mono)", fontWeight: 600,
                  borderRadius: 8, cursor: "pointer",
                  background: remaining === p && !customInput ? "var(--accent)" : "var(--surface)",
                  color: remaining === p && !customInput ? "#FFFFFF" : "var(--ink)",
                  border: `1px solid ${remaining === p && !customInput ? "var(--accent)" : "var(--line)"}`,
                }}
              >
                {p}s
              </button>
            ))}
          </div>
          <div style={{ display: "flex", gap: 6, marginTop: 6 }}>
            <input
              type="number" inputMode="numeric"
              min="1"
              max="600"
              style={{ ...styles.input, flex: 1, padding: "6px 10px", fontSize: 16 }}
              value={customInput}
              onChange={(e) => setCustomInput(e.target.value)} onBlur={(e) => { const v = +e.target.value; if (e.target.value !== "" && !isNaN(v)) setCustomInput(String(Math.max(1, Math.min(600, v)))); }}
              placeholder="Custom (1-600s)"
              onKeyDown={(e) => { if(e.key === "Enter") handleCustomSet(); }}
            />
            <button
              style={{...styles.primaryBtn, marginTop: 0, padding: "6px 12px", fontSize: 12}}
              onClick={handleCustomSet}
              disabled={!customInput}
            >
              Set
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

        <NewProgramForm
          onCreate={(prog) => {
            const updated = {
              ...data,

            setShowNew(false);

        <>
          {activeProgram ? (
            <Card title="Active program">
              <div style={styles.programDetail}>
                <div style={styles.progName}>{activeProgram.name}</div>
                <div style={styles.progMeta}>
                  {PHASES.find(p => p.id === activeProgram.phase)?.name} · {activeProgram.weeks} weeks
                </div>
                <div style={styles.progDesc}>
                  {PHASES.find(p => p.id === activeProgram.phase)?.description}
                </div>
                <div style={styles.btnRow}>
                  <button style={styles.primaryBtn} onClick={() => setShowNew(true)}>
                    <Plus size={14} /> New program
                  </button>
                  <button style={styles.ghostBtn} onClick={() => {
                    setData({
                      ...data,
                      programs: data.programs.map(p => p.id === activeProgram.id ? {...p, active: false} : p),
                    });
                  }}>
                    <X size={14} /> End program
                  </button>
                </div>
              </div>
            </Card>
          ) : (
            <Card title="No active program">
              <EmptyHint text="Start a structured training phase." />

                <Plus size={14} /> Create program

          {data.programs.length > 1 && (
            <Card title="Past programs">
              <div style={styles.logList}>
                {data.programs.filter(p => !p.active).map((p) => (
                  <div key={p.id} style={{ ...styles.logRow, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                    <div>
                      <span style={styles.dim}>{fmtDate(p.startDate)}</span>{" "}
                      <span style={styles.mono}>{p.name}</span>

                    <button
                      style={{ ...styles.ghostBtn, padding: "6px 12px", fontSize: 11 }}

                        setData({
                          ...data,

                      Reactivate
                    </button>
                  </div>
                ))}
              </div>
            </Card>
          )}
        </>
      )}
    </div>
  );
}

function WorkoutCustomizer({ phase, weeks, template, startDate, onConfirm, onCancel }) {
  const workouts = generateProgramWorkouts(phase, weeks, template, startDate);
  const [editingWorkoutIdx, setEditingWorkoutIdx] = useState(null);
  
  if (workouts.length === 0) {
    return (
      <Card title="Workout Plan">
        <div style={styles.dimSmall}>Error generating workouts. Check your template selection.</div>
        <button style={styles.ghostBtn} onClick={onCancel}><X size={14} /> Cancel</button>
      </Card>
    );
  }

  const groupedByWeek = {};
  workouts.forEach(w => {
    if (!groupedByWeek[w.week]) groupedByWeek[w.week] = [];
    groupedByWeek[w.week].push(w);
  });

  return (
    <Card title={`Workout Plan Preview (${workouts.length} workouts)`}>
      <div style={{ maxHeight: 400, overflowY: "auto", paddingRight: 8 }}>
        {Object.entries(groupedByWeek).map(([week, weekWorkouts]) => (
          <div key={week} style={{ marginBottom: 16, paddingBottom: 12, borderBottom: "1px solid var(--line)" }}>
            <div style={{ fontSize: 12, fontWeight: 600, color: "var(--accent)", marginBottom: 8 }}>
              Week {week}
            </div>
            {weekWorkouts.map((workout, idx) => (
              <div key={workout.id} style={{ 
                fontSize: 11, 
                padding: 8, 
                background: "var(--surface-2)", 
                borderRadius: 4, 
                marginBottom: 6,
                cursor: "pointer",
                border: editingWorkoutIdx === idx ? "1px solid var(--accent)" : "1px solid var(--line)"
              }} onClick={() => setEditingWorkoutIdx(editingWorkoutIdx === idx ? null : idx)}>
                <div style={{ color: "var(--ink)", marginBottom: 4 }}>
                  <strong>{workout.focus}</strong> — {workout.exercises.length} exercises
                </div>
                {editingWorkoutIdx === idx && (
                  <div style={{ fontSize: 10, color: "var(--ink-dim)", marginTop: 6 }}>
                    {workout.exercises.map(ex => (
                      <div key={ex.exId} style={{ marginBottom: 3 }}>
                        {ex.name}: {ex.sets}×{ex.reps} @ {ex.weight}lb
                      </div>
                    ))}
                  </div>
                )}
              </div>
            ))}
          </div>
        ))}
      </div>
      <div style={{ ...styles.dimSmall, marginTop: 12, fontSize: 10 }}>
        ℹ️ This is auto-generated based on your phase. Weights auto-adjust as you log sets, and you can swap any exercise for a substitute right in your workout if something's unavailable — but the plan itself (exercises, sets, reps) is fixed once created. Start a new program to change the structure.
      </div>
      <div style={styles.btnRow}>
        <button style={styles.primaryBtn} onClick={() => onConfirm(workouts)}>
          <Check size={14} /> Accept & Create Program
        </button>
        <button style={styles.ghostBtn} onClick={onCancel}>
          <X size={14} /> Cancel
        </button>
      </div>
    </Card>
  );
}

        phase={phase}
        weeks={weeks}

          onCreate({

            phase,
            weeks: Math.max(1, weeks),

            active: true,

            workouts,

  return (

        </Field>
        <Field label="Training split">
          <select style={styles.input} value={template} onChange={(e) => setTemplate(e.target.value)}>
            {Object.entries(WORKOUT_TEMPLATES).map(([key, tmpl]) => (
              <option key={key} value={key}>{tmpl.name} ({tmpl.daysPerWeek}x/week)</option>

          </select>
        </Field>
      </div>
      
      <div style={{ ...styles.dimSmall, marginBottom: 12, padding: 8, background: "var(--surface-2)", borderRadius: 4 }}>
        <strong>{PHASES.find(p => p.id === phase)?.name}</strong><br/>
        {PHASES.find(p => p.id === phase)?.description}
        <br/><br/>
        <strong>{WORKOUT_TEMPLATES[template]?.name}</strong><br/>
        {WORKOUT_TEMPLATES[template]?.description}
      </div>

      <div style={styles.btnRow}>
        <button style={styles.primaryBtn} onClick={() => {
          if (!name) { 
            setValidationError("Program name is required"); 
            return; 
          }
          if (!weeks || weeks < 1) { 
            setValidationError("Program must be at least 1 week"); 
            return; 
          }
          setValidationError(null);
          setShowCustomizer(true);
        }}>
          <ChevronRight size={14} /> Review workout plan
        </button>
        <button style={styles.ghostBtn} onClick={onCancel}>
          <X size={14} /> Cancel
        </button>
      </div>
      
      {validationError && (
        <div style={{marginTop: 16, padding: 12, background: "rgba(255, 59, 48, 0.1)", border: "1px solid rgba(255, 59, 48, 0.3)", borderRadius: 8, color: "#FF3B30", fontSize: 13}}>
          {validationError}
        </div>
      )}
    </Card>
  );
}

/* ---------------------------------------------------------------
   MEASUREMENTS
--------------------------------------------------------------- */
function Measurements({ data, setData }) {
  const [chest, setChest] = useState("");
  const [arm, setArm] = useState("");
  const [waist, setWaist] = useState("");
  const [leg, setLeg] = useState("");

  const hasAnyValue = chest !== "" || arm !== "" || waist !== "" || leg !== "";

  const logMeasurement = () => {
    // Any one field is enough — someone tracking only their waist shouldn't be forced to
    // also measure chest/arm/leg just to log anything at all. Missing fields are stored as
    // null (not 0, and not silently dropped from the chart's timeline — see SimpleLineChart's
    // null-aware line handling), so the trend chart shows a genuine gap, not a fake dip.
    if (!hasAnyValue) return;
    const entry = {
      date: todayStr(),
      chest: chest !== "" ? +chest : null,
      arm: arm !== "" ? +arm : null,
      waist: waist !== "" ? +waist : null,
      leg: leg !== "" ? +leg : null,
    };
    setData({ ...data, measurements: [...data.measurements, entry] });
    setChest(""); setArm(""); setWaist(""); setLeg("");
  };

  const chartData = [...data.measurements]
    .sort((a, b) => a.date.localeCompare(b.date))
    .slice(-12)
    .map(m => ({
      date: fmtDate(m.date),
      chest: m.chest,
      arm: m.arm,
      waist: m.waist,
      leg: m.leg,
    }));

  return (
    <div style={styles.stack}>
      <Card title="Log body measurements (inches)">
        <div style={{ fontSize: 12, color: "var(--ink-dim)", marginBottom: 10 }}>
          Fill in whichever you're tracking today — you don't need all four.
        </div>
        <div style={styles.formGrid3}>
          <Field label="Chest"><input type="number" inputMode="decimal" step="0.1" min="20" max="80" style={styles.input} value={chest} onChange={(e) => setChest(e.target.value)} onBlur={(e) => { const v = +e.target.value; if (e.target.value !== "" && !isNaN(v)) setChest(String(Math.max(20, Math.min(80, v)))); }} /></Field>
          <Field label="Arm"><input type="number" inputMode="decimal" step="0.1" min="8" max="25" style={styles.input} value={arm} onChange={(e) => setArm(e.target.value)} onBlur={(e) => { const v = +e.target.value; if (e.target.value !== "" && !isNaN(v)) setArm(String(Math.max(8, Math.min(25, v)))); }} /></Field>
          <Field label="Waist"><input type="number" inputMode="decimal" step="0.1" min="20" max="70" style={styles.input} value={waist} onChange={(e) => setWaist(e.target.value)} onBlur={(e) => { const v = +e.target.value; if (e.target.value !== "" && !isNaN(v)) setWaist(String(Math.max(20, Math.min(70, v)))); }} /></Field>
          <Field label="Leg"><input type="number" inputMode="decimal" step="0.1" min="15" max="40" style={styles.input} value={leg} onChange={(e) => setLeg(e.target.value)} onBlur={(e) => { const v = +e.target.value; if (e.target.value !== "" && !isNaN(v)) setLeg(String(Math.max(15, Math.min(40, v)))); }} /></Field>
        </div>
        <button style={{ ...styles.primaryBtn, opacity: hasAnyValue ? 1 : 0.5 }} disabled={!hasAnyValue} onClick={logMeasurement}><Plus size={14} /> Log measurements</button>
      </Card>

      {data.measurements.length === 1 && (
        <Card title="Measurement trends">
          <div style={styles.dimSmall}>Log measurements at least twice (ideally every 2 weeks) to see trends and track progress.</div>
        </Card>
      )}

      {data.measurements.length > 1 && (
        <Card title="Measurement trends">
          <SimpleLineChart
            data={chartData}
            lines={[
              { key: "chest", color: "#C9A24B" },
              { key: "arm", color: "#5FA8A0" },
              { key: "waist", color: "#C1502E" },
              { key: "leg", color: "#8FA5B3" },
            ]}
            height={180}
          />
          <div style={{ display: "flex", gap: 14, marginTop: 10, fontSize: 11, color: "var(--ink-dim)", flexWrap: "wrap" }}>
            <span><span style={{ display: "inline-block", width: 8, height: 8, borderRadius: 4, background: "#C9A24B", marginRight: 4 }} />Chest</span>
            <span><span style={{ display: "inline-block", width: 8, height: 8, borderRadius: 4, background: "#5FA8A0", marginRight: 4 }} />Arm</span>
            <span><span style={{ display: "inline-block", width: 8, height: 8, borderRadius: 4, background: "#C1502E", marginRight: 4 }} />Waist</span>
            <span><span style={{ display: "inline-block", width: 8, height: 8, borderRadius: 4, background: "#8FA5B3", marginRight: 4 }} />Leg</span>
          </div>
        </Card>
      )}

      {data.measurements.length > 0 && (
        <Card title="History">
          <div style={styles.logList}>
            {[...data.measurements].reverse().slice(0, 8).map((m, i) => (
              <div key={i} style={styles.logRow}>
                <span style={styles.dim}>{fmtDate(m.date)}</span>
                <span style={styles.mono}>C:{m.chest ?? "—"} A:{m.arm ?? "—"} W:{m.waist ?? "—"} L:{m.leg ?? "—"}</span>
              </div>
            ))}
          </div>
        </Card>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------
   CARDIO
--------------------------------------------------------------- */
function Cardio({ data, setData }) {
  const maxHr = estMaxHr(data.profile);
  const zones = [
    { zone: 1, label: "Recovery", lo: 0.5, hi: 0.6 },
    { zone: 2, label: "Aerobic", lo: 0.6, hi: 0.7 },
    { zone: 3, label: "Tempo", lo: 0.7, hi: 0.8 },
    { zone: 4, label: "Threshold", lo: 0.8, hi: 0.9 },
    { zone: 5, label: "VO2", lo: 0.9, hi: 1.0 },
  ].map(z => ({ ...z, loBpm: Math.round(z.lo * maxHr), hiBpm: Math.round(z.hi * maxHr) }));

  const [type, setType] = useState("Run");
  const [minutes, setMinutes] = useState("");
  const [avgHr, setAvgHr] = useState("");

  // Duration is the one thing a cardio session genuinely can't be logged without — but not
  // everyone has a heart rate monitor, and being forced to guess an HR number just to log
  // "went for a 30 min run" is exactly the kind of friction that makes people stop logging.
  const canLog = minutes !== "";

  const logCardio = () => {
    if (!canLog) return;
    let zone = null;
    if (avgHr !== "") {
      const pct = (+avgHr) / maxHr;
      zone = 1;
      for (let z of zones) {
        if (pct >= z.lo && pct < z.hi) { zone = z.zone; break; }
      }
      if (pct >= 1.0) zone = 5;
    }
    const entry = { date: todayStr(), type, minutes: +minutes, avgHr: avgHr !== "" ? +avgHr : null, zone };
    setData({ ...data, cardioLog: [...data.cardioLog, entry], lastLogDate: todayStr() });
    setMinutes(""); setAvgHr("");
  };

  // Merge two real sources into one trend line: cardio sessions you logged yourself, and
  // daily HR readings imported from Apple Health — the data the import flow below actually
  // writes to, which previously went into storage and was never shown anywhere again. When
  // both exist for the same day, the logged session's exercise-time average HR is more
  // specific and wins; the import fills in days you didn't log a session but still have data.
  const hrByDate = {};
  (data.hrImports || []).forEach(h => { if (h.hr) hrByDate[h.date] = h.hr; });
  data.cardioLog.forEach(c => { if (c.avgHr) hrByDate[c.date] = c.avgHr; });
  const chartData = Object.entries(hrByDate)
    .sort((a, b) => a[0].localeCompare(b[0]))
    .slice(-14)
    .map(([date, avgHr]) => ({ date: fmtDate(date), avgHr }));

  return (
    <div style={styles.stack}>
      <Card title={`Heart rate zones (Max HR ≈ ${maxHr} bpm)`}>
        <div style={styles.zoneList}>
          {zones.map(z => (
            <div key={z.zone} style={styles.zoneRow}>
              <div style={{ ...styles.zoneDot, background: zoneColor(z.zone) }} />
              <span>Z{z.zone} · {z.label}</span>
              <span style={styles.mono}>{z.loBpm}–{z.hiBpm}</span>
            </div>
          ))}
        </div>
      </Card>

      <Card title="Log cardio">
        <div style={{ fontSize: 12, color: "var(--ink-dim)", marginBottom: 10 }}>
          Avg HR is optional — leave it blank if you weren't tracking heart rate.
        </div>
        <div style={styles.formGrid3}>
          <Field label="Type">
            <select style={styles.input} value={type} onChange={(e) => setType(e.target.value)}>
              {["Run", "Row", "Bike", "Swim"].map(t => <option key={t}>{t}</option>)}
            </select>
          </Field>
          <Field label="Minutes"><input type="number" inputMode="numeric" min="1" max="300" style={styles.input} value={minutes} onChange={(e) => setMinutes(e.target.value)} onBlur={(e) => { const v = +e.target.value; if (e.target.value !== "" && !isNaN(v)) setMinutes(String(Math.max(1, Math.min(300, v)))); }} /></Field>
          <Field label="Avg HR (bpm) — optional"><input type="number" inputMode="numeric" min="30" max="220" style={styles.input} value={avgHr} onChange={(e) => setAvgHr(e.target.value)} onBlur={(e) => { const v = +e.target.value; if (e.target.value !== "" && !isNaN(v)) setAvgHr(String(Math.max(30, Math.min(220, v)))); }} onKeyDown={(e) => { if(e.key === "Enter" && canLog) logCardio(); }} placeholder="Press Enter to log" /></Field>
        </div>
        <button style={{ ...styles.primaryBtn, opacity: canLog ? 1 : 0.5 }} disabled={!canLog} onClick={logCardio}><Plus size={14} /> Log session</button>
      </Card>

      {chartData.length > 1 && (
        <Card title="HR trend">
          <SimpleLineChart data={chartData} lines={[{ key: "avgHr", color: "var(--accent)" }]} height={140} />
        </Card>
      )}
    </div>
  );
}

function zoneColor(z) {
  return ["#5FA8A0", "#5FA8A0", "#C9A24B", "#C1502E", "#C1502E"][z - 1];
}

/* ---------------------------------------------------------------
   HISTORY
--------------------------------------------------------------- */
function HistoryView({ data, setData }) {
  const [view, setView] = useState("sessions"); // sessions | progression | log
  const [selectedExId, setSelectedExId] = useState(null);
  const [expandedDate, setExpandedDate] = useState(null);
  const [confirmDeleteDate, setConfirmDeleteDate] = useState(null);

  // Group all strength entries into per-day sessions. Each set carries its exId + original
  // array index so a single set can be deleted precisely, even if duplicate weight/reps exist.
  const sessions = useMemo(() => {
    const byDate = {};
    Object.entries(data.strengthLog).forEach(([exId, arr]) => {
      const ex = data.exercises.find(e => e.id === exId);
      arr.forEach((h, idx) => {
        if (!byDate[h.date]) byDate[h.date] = { date: h.date, sets: [], totalReps: 0, totalVolume: 0, improvedCount: 0 };
        byDate[h.date].sets.push({ exId, idx, name: ex?.name || exId, ...h });
        byDate[h.date].totalReps += h.reps || 0;
        byDate[h.date].totalVolume += (h.weight || 0) * (h.reps || 0);
        if (h.improved) byDate[h.date].improvedCount += 1;
      });
    });
    return Object.values(byDate).sort((a, b) => b.date.localeCompare(a.date));
  }, [data]);

  // Recompute lastLogDate (used for the streak) after any deletion, since the deleted
  // date might have been the most recent logged day.
  // (moved to top-level — see recomputeLastLogDate near the other shared date utilities;
  // this was previously a local function only HistoryView could actually call, which would
  // have thrown a ReferenceError the moment LiveWorkout's delete-a-set needed the same logic)

  // Delete a single set — e.g. you logged a bad rep by mistake but the rest of the
  // session should still count.
  function deleteSet(exId, idx) {
    const nextStrengthLog = {
      ...data.strengthLog,
      [exId]: data.strengthLog[exId].filter((_, i) => i !== idx),
    };
    setData({
      ...data,
      strengthLog: nextStrengthLog,
      lastLogDate: recomputeLastLogDate(nextStrengthLog, data.cardioLog, data.recoveryLog),
    });
  }

  // Delete an entire workout day — every strength set logged that date, across every
  // exercise, e.g. for a test session you don't want to count at all.
  function deleteWholeSession(date) {
    const nextStrengthLog = {};
    Object.entries(data.strengthLog).forEach(([exId, arr]) => {
      nextStrengthLog[exId] = arr.filter(h => h.date !== date);
    });
    setData({
      ...data,
      strengthLog: nextStrengthLog,
      lastLogDate: recomputeLastLogDate(nextStrengthLog, data.cardioLog, data.recoveryLog),
    });
    setConfirmDeleteDate(null);
    setExpandedDate(null);
  }

  // List of exercises that have history, for the progression picker
  const exercisesWithHistory = useMemo(() => {
    return Object.keys(data.strengthLog)
      .filter(exId => (data.strengthLog[exId] || []).length > 0)
      .map(exId => ({ id: exId, name: data.exercises.find(e => e.id === exId)?.name || exId }))
      .sort((a, b) => a.name.localeCompare(b.name));
  }, [data]);

  const activeExId = selectedExId || (exercisesWithHistory[0] && exercisesWithHistory[0].id);
  const progressionData = useMemo(() => {
    if (!activeExId) return [];
    return (data.strengthLog[activeExId] || [])
      .slice()
      .sort((a, b) => a.date.localeCompare(b.date))
      .map(h => ({ date: fmtDate(h.date), weight: h.weight, reps: h.reps, e1rm: Math.round(h.weight * (1 + h.reps / 30)) }));
  }, [data, activeExId]);

  const allEvents = useMemo(() => {
    const events = [];
    Object.entries(data.strengthLog).forEach(([exId, arr]) => {
      const ex = data.exercises.find(e => e.id === exId);
      arr.forEach(h => events.push({ date: h.date, kind: "Strength", detail: `${ex?.name}: ${h.weight} lb × ${h.reps}` }));
    });
    data.cardioLog.forEach(c => events.push({ date: c.date, kind: "Cardio", detail: `${c.type}: ${c.minutes} min` }));
    data.measurements.forEach(m => events.push({ date: m.date, kind: "Measurements", detail: `C:${m.chest ?? "—"} A:${m.arm ?? "—"} W:${m.waist ?? "—"}` }));
    return events.sort((a, b) => b.date.localeCompare(a.date));
  }, [data]);

  return (
    <div style={styles.stack}>
      <div style={{ display: "flex", gap: 8, marginBottom: 4 }}>
        {[
          { id: "sessions", label: "Past Workouts" },
          { id: "progression", label: "Progression" },
          { id: "log", label: "Full Log" },
        ].map(v => (
          <button
            key={v.id}
            onClick={() => setView(v.id)}
            style={{
              padding: "8px 14px", borderRadius: 10, fontSize: 13, fontWeight: 600,
              border: "1px solid var(--line)", cursor: "pointer",
              background: view === v.id ? "var(--accent-dim)" : "var(--surface)",
              color: view === v.id ? "var(--accent)" : "var(--ink-dim)",
            }}
          >
            {v.label}
          </button>
        ))}
      </div>

      {view === "sessions" && (
        <Card title={`Past workouts (${sessions.length})`}>
          {sessions.length === 0 ? (
            <EmptyHint text="No workouts logged yet." />
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {sessions.map((s) => {
                const isOpen = expandedDate === s.date;
                const exNames = [...new Set(s.sets.map(x => x.name))];
                return (
                  <div key={s.date} style={{ border: "1px solid var(--line)", borderRadius: 12, overflow: "hidden" }}>
                    <button
                      onClick={() => setExpandedDate(isOpen ? null : s.date)}
                      style={{
                        width: "100%", display: "flex", justifyContent: "space-between", alignItems: "center",
                        padding: "12px 14px", background: "var(--surface-2)", border: "none", cursor: "pointer", textAlign: "left",
                      }}
                    >
                      <div>
                        <div style={{ fontWeight: 700, fontSize: 14 }}>{fmtDate(s.date)}</div>
                        <div style={{ fontSize: 12, color: "var(--ink-dim)", marginTop: 2 }}>
                          {exNames.length} exercise{exNames.length !== 1 ? "s" : ""} · {s.sets.length} sets · {s.totalVolume.toLocaleString()} lb
                          {s.improvedCount > 0 && <span style={{ color: "var(--accent)", fontWeight: 600 }}> · {s.improvedCount} improved</span>}
                        </div>
                      </div>
                      <ChevronRight size={16} style={{ transform: isOpen ? "rotate(90deg)" : "rotate(0deg)", transition: "transform 0.15s" }} />
                    </button>
                    {isOpen && (
                      <div style={{ padding: "12px 16px", display: "flex", flexDirection: "column", gap: 8 }}>
                        {s.sets.map((set, i) => (
                          <div key={i} style={{ paddingBottom: 8, borderBottom: "1px solid var(--line)" }}>
                            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 13 }}>
                              <span>{set.name}</span>
                              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                                <span style={{ fontFamily: "var(--font-mono)", fontWeight: 600 }}>
                                  {set.weight}×{set.reps} @ RPE {set.rpe}
                                  {set.isAllTimePR ? <span style={{ marginLeft: 6 }}>🏆</span> : set.improved && <span style={{ color: "var(--accent)", marginLeft: 6 }}>✅</span>}
                                </span>
                                <button
                                  onClick={() => deleteSet(set.exId, set.idx)}
                                  title="Delete this set"
                                  style={{ background: "transparent", border: "none", color: "var(--ink-dim)", cursor: "pointer", padding: 4, display: "flex" }}
                                >
                                  <X size={14} />
                                </button>
                              </div>
                            </div>
                            {set.note && (
                              <div style={{ fontSize: 11, color: "var(--ink-dim)", fontStyle: "italic", marginTop: 4 }}>
                                💬 {set.note}
                              </div>
                            )}
                          </div>
                        ))}

                        {confirmDeleteDate === s.date ? (
                          <div style={{ marginTop: 4 }}>
                            <div style={{ fontSize: 12, color: "#FF6B6B", fontWeight: 600, marginBottom: 8 }}>
                              ⚠️ This deletes all {s.sets.length} sets from {fmtDate(s.date)}. This can't be undone.
                            </div>
                            <div style={{ display: "flex", gap: 8 }}>
                              <button
                                onClick={() => deleteWholeSession(s.date)}
                                style={{ flex: 1, padding: "10px", borderRadius: 10, border: "none", background: "#FF6B6B", color: "#FFFFFF", fontSize: 13, fontWeight: 700, cursor: "pointer" }}
                              >
                                Yes, delete workout
                              </button>
                              <button
                                onClick={() => setConfirmDeleteDate(null)}
                                style={{ flex: 1, padding: "10px", borderRadius: 10, border: "1px solid var(--line)", background: "transparent", color: "var(--ink-dim)", fontSize: 13, fontWeight: 600, cursor: "pointer" }}
                              >
                                Cancel
                              </button>
                            </div>
                          </div>
                        ) : (
                          <button
                            onClick={() => setConfirmDeleteDate(s.date)}
                            style={{ marginTop: 4, padding: "10px", borderRadius: 10, border: "1px solid #FF6B6B", background: "transparent", color: "#FF6B6B", fontSize: 13, fontWeight: 600, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}
                          >
                            <X size={13} /> Delete entire workout
                          </button>
                        )}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}
        </Card>
      )}

      {view === "progression" && (
        <Card title="Exercise progression">
          {exercisesWithHistory.length === 0 ? (
            <EmptyHint text="Log a few sets to see progression here." />
          ) : (
            <>
              <select
                style={{ ...styles.input, marginBottom: 16, maxWidth: 320 }}
                value={activeExId}
                onChange={(e) => setSelectedExId(e.target.value)}
              >
                {exercisesWithHistory.map(ex => <option key={ex.id} value={ex.id}>{ex.name}</option>)}
              </select>

              {progressionData.length > 1 ? (
                <>
                  <div style={{ fontSize: 12, color: "var(--ink-dim)", fontWeight: 600, marginBottom: 6 }}>WEIGHT OVER TIME (lb)</div>
                  <SimpleLineChart data={progressionData} lines={[{ key: "weight", color: "var(--accent)" }]} height={180} />
                  <div style={{ fontSize: 12, color: "var(--ink-dim)", fontWeight: 600, margin: "20px 0 6px" }}>ESTIMATED 1-REP MAX</div>
                  <SimpleLineChart data={progressionData} lines={[{ key: "e1rm", color: "var(--energy)" }]} height={140} />

                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 12, marginTop: 20 }}>
                    <div style={{ background: "var(--surface-2)", padding: 12, borderRadius: 10 }}>
                      <div style={{ fontSize: 11, color: "var(--ink-dim)" }}>FIRST LOGGED</div>
                      <div style={{ fontFamily: "var(--font-mono)", fontWeight: 700 }}>{progressionData[0].weight}×{progressionData[0].reps}</div>
                    </div>
                    <div style={{ background: "var(--surface-2)", padding: 12, borderRadius: 10 }}>
                      <div style={{ fontSize: 11, color: "var(--ink-dim)" }}>MOST RECENT</div>
                      <div style={{ fontFamily: "var(--font-mono)", fontWeight: 700 }}>{progressionData[progressionData.length - 1].weight}×{progressionData[progressionData.length - 1].reps}</div>
                    </div>
                    <div style={{ background: "var(--accent-dim)", padding: 12, borderRadius: 10 }}>
                      <div style={{ fontSize: 11, color: "var(--ink-dim)" }}>CHANGE</div>
                      <div style={{ fontFamily: "var(--font-mono)", fontWeight: 700, color: "var(--accent)" }}>
                        {progressionData[progressionData.length - 1].weight - progressionData[0].weight >= 0 ? "+" : ""}
                        {progressionData[progressionData.length - 1].weight - progressionData[0].weight} lb
                      </div>
                    </div>
                  </div>
                </>
              ) : (
                <EmptyHint text="Log this exercise at least twice to see a progression trend." />
              )}
            </>
          )}
        </Card>
      )}

      {view === "log" && (
        <Card title={`Full log (${allEvents.length} entries)`}>
          {allEvents.length === 0 ? (
            <EmptyHint text="No activity yet." />
          ) : (
            <div style={styles.logList}>
              {allEvents.map((e, i) => (
                <div key={i} style={styles.logRow}>
                  <span style={styles.dim}>{fmtDate(e.date)}</span>
                  <span style={{ ...styles.kindTag, color: kindTagColor(e.kind) }}>{e.kind}</span>
                  <span style={styles.mono}>{e.detail}</span>
                </div>
              ))}
            </div>
          )}
        </Card>
      )}
    </div>
  );
}

function kindTagColor(kind) {
  const map = { Strength: "#C9A24B", Cardio: "#5FA8A0", Measurements: "#8FA5B3", Recovery: "#C1502E" };
  return map[kind] || "var(--ink-dim)";
}

/* ---------------------------------------------------------------
   IMPORT
--------------------------------------------------------------- */
function ImportView({ data, setData }) {
  const [raw, setRaw] = useState("");
  const [status, setStatus] = useState(null);

  const parseAndImport = () => {
    try {
      const parsed = JSON.parse(raw);
      const list = Array.isArray(parsed) ? parsed : [parsed];
      // Only count entries with a genuine, physiologically plausible HR number — otherwise
      // pasting malformed or unrelated JSON would silently report "success" while writing
      // entries with hr: null that this chart (rightly) can never use for anything.
      const normalized = list
        .map(item => ({ date: item.date || todayStr(), hr: item.hr ?? item.heartRate ?? null }))
        .filter(item => typeof item.hr === "number" && item.hr >= 30 && item.hr <= 220);
      const skipped = list.length - normalized.length;
      if (normalized.length === 0) {
        setStatus({ ok: false, msg: "No valid HR entries found — each item needs a real \"hr\" or \"heartRate\" number between 30–220." });
        return;
      }
      setData({ ...data, hrImports: [...data.hrImports, ...normalized] });
      setStatus({ ok: true, msg: `Imported ${normalized.length} entries${skipped > 0 ? ` (${skipped} skipped — no valid HR value)` : ""}. Check the HR trend chart on the Cardio tab.` });
      setRaw("");
    } catch (e) {
      setStatus({ ok: false, msg: "Parse error." });
    }
  };

  return (
    <div style={styles.stack}>
      <Card title="Apple Health import">
        <p style={styles.para}>
          Build a Shortcuts automation that exports HR data as JSON, then paste it here.
        </p>
        <textarea
          style={styles.textarea}
          rows={4}
          placeholder='[{"date":"2026-08-05","hr":142}]'
          value={raw}
          onChange={(e) => setRaw(e.target.value)}
        />
        <button style={styles.primaryBtn} onClick={parseAndImport}><UploadCloud size={14} /> Import</button>
        {status && (
          <div style={{ fontSize: 12, marginTop: 8, color: status.ok ? "var(--accent)" : "#C1502E" }}>
            {status.ok ? "✓" : "✕"} {status.msg}
          </div>
        )}
      </Card>
    </div>
  );
}

}

function Field({ label, children }) {

}

function EmptyHint({ text, action, onClick }) {

}
