  <!-- maximum-scale=1.0 + user-scalable=no is deliberate: without it, tapping any input
       whose effective font-size renders under 16px triggers iOS Safari's automatic
       zoom-to-legible-size behavior, and the viewport can end up shifted off-center
       afterward — exactly the "everything is zoomed and cut off on the left" bug a real
       screenshot on a real iPhone showed. This app is meant to feel like a native app, not
       a webpage someone might want to pinch-zoom around in, so trading away pinch-zoom to
       guarantee the layout never drifts off-center is the right call here.
       viewport-fit=cover matters specifically once this is installed via "Add to Home
       Screen": without it, the page content is inset to avoid the notch/status bar, which
       sounds safe but actually leaves an ugly bar of mismatched color at the top and bottom
       instead of the app filling the screen like a real installed app does. Paired with
       real safe-area-inset padding on the app's own root container (see styles.app) so
       content is pushed clear of the notch and home indicator without losing that
       edge-to-edge look. -->
  <title>TonyGainz</title>
  <!-- React and ReactDOM inlined rather than loaded from a CDN, and the app's JSX is
       precompiled at build time rather than transformed in the browser. Previously this
       page pulled three scripts from unpkg (including ~3MB of Babel) and then compiled
       437KB of JSX on every single load. That meant: no internet, no app — which
       defeated the whole point of the offline PWA work — plus a visible compile delay on
       phone hardware before anything rendered. Now the file is genuinely self-contained
       and starts immediately. -->

  <script>
    // window.storage is an async key-value API Claude's artifact preview environment
    // injects automatically — but this app also gets deployed standalone (e.g. to Vercel),
    // where no such API exists at all. Every persistence call in this app (all workout
    // data, profiles, settings) goes through window.storage, so without this fallback the
    // app would fail completely outside Claude's own preview — not just profile creation,
    // literally every save and load. If the real API isn't present, transparently provide
    // one with the identical shape, backed by real browser localStorage instead. Wrapped in
    // try/catch throughout so a private-browsing quota error degrades gracefully (returns
    // null/empty) rather than throwing and producing the same "check your connection"
    // message for an unrelated reason.
    if (typeof window.storage === "undefined") {
      window.storage = {
        get: function (key, shared) {
          return new Promise(function (resolve) {
            try {
              var raw = localStorage.getItem(key);
              resolve(raw !== null ? { key: key, value: raw, shared: !!shared } : null);
            } catch (e) { resolve(null); }
          });
        },
        set: function (key, value, shared) {
          return new Promise(function (resolve, reject) {
            try {
              localStorage.setItem(key, value);
              resolve({ key: key, value: value, shared: !!shared });
            } catch (e) { reject(e); }
          });
        },
        delete: function (key, shared) {
          return new Promise(function (resolve) {
            try {
              var existed = localStorage.getItem(key) !== null;
              localStorage.removeItem(key);
              resolve(existed ? { key: key, deleted: true, shared: !!shared } : null);
            } catch (e) { resolve(null); }
          });
        },
        list: function (prefix, shared) {
          return new Promise(function (resolve) {
            try {
              var keys = [];
              for (var i = 0; i < localStorage.length; i++) {
                var k = localStorage.key(i);
                if (!prefix || k.indexOf(prefix) === 0) keys.push(k);
              }
              resolve({ keys: keys, prefix: prefix, shared: !!shared });
            } catch (e) { resolve({ keys: [], prefix: prefix, shared: !!shared }); }
          });
        },
      };
    }

    :root {
      /* Concrete-and-steel neutrals, not iOS greys. Gym lighting is bright and flat, so the
         light theme reads as poured concrete rather than paper white. */
      --bg: #EDEDEE; --surface: #FFFFFF; --surface-2: #F4F4F5; --line: #D6D6D9;
      --ink: #141416; --ink-dim: #6B6B72;
      /* Deep petrol — readable as text (8:1 on white), industrial, and deliberately not
         iOS blue. Yellow is reserved as a signal fill, never text, so it stays legible. */
      --accent: #A83F06; --accent-dim: rgba(237,98,1,0.12);
      /* Calibrated plate colours: 15kg yellow for PRs and streaks, 10kg green for success,
         25kg red for destructive. The sport's own colour language, not a generic palette. */
      --energy: #96631A; --energy-dim: rgba(237,98,1,0.16);
      --fun-purple: #5B4B8A; --fun-pink: #C8102E; --fun-teal: #2A7F8F;
      --fun-green: #1E7A4C; --fun-green-dim: rgba(30,122,76,0.14);
      --danger: #C8102E;
      /* One superfamily in three roles — the way equipment is labelled. */
      --font-display: 'Barlow Condensed', 'Barlow', sans-serif;
      --font-body: 'Barlow', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      /* Three-step radius scale. Instruments have consistent corners. */
      --r-sm: 4px; --r-md: 8px; --r-lg: 12px;
    }
    [data-theme="dark"] {
      --bg: #0A0A0B; --surface: #151517; --surface-2: #1E1E21; --line: #2C2C31;
      --ink: #F2F2F3; --ink-dim: #8A8A90;
      --accent: #FF7A29; --accent-dim: rgba(255,122,41,0.16);
      --energy: #FFB443; --energy-dim: rgba(255,180,67,0.16);
      --fun-purple: #8E7CC3; --fun-pink: #E23A52; --fun-teal: #45A8B8;
      --fun-green: #35B87A; --fun-green-dim: rgba(53,184,122,0.18);
      --danger: #E23A52;
    }
    body { transition: background-color 0.25s ease; }
    [data-theme="dark"] input, [data-theme="dark"] select, [data-theme="dark"] textarea { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    html, body { margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--ink); font-family: var(--font-body); line-height: 1.6; }
    #root { min-height: 100vh; }
    input, select, textarea { font-family: var(--font-mono); font-size: 16px; -webkit-appearance: none; -moz-appearance: none; appearance: none; }
    input:focus, select:focus, textarea:focus { outline: none; box-shadow: 0 0 0 3px rgba(0,122,255,0.2); }
    button { -webkit-appearance: none; -moz-appearance: none; appearance: none; }
    button { transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1); }
    button:active { transform: scale(0.93); }
    ::placeholder { color: #D2D2D7; }
    @keyframes prPulse { 0% { transform: scale(1); } 30% { transform: scale(1.06); } 100% { transform: scale(1); } }
    @keyframes navPop { 0% { transform: scale(0.7); opacity: 0.5; } 60% { transform: scale(1.1); } 100% { transform: scale(1); opacity: 1; } }
    @keyframes cardIn { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }
    @keyframes prGlow { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,149,0,0.45); } 50% { box-shadow: 0 0 0 10px rgba(255,149,0,0); } }
    @keyframes checkBounce {
      0% { transform: scale(1); }
      35% { transform: scale(1.28) rotate(-6deg); }
      60% { transform: scale(0.94) rotate(3deg); }
      100% { transform: scale(1) rotate(0); }
    }
    @keyframes rowFlash {
      0% { background-color: var(--accent-dim); }
      100% { background-color: transparent; }
    }
    @keyframes flameFlicker {
      0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
      25% { transform: scale(1.08) rotate(-3deg); opacity: 0.92; }
      50% { transform: scale(0.96) rotate(2deg); opacity: 1; }
      75% { transform: scale(1.05) rotate(-1deg); opacity: 0.95; }
    }
    @keyframes confettiBurst {
      0% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
      100% { transform: var(--fly) rotate(var(--spin)) scale(0.4); opacity: 0; }
    }
    @keyframes bouncePlate {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(180deg); }
    }
    @keyframes dotPulse {
      0%, 80%, 100% { opacity: 0.25; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1); }
    }
    @keyframes sheetFadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes sheetSlideUp {
      0% { transform: translateY(100%); }
      100% { transform: translateY(0); }
    }
  </style>
  <script>
    // Service worker registration. Everything the app needs is already inlined in this
    // single file, so there are no assets to cache individually — but the browser still
    // has to FETCH this page on launch. Without a service worker, opening the app in a
    // gym with no signal can fail on that first request, which would undo the point of
    // inlining the fonts, logo and React in the first place.
    //
    // The worker is registered from a Blob URL rather than a separate .sw.js file so the
    // app stays a genuinely single-file deploy — you keep pasting one index.html and
    // nothing else. Registration is wrapped in try/catch and gated on support, because
    // service workers are unavailable in some contexts (private browsing, file://
    // protocol) and a failure there must never stop the app from loading.
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      window.addEventListener("load", function () {
        try {
          var swCode = [
            "var CACHE = 'tonygainz-v1';",
            // Cache the page shell on install so a cold, offline launch works.
            "self.addEventListener('install', function (e) {",
            "  self.skipWaiting();",
            "  e.waitUntil(caches.open(CACHE).then(function (c) { return c.addAll(['./']).catch(function(){}); }));",
            "});",
            "self.addEventListener('activate', function (e) {",
            // Drop caches from older versions so a redeploy can't serve a stale app.
            "  e.waitUntil(caches.keys().then(function (keys) {",
            "    return Promise.all(keys.map(function (k) { return k === CACHE ? null : caches.delete(k); }));",
            "  }).then(function () { return self.clients.claim(); }));",
            "});",
            // Network-first for navigations: you always get the newest deploy when
            // online, and fall back to the cached page only when the network fails.
            // Cache-first would be faster but would strand you on an old build.
            "self.addEventListener('fetch', function (e) {",
            "  if (e.request.method !== 'GET') return;",
            "  if (e.request.mode === 'navigate') {",
            "    e.respondWith(",
            "      fetch(e.request).then(function (res) {",
            "        var copy = res.clone();",
            "        caches.open(CACHE).then(function (c) { c.put('./', copy); });",
            "        return res;",
            "      }).catch(function () {",
            "        return caches.match('./').then(function (r) { return r || Response.error(); });",
            "      })",
            "    );",
            "  }",
            "});"
          ].join("\n");
          var blob = new Blob([swCode], { type: "text/javascript" });
          navigator.serviceWorker.register(URL.createObjectURL(blob), { scope: "./" })
            .catch(function () { /* offline caching unavailable — app still works normally */ });
        } catch (err) { /* never let SW setup block the app */ }
      });
    }
  </script>

{label:"Core",exercises:[{id:"situp",name:"Sit-Up",group:"Core",equipment:"Bodyweight",type:"isolation",sets:3,repsMin:15,repsMax:20,restSec:45},{id:"crunch",name:"Crunch",group:"Core",equipment:"Bodyweight",type:"isolation",sets:3,repsMin:15,repsMax:20,restSec:45},{id:"hanging_leg_raise",name:"Hanging Leg Raise",group:"Core",equipment:"Bodyweight",type:"isolation",sets:3,repsMin:10,repsMax:15,restSec:60},{id:"cable_crunch",name:"Cable Crunch",group:"Core",equipment:"Cable",type:"isolation",sets:3,repsMin:12,repsMax:15,restSec:60},{id:"ab_wheel",name:"Ab Wheel Rollout",group:"Core",recommended:true,equipment:"Bodyweight",type:"isolation",sets:3,repsMin:8,repsMax:12,restSec:60},{id:"russian_twist",name:"Russian Twist",group:"Core",equipment:"Bodyweight",type:"isolation",sets:3,repsMin:15,repsMax:20,restSec:45},{id:"mountain_climbers",name:"Mountain Climbers",group:"Core",equipment:"Bodyweight",type:"isolation",sets:3,repsMin:20,repsMax:30,restSec:45},{id:"plank",name:"Plank",group:"Core",equipment:"Bodyweight",type:"isolation",sets:3,repsMin:30,repsMax:60,restSec:45,isTimeBased:true},{id:"hollow_hold",name:"Hollow Body Hold",group:"Core",equipment:"Bodyweight",type:"isolation",sets:3,repsMin:20,repsMax:40,restSec:60,isTimeBased:true},{id:"lsit",name:"L-Sit",group:"Core",equipment:"Bodyweight",type:"isolation",sets:3,repsMin:10,repsMax:30,restSec:90,isTimeBased:true},{id:"dragon_flag",name:"Dragon Flag",group:"Core",equipment:"Bodyweight",type:"isolation",sets:3,repsMin:5,repsMax:8,restSec:90},{id:"kb_turkish_getup",name:"Turkish Get-Up",group:"Core",equipment:"Kettlebell",type:"compound",sets:3,repsMin:3,repsMax:5,restSec:120},{id:"kb_windmill",name:"Kettlebell Windmill",group:"Core",equipment:"Kettlebell",type:"isolation",sets:3,repsMin:5,repsMax:8,restSec:60},{id:"kb_farmer_carry",name:"KB Farmer Carry",group:"Core",equipment:"Kettlebell",type:"compound",sets:3,repsMin:30,repsMax:60,restSec:90,isTimeBased:true}]},mobility:{label:"Mobility & Yoga",exercises:[{id:"downward_dog",name:"Downward Dog",group:"Mobility",equipment:"Bodyweight",type:"isolation",sets:3,repsMin:30,repsMax:60,restSec:20,isTimeBased:true,cue:"Hands shoulder-width, hips high and back, heels reaching toward the floor (they don't need to touch). Stretches calves, hamstrings and shoulders together. Press the floor away rather than sinking into your wrists — bend your knees if your hamstrings pull you into a rounded back."},{id:"pigeon_pose",name:"Pigeon Pose",group:"Mobility",recommended:true,equipment:"Bodyweight",type:"isolation",sets:2,repsMin:45,repsMax:90,restSec:20,isTimeBased:true,cue:"Front shin angled under your torso, back leg extended straight behind you. Deep into the hip external rotators and glute of the front leg — the one most lifters need most after heavy squats or deadlifts. Square your hips to the front rather than letting them twist open."},{id:"couch_stretch",name:"Couch Stretch",group:"Mobility",recommended:true,equipment:"Bodyweight",type:"isolation",sets:2,repsMin:45,repsMax:90,restSec:20,isTimeBased:true,cue:"Back knee down with that shin up a wall or couch, front foot forward in a lunge. The single best stretch for hip flexors that have been shortened by sitting all day — a real limiter on squat depth and lockout for a lot of lifters. Squeeze the glute on the back leg to deepen it."},{id:"warrior_two",name:"Warrior II",group:"Mobility",equipment:"Bodyweight",type:"isolation",sets:2,repsMin:30,repsMax:60,restSec:20,isTimeBased:true,cue:"Wide stance, front knee bent to 90°, back leg straight, arms extended parallel to the floor. Builds hip and inner-thigh mobility while genuinely loading the front leg's quad and glute isometrically — it's a stretch that also asks something of you."},{id:"triangle_pose",name:"Triangle Pose",group:"Mobility",equipment:"Bodyweight",type:"isolation",sets:2,repsMin:30,repsMax:45,restSec:20,isTimeBased:true,cue:"Legs wide, front leg straight, hinge at the hip to reach your front hand toward your shin or the floor, back arm reaching up. Opens the side body, hamstrings and inner thigh in one line. Lengthen through the crown of your head rather than collapsing down."},{id:"cobra_pose",name:"Cobra Pose",group:"Mobility",equipment:"Bodyweight",type:"isolation",sets:3,repsMin:20,repsMax:45,restSec:20,isTimeBased:true,cue:"Lying face down, press through your hands to lift your chest, elbows staying soft rather than locked out. Extends the spine and opens the front of the shoulders and hips after a day of sitting or a heavy pressing session. Keep the lift coming from your back, not just your arms pushing."},{id:"childs_pose",name:"Child's Pose",group:"Mobility",equipment:"Bodyweight",type:"isolation",sets:2,repsMin:45,repsMax:90,restSec:15,isTimeBased:true,cue:"Kneel and fold forward, arms extended or resting by your sides, forehead down. A genuine rest position — gentle traction through the lower back and a stretch through the lats. The one pose here that's as much about the nervous system settling as the muscles."},{id:"cat_cow",name:"Cat-Cow Flow",group:"Mobility",equipment:"Bodyweight",type:"isolation",sets:2,repsMin:30,repsMax:60,restSec:15,isTimeBased:true,cue:"On hands and knees, alternate arching your back toward the ceiling (cat) and dropping your belly while lifting your chest (cow). Moves the spine through flexion and extension rather than holding one end — the closest thing here to active mobility instead of a static stretch."},{id:"seated_forward_fold",name:"Seated Forward Fold",group:"Mobility",equipment:"Bodyweight",type:"isolation",sets:2,repsMin:45,repsMax:90,restSec:20,isTimeBased:true,cue:"Seated, legs extended, hinge from the hips to fold over your legs. Targets hamstrings and the lower back directly. Reach from your hips rather than rounding your upper back to get your hands further — the fold should come from the joint that's actually tight."},{id:"lizard_pose",name:"Lizard Pose",group:"Mobility",equipment:"Bodyweight",type:"isolation",sets:2,repsMin:30,repsMax:60,restSec:20,isTimeBased:true,cue:"Deep lunge with your front foot outside your hands, back leg extended. A stronger version of the couch stretch's hip-flexor work, adding groin and inner-thigh on the front leg. Drop to your forearms to go deeper once the basic position feels stable."},{id:"thread_the_needle",name:"Thread the Needle",group:"Mobility",equipment:"Bodyweight",type:"isolation",sets:2,repsMin:30,repsMax:45,restSec:15,isTimeBased:true,cue:"On hands and knees, slide one arm under your body and rest your shoulder and ear on the floor. Rotates through the thoracic spine and stretches that shoulder and upper back — the mobility most people are missing before overhead pressing."},{id:"bridge_pose",name:"Bridge Pose",group:"Mobility",equipment:"Bodyweight",type:"isolation",sets:3,repsMin:30,repsMax:60,restSec:20,isTimeBased:true,cue:"Lying on your back, feet flat, drive your hips up by squeezing your glutes. Opens the front of the hips while genuinely loading the glutes and hamstrings isometrically — useful after a day of sitting, which leaves both the front hip tight and the glutes underused."},{id:"happy_baby",name:"Happy Baby",group:"Mobility",equipment:"Bodyweight",type:"isolation",sets:2,repsMin:30,repsMax:60,restSec:15,isTimeBased:true,cue:"On your back, grab the outside edges of your feet, knees pulled toward your armpits. Opens the hips and inner thigh while giving the lower back gentle traction against the floor. A good pose to end a session on — low-key and genuinely relaxing."},{id:"90_90_hip",name:"90/90 Hip Switch",group:"Mobility",equipment:"Bodyweight",type:"isolation",sets:3,repsMin:30,repsMax:60,restSec:20,isTimeBased:true,cue:"Seated, both knees bent to 90°, one leg in front and one to the side. Works internal and external hip rotation in the same position — a genuine gap in most people's mobility that stretching the hip flexor alone never touches. Keep your torso upright rather than leaning back."},{id:"wall_angel",name:"Wall Angels",group:"Mobility",equipment:"Bodyweight",type:"isolation",sets:3,repsMin:30,repsMax:45,restSec:20,isTimeBased:true,cue:"Back flat against a wall, arms in a goalpost position, slide them up and down while keeping contact with the wall. Trains shoulder mobility and upper-back control together — most people's shoulders can't do this smoothly at first, which is exactly the point of doing it."},{id:"deep_squat_hold",name:"Deep Squat Hold",group:"Mobility",recommended:true,equipment:"Bodyweight",type:"isolation",sets:3,repsMin:45,repsMax:120,restSec:30,isTimeBased:true,cue:"Feet flat, hips below knee height, chest up. The single best test of ankle, hip and thoracic mobility all at once — if you can sit here comfortably with heels down, most other mobility work gets easier. Use a doorframe or rack to hold onto if your heels lift."}]}};const EXERCISE_LIBRARY_FLAT=Object.values(EXERCISE_LIBRARY).flatMap(g=>g.exercises);function findLibraryExercise(id,customExercises){return EXERCISE_LIBRARY_FLAT.find(e=>e.id===id)||(customExercises||[]).find(e=>e.id===id);}const WORKOUT_TEMPLATES={full_body_3x:{name:"Full Body 3x",description:"3 days/week, hitting all muscle groups each session. Best for beginners and busy schedules.",daysPerWeek:3,pattern:["Full Body","Rest","Full Body","Rest","Full Body","Rest","Rest"]},five_by_five:{name:"5×5 Strength",description:"3 days/week, alternating two full-body workouts. The classic beginner barbell strength program — heavy compound lifts, 5 sets of 5.",daysPerWeek:3,pattern:["Workout A","Rest","Workout B","Rest","Workout A","Rest","Rest"]},upper_lower:{name:"Upper/Lower Split",description:"4 days/week alternating upper and lower body. Good for intermediate lifters.",daysPerWeek:4,pattern:["Upper","Lower","Rest","Upper","Lower","Rest","Rest"]},ppl:{name:"Push/Pull/Legs",description:"6 days/week: Push (chest/shoulders/triceps), Pull (back/biceps), Legs. High volume for advanced.",daysPerWeek:6,pattern:["Push","Pull","Legs","Push","Pull","Legs","Rest   :root {
      /* Concrete-and-steel neutrals, not iOS greys. Gym lighting is bright and flat, so the
         light theme reads as poured concrete rather than paper white. */
      --bg: #EDEDEE; --surface: #FFFFFF; --surface-2: #F4F4F5; --line: #D6D6D9;
      --ink: #141416; --ink-dim: #6B6B72;
      /* Deep petrol — readable as text (8:1 on white), industrial, and deliberately not
         iOS blue. Yellow is reserved as a signal fill, never text, so it stays legible. */
      --accent: #A83F06; --accent-dim: rgba(237,98,1,0.12);
      /* Calibrated plate colours: 15kg yellow for PRs and streaks, 10kg green for success,
         25kg red for destructive. The sport's own colour language, not a generic palette. */
      --energy: #96631A; --energy-dim: rgba(237,98,1,0.16);
      --fun-purple: #5B4B8A; --fun-pink: #C8102E; --fun-teal: #2A7F8F;
      --fun-green: #1E7A4C; --fun-green-dim: rgba(30,122,76,0.14);
      --danger: #C8102E;
      /* One superfamily in three roles — the way equipment is labelled. */
      --font-display: 'Barlow Condensed', 'Barlow', sans-serif;
      --font-body: 'Barlow', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      /* Three-step radius scale. Instruments have consistent corners. */
      --r-sm: 4px; --r-md: 8px; --r-lg: 12px;
    }
  [data-theme="dark"] {
      --bg: #0A0A0B; --surface: #151517; --surface-2: #1E1E21; --line: #2C2C31;
      --ink: #F2F2F3; --ink-dim: #8A8A90;
      --accent: #FF7A29; --accent-dim: rgba(255,122,41,0.16);
      --energy: #FFB443; --energy-dim: rgba(255,180,67,0.16);
      --fun-purple: #8E7CC3; --fun-pink: #E23A52; --fun-teal: #45A8B8;
      --fun-green: #35B87A; --fun-green-dim: rgba(53,184,122,0.18);
      --danger: #E23A52;
    }
  * { box-sizing: border-box; }
  input, select, textarea { font-family: var(--font-mono); font-size: 16px; } /* Prevent zoom on iOS */
  input:focus, select:focus, textarea:focus, button:focus-visible { outline: 3px solid var(--accent-dim); outline-offset: 2px; }
  ::placeholder { color: #D2D2D7; }
  @keyframes spin { to { transform: rotate(360deg); } }
  
  /* Mobile responsive */
  @media (max-width: 480px) {
    :root { font-size: 13px; }
    body { margin: 0; padding: 0; }
  }
