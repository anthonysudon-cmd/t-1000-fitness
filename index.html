function Measurements({ data, setData }) {
  const [chest, setChest] = useState("");
  const [arm, setArm] = useState("");
  const [waist, setWaist] = useState("");
  const [leg, setLeg] = useState("");

  const hasAnyValue = chest !== "" || arm !== "" || waist !== "" || leg !== "";

  const logMeasurement = () => {
    // Any one field is enough — someone tracking only their waist shouldn't be forced to
    // also measure chest/arm/leg just to log anything at all. Missing fields are stored as
    // null (not 0, and not silently dropped from the chart's timeline — see SimpleLineChart's
    // null-aware line handling), so the trend chart shows a genuine gap, not a fake dip.
    if (!hasAnyValue) return;
    const entry = {
      date: todayStr(),
      chest: chest !== "" ? +chest : null,
      arm: arm !== "" ? +arm : null,
      waist: waist !== "" ? +waist : null,
      leg: leg !== "" ? +leg : null,
    };
    setData({ ...data, measurements: [...data.measurements, entry] });
    setChest(""); setArm(""); setWaist(""); setLeg("");
  };

  const chartData = [...data.measurements]
    .sort((a, b) => a.date.localeCompare(b.date))
    .slice(-12)
    .map(m => ({
      date: fmtDate(m.date),
      chest: m.chest,
      arm: m.arm,
      waist: m.waist,
      leg: m.leg,
    }));

  return (
    <div style={styles.stack}>
      <Card title="Log body measurements (inches)">
        <div style={{ fontSize: 12, color: "var(--ink-dim)", marginBottom: 10 }}>
          Fill in whichever you're tracking today — you don't need all four.
        </div>
        <div style={styles.formGrid3}>
          <Field label="Chest"><input type="number" inputMode="decimal" step="0.1" min="20" max="80" style={styles.input} value={chest} onChange={(e) => setChest(e.target.value)} onBlur={(e) => { const v = +e.target.value; if (e.target.value !== "" && !isNaN(v)) setChest(String(Math.max(20, Math.min(80, v)))); }} /></Field>
          <Field label="Arm"><input type="number" inputMode="decimal" step="0.1" min="8" max="25" style={styles.input} value={arm} onChange={(e) => setArm(e.target.value)} onBlur={(e) => { const v = +e.target.value; if (e.target.value !== "" && !isNaN(v)) setArm(String(Math.max(8, Math.min(25, v)))); }} /></Field>
          <Field label="Waist"><input type="number" inputMode="decimal" step="0.1" min="20" max="70" style={styles.input} value={waist} onChange={(e) => setWaist(e.target.value)} onBlur={(e) => { const v = +e.target.value; if (e.target.value !== "" && !isNaN(v)) setWaist(String(Math.max(20, Math.min(70, v)))); }} /></Field>
          <Field label="Leg"><input type="number" inputMode="decimal" step="0.1" min="15" max="40" style={styles.input} value={leg} onChange={(e) => setLeg(e.target.value)} onBlur={(e) => { const v = +e.target.value; if (e.target.value !== "" && !isNaN(v)) setLeg(String(Math.max(15, Math.min(40, v)))); }} /></Field>
        </div>
        <button style={{ ...styles.primaryBtn, opacity: hasAnyValue ? 1 : 0.5 }} disabled={!hasAnyValue} onClick={logMeasurement}><Plus size={14} /> Log measurements</button>
      </Card>

      {data.measurements.length === 1 && (
        <Card title="Measurement trends">
          <div style={styles.dimSmall}>Log measurements at least twice (ideally every 2 weeks) to see trends and track progress.</div>
        </Card>
      )}

      {data.measurements.length > 1 && (
        <Card title="Measurement trends">
          <SimpleLineChart
            data={chartData}
            lines={[
              { key: "chest", color: "#C9A24B" },
              { key: "arm", color: "#5FA8A0" },
              { key: "waist", color: "#C1502E" },
              { key: "leg", color: "#8FA5B3" },
            ]}
            height={180}
          />
          <div style={{ display: "flex", gap: 14, marginTop: 10, fontSize: 11, color: "var(--ink-dim)", flexWrap: "wrap" }}>
            <span><span style={{ display: "inline-block", width: 8, height: 8, borderRadius: 4, background: "#C9A24B", marginRight: 4 }} />Chest</span>
            <span><span style={{ display: "inline-block", width: 8, height: 8, borderRadius: 4, background: "#5FA8A0", marginRight: 4 }} />Arm</span>
            <span><span style={{ display: "inline-block", width: 8, height: 8, borderRadius: 4, background: "#C1502E", marginRight: 4 }} />Waist</span>
            <span><span style={{ display: "inline-block", width: 8, height: 8, borderRadius: 4, background: "#8FA5B3", marginRight: 4 }} />Leg</span>
          </div>
        </Card>
      )}

      {data.measurements.length > 0 && (
        <Card title="History">
          <div style={styles.logList}>
            {[...data.measurements].reverse().slice(0, 8).map((m, i) => (
              <div key={i} style={styles.logRow}>
                <span style={styles.dim}>{fmtDate(m.date)}</span>
                <span style={styles.mono}>C:{m.chest ?? "—"} A:{m.arm ?? "—"} W:{m.waist ?? "—"} L:{m.leg ?? "—"}</span>
              </div>
            ))}
          </div>
        </Card>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------
   CARDIO
--------------------------------------------------------------- */
function Sauna({ data, setData }) {
  const [startTime, setStartTime] = useState(null);
  const [elapsed, setElapsed] = useState(0);
  const [savedMsg, setSavedMsg] = useState("");
  const tickRef = useRef(null);

  // Same real-timestamp approach as the rest timer: elapsed is always recomputed from the
  // actual clock, never accumulated tick by tick, so backgrounding the app (very likely
  // here — phone down, sitting in the heat) can't cause drift.
  tickRef.current = () => {
    if (!startTime) return;
    setElapsed(Math.floor((Date.now() - startTime) / 1000));
  };

  useEffect(() => {
    if (!startTime) return;
    tickRef.current();
    const interval = setInterval(() => tickRef.current(), 1000);
    return () => clearInterval(interval);
  }, [startTime]);

  useEffect(() => {
    const handleVisible = () => { if (document.visibilityState === "visible") tickRef.current(); };
    document.addEventListener("visibilitychange", handleVisible);
    window.addEventListener("focus", handleVisible);
    return () => {
      document.removeEventListener("visibilitychange", handleVisible);
      window.removeEventListener("focus", handleVisible);
    };
  }, []);

  const stage = getSaunaStage(elapsed);
  const mm = String(Math.floor(elapsed / 60)).padStart(2, "0");
  const ss = String(elapsed % 60).padStart(2, "0");
  const minutes = elapsed / 60;
  const pastRecommended = minutes >= 22;

  function finishSession() {
    const mins = Math.max(1, Math.round(elapsed / 60));
    const entry = { date: todayStr(), type: "Sauna", minutes: mins };
    setData({
      ...data,
      recoveryLog: [...(data.recoveryLog || []), entry],
      lastLogDate: todayStr(),
    });
    setStartTime(null);
    setElapsed(0);
    // The app spends the whole session explaining that past ~22 minutes you're adding
    // strain rather than benefit — so logging a much longer session with a plain green
    // checkmark would quietly contradict that, treating it as an equally good outcome.
    // Acknowledge it honestly instead, without scolding: note it, suggest rehydrating.
    if (mins >= 25) {
      setSavedMsg(`Logged ${mins} min — longer than the 15–20 min used in research protocols. Rehydrate well, and consider a shorter session next time.`);
    } else {
      setSavedMsg(`✅ Logged ${mins} min sauna session`);
    }
    setTimeout(() => setSavedMsg(""), 6000);
  }

  const recentSessions = (data.recoveryLog || [])
    .filter(e => e.type === "Sauna")
    .slice(-5)
    .reverse();

  return (
    <div style={styles.stack}>
      <Card title="Sauna">
        {!startTime ? (
          <div>
            <div style={{ fontSize: 13, color: "var(--ink-dim)", lineHeight: 1.5, marginBottom: 16 }}>
              Track a session and follow what's happening in your body, phase by phase, as core temperature rises.
            </div>

            {/* Preview the whole arc before starting — seeing the six stages laid out with
                their timings is far more motivating than a bare start button, and sets a
                clear expectation that this has a natural endpoint. */}
            <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 18 }}>
              {SAUNA_STAGES.map((s) => (
                <div key={s.title} style={{
                  display: "flex", alignItems: "center", gap: 10,
                  padding: "10px 12px", borderRadius: "var(--r-md)", border: "1px solid var(--line)",
                }}>
                  <span style={{ fontSize: 17, flexShrink: 0 }}>{s.icon}</span>
                  <span style={{ flex: 1, minWidth: 0, display: "flex", flexDirection: "column" }}>
                    <span style={{
                      fontFamily: "var(--font-display)", fontSize: 13, fontWeight: 700,
                      letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--ink)",
                    }}>
                      {s.title}
                    </span>
                    {/* The one-line hook for each phase, so the arc reads as a story worth
                        sitting through rather than six unlabelled timestamps. */}
                    <span style={{ fontSize: 12, color: "var(--ink-dim)", marginTop: 2, overflowWrap: "break-word" }}>
                      {s.headline}
                    </span>
                  </span>
                  <span style={{ fontFamily: "var(--font-mono)", fontSize: 11, color: "var(--ink-dim)", flexShrink: 0 }}>
                    {s.minMinute} min
                  </span>
                </div>
              ))}
            </div>

            <button style={{ ...styles.primaryBtn, width: "100%", justifyContent: "center" }} onClick={() => { setStartTime(Date.now()); setElapsed(0); }}>
              <Play size={15} /> Start sauna session
            </button>
            {savedMsg && (
              <div style={{
                fontSize: 13, marginTop: 12, fontWeight: 600, lineHeight: 1.5,
                color: savedMsg.startsWith("✅") ? "var(--fun-green)" : "var(--energy)",
              }}>
                {savedMsg}
              </div>
            )}
          </div>
        ) : (
          <div>
            <div style={{ textAlign: "center", marginBottom: 18 }}>
              <div style={{
                fontFamily: "var(--font-mono)", fontSize: 44, fontWeight: 700,
                color: pastRecommended ? "var(--energy)" : "var(--ink)", lineHeight: 1,
                fontVariantNumeric: "tabular-nums", letterSpacing: "0.02em",
              }}>
                {mm}:{ss}
              </div>
              {(() => {
                // Countdown to the next stage — the single most motivating number here,
                // because it turns "sit and wait" into "90 seconds until the next thing
                // actually happens in my body."
                const nextStage = SAUNA_STAGES.find(s => minutes < s.minMinute);
                if (!nextStage) return null;
                const secsToNext = Math.max(0, Math.ceil(nextStage.minMinute * 60 - elapsed));
                const nm = Math.floor(secsToNext / 60);
                const ns = secsToNext % 60;
                return (
                  <div style={{ fontSize: 12, color: "var(--ink-dim)", marginTop: 6 }}>
                    {nextStage.icon} <strong style={{ color: "var(--accent)" }}>{nm}:{String(ns).padStart(2, "0")}</strong> until {nextStage.title}
                  </div>
                );
              })()}
            </div>

            {/* The full journey, not just the current moment — every stage visible at once so
                there's always something concrete ahead to look forward to. Reached stages stay
                readable (you earned them), the current one is highlighted with its full
                explanation, and upcoming ones are dimmed but legible so you can see exactly
                what's coming and when. */}
            <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 16 }}>
              {SAUNA_STAGES.map((s) => {
                const isCurrent = s.title === stage.title;
                const isReached = minutes >= s.minMinute;
                const isFinalWarning = s.minMinute >= 22;
                return (
                  <div
                    key={s.title}
                    style={{
                      display: "flex", gap: 12, padding: isCurrent ? "14px 16px" : "10px 12px",
                      borderRadius: "var(--r-md)",
                      background: isCurrent
                        ? (isFinalWarning ? "var(--energy-dim)" : "var(--accent-dim)")
                        : "transparent",
                      border: isCurrent ? "none" : "1px solid var(--line)",
                      opacity: isReached || isCurrent ? 1 : 0.55,
                      transition: "opacity 0.4s ease, background 0.4s ease, padding 0.3s ease",
                    }}
                  >
                    <div style={{
                      fontSize: isCurrent ? 24 : 18, lineHeight: 1.1, flexShrink: 0,
                      filter: isReached || isCurrent ? "none" : "grayscale(0.7)",
                    }}>
                      {s.icon}
                    </div>
                    <div style={{ minWidth: 0, flex: 1 }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                        {/* Matches the app's card-title treatment: display font, uppercase,
                            letter-spaced. Every other heading in TonyGainz reads this way. */}
                        <span style={{
                          fontFamily: "var(--font-display)",
                          fontSize: isCurrent ? 15 : 13,
                          letterSpacing: "0.08em",
                          textTransform: "uppercase",
                          fontWeight: 700,
                          color: isCurrent ? "var(--ink)" : "var(--ink-dim)",
                        }}>
                          {s.title}
                        </span>
                        {isReached && !isCurrent && (
                          <span style={{ fontSize: 11, color: "var(--fun-green)", fontWeight: 700 }}>✓</span>
                        )}
                        {!isReached && (
                          <span style={{ fontFamily: "var(--font-mono)", fontSize: 11, color: "var(--ink-dim)" }}>
                            {s.minMinute} min
                          </span>
                        )}
                      </div>
                      {/* Full explanation only for the stage you're actually in — the others
                          stay as compact titles so the whole arc fits on screen at once. */}
                      {isCurrent && (
                        <>
                          <div style={{
                            fontSize: 13, fontWeight: 700, color: "var(--accent)",
                            marginTop: 4, letterSpacing: "0.01em",
                          }}>
                            {s.headline}
                          </div>
                          <div style={{ fontSize: 13, color: "var(--ink)", lineHeight: 1.55, marginTop: 6, minWidth: 0, overflowWrap: "break-word" }}>
                            {s.body}
                          </div>
                        </>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>

            <button style={{ ...styles.primaryBtn, width: "100%", justifyContent: "center" }} onClick={finishSession}>
              <Check size={15} /> Finish & log session
            </button>
            <button
              style={{ ...styles.secondaryBtn, width: "100%", justifyContent: "center", marginTop: 8 }}
              onClick={() => { setStartTime(null); setElapsed(0); }}
            >
              Cancel
            </button>
          </div>
        )}
      </Card>

      {/* Benefits, tiered by evidence strength rather than presented as a flat list. A
          fitness app is exactly where sauna claims get overstated — much of the popular
          "sauna reduces mortality" material traces to observational cohorts that can't
          separate sauna use from the health and habits of people who use saunas regularly.
          Separating well-established physiology from promising-but-unproven associations is
          the honest way to present this, and it's more useful: it tells you which effects
          you can actually count on. */}
      <Card title="What the evidence supports">
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>

          <div>
            <div style={{
              fontFamily: "var(--font-display)", fontSize: 12, fontWeight: 700,
              letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--fun-green)",
              marginBottom: 6,
            }}>
              Well established
            </div>
            <div style={{ fontSize: 12.5, color: "var(--ink)", lineHeight: 1.6 }}>
              <strong>Cardiovascular conditioning.</strong> The heart-rate and blood-flow response
              is real and measurable — comparable to light-to-moderate exercise. Repeated exposure
              produces adaptations similar in kind to aerobic training, including improved blood
              vessel function.
              <br /><br />
              <strong>Heat acclimation.</strong> Regular sessions genuinely improve heat tolerance:
              you sweat sooner, sweat more, and retain plasma volume better. This is well
              characterised and directly useful if you train or work in heat.
              <br /><br />
              <strong>Post-exercise relaxation.</strong> Reduced muscle tension and
              parasympathetic ("rest and digest") activation after a session are consistently
              observed, and are the most reliable thing most people actually feel.
            </div>
          </div>

          <div>
            <div style={{
              fontFamily: "var(--font-display)", fontSize: 12, fontWeight: 700,
              letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--energy)",
              marginBottom: 6,
            }}>
              Promising, not proven
            </div>
            <div style={{ fontSize: 12.5, color: "var(--ink)", lineHeight: 1.6 }}>
              <strong>Cardiovascular and mortality outcomes.</strong> Large Finnish cohort studies
              report lower cardiovascular and all-cause mortality among frequent sauna users. These
              are observational: people who sauna four to seven times weekly differ from those who
              don't in income, baseline fitness, and health status. The association is strong and
              consistent, but causation isn't established.
              <br /><br />
              <strong>Muscle recovery and growth.</strong> Heat shock proteins have a plausible
              role in limiting muscle protein breakdown, but human training studies are small and
              mixed. Reasonable to expect modest recovery benefit; not reasonable to treat sauna as
              a substitute for sleep, protein, or sensible programming.
            </div>
          </div>

          <div>
            <div style={{
              fontFamily: "var(--font-display)", fontSize: 12, fontWeight: 700,
              letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--danger)",
              marginBottom: 6,
            }}>
              Common misconceptions
            </div>
            <div style={{ fontSize: 12.5, color: "var(--ink)", lineHeight: 1.6 }}>
              <strong>Fat loss.</strong> Weight lost in a sauna is water and returns on rehydrating.
              The calorie cost of a session is modest — comparable to a short easy walk, not a workout.
              <br /><br />
              <strong>"Detoxification."</strong> Sweat is overwhelmingly water and electrolytes.
              Your liver and kidneys handle clearance; measurable toxin excretion through sweat is
              negligible.
              <br /><br />
              <strong>Longer is better.</strong> Adaptations were measured at 15–20 minutes.
              Extending sessions adds strain without a matching increase in benefit.
            </div>
          </div>

        </div>
      </Card>

      <Card title="Safety & contraindications">
        <div style={{ fontSize: 12, color: "var(--ink-dim)", lineHeight: 1.6 }}>
          Research protocols typically use 15–20 minute sessions at 80–100°C. Get out immediately if you
          feel dizzy, nauseated, disoriented, or notice your heart pounding or skipping — those signal
          heat strain, not adaptation, and pushing through them is how sauna use turns dangerous.
          Hydrate before and after. Avoid alcohol entirely: it interferes with your body's ability to
          regulate temperature and raises the risk of irregular heartbeats. Stand up slowly on the way
          out — your blood vessels are dilated, so blood pressure can drop sharply and cause fainting
          (orthostatic hypotension). Talk to a doctor before using a sauna if you're pregnant, or if
          you have heart disease, chest pain, a recent heart attack, a narrowed aortic valve, low or
          unstable blood pressure, or any condition affecting how you handle heat.
        </div>
      </Card>

      {recentSessions.length > 0 && (
        <Card title="Recent sessions">
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {recentSessions.map((s, i) => (
              <div key={i} style={{ display: "flex", justifyContent: "space-between", fontSize: 13 }}>
                <span style={{ color: "var(--ink)" }}>{fmtDate(s.date)}</span>
                <span style={{ fontFamily: "var(--font-mono)", color: "var(--ink-dim)" }}>{s.minutes} min</span>
              </div>
            ))}
          </div>
        </Card>
      )}
    </div>
  );
}

function Cardio({ data, setData }) {
  const maxHr = estMaxHr(data.profile);
  const zones = [
    { zone: 1, label: "Recovery", lo: 0.5, hi: 0.6 },
    { zone: 2, label: "Aerobic", lo: 0.6, hi: 0.7 },
    { zone: 3, label: "Tempo", lo: 0.7, hi: 0.8 },
    { zone: 4, label: "Threshold", lo: 0.8, hi: 0.9 },
    { zone: 5, label: "VO2", lo: 0.9, hi: 1.0 },
  ].map(z => ({ ...z, loBpm: Math.round(z.lo * maxHr), hiBpm: Math.round(z.hi * maxHr) }));

  const [type, setType] = useState("Run");
  const [minutes, setMinutes] = useState("");
  const [avgHr, setAvgHr] = useState("");

  // Duration is the one thing a cardio session genuinely can't be logged without — but not
  // everyone has a heart rate monitor, and being forced to guess an HR number just to log
  // "went for a 30 min run" is exactly the kind of friction that makes people stop logging.
  const canLog = minutes !== "";

  const logCardio = () => {
    if (!canLog) return;
    let zone = null;
    if (avgHr !== "") {
      const pct = (+avgHr) / maxHr;
      zone = 1;
      for (let z of zones) {
        if (pct >= z.lo && pct < z.hi) { zone = z.zone; break; }
      }
      if (pct >= 1.0) zone = 5;
    }
    const entry = { date: todayStr(), type, minutes: +minutes, avgHr: avgHr !== "" ? +avgHr : null, zone };
    setData({ ...data, cardioLog: [...data.cardioLog, entry], lastLogDate: todayStr() });
    setMinutes(""); setAvgHr("");
  };

  // Merge two real sources into one trend line: cardio sessions you logged yourself, and
  // daily HR readings imported from Apple Health — the data the import flow below actually
  // writes to, which previously went into storage and was never shown anywhere again. When
  // both exist for the same day, the logged session's exercise-time average HR is more
  // specific and wins; the import fills in days you didn't log a session but still have data.
  const hrByDate = {};
  (data.hrImports || []).forEach(h => { if (h.hr) hrByDate[h.date] = h.hr; });
  data.cardioLog.forEach(c => { if (c.avgHr) hrByDate[c.date] = c.avgHr; });
  const chartData = Object.entries(hrByDate)
    .sort((a, b) => a[0].localeCompare(b[0]))
    .slice(-14)
    .map(([date, avgHr]) => ({ date: fmtDate(date), avgHr }));

  return (
    <div style={styles.stack}>
      <Card title={`Heart rate zones (Max HR ≈ ${maxHr} bpm)`}>
        <div style={styles.zoneList}>
          {zones.map(z => (
            <div key={z.zone} style={styles.zoneRow}>
              <div style={{ ...styles.zoneDot, background: zoneColor(z.zone) }} />
              <span>Z{z.zone} · {z.label}</span>
              <span style={styles.mono}>{z.loBpm}–{z.hiBpm}</span>
            </div>
          ))}
        </div>
      </Card>

      <Card title="Log cardio">
        <div style={{ fontSize: 12, color: "var(--ink-dim)", marginBottom: 10 }}>
          Avg HR is optional — leave it blank if you weren't tracking heart rate.
        </div>
        <div style={styles.formGrid3}>
          <Field label="Type">
            <select style={styles.input} value={type} onChange={(e) => setType(e.target.value)}>
              {["Run", "Row", "Bike", "Swim"].map(t => <option key={t}>{t}</option>)}
            </select>
          </Field>
          <Field label="Minutes"><input type="number" inputMode="numeric" min="1" max="300" style={styles.input} value={minutes} onChange={(e) => setMinutes(e.target.value)} onBlur={(e) => { const v = +e.target.value; if (e.target.value !== "" && !isNaN(v)) setMinutes(String(Math.max(1, Math.min(300, v)))); }} /></Field>
          <Field label="Avg HR (bpm) — optional"><input type="number" inputMode="numeric" min="30" max="220" style={styles.input} value={avgHr} onChange={(e) => setAvgHr(e.target.value)} onBlur={(e) => { const v = +e.target.value; if (e.target.value !== "" && !isNaN(v)) setAvgHr(String(Math.max(30, Math.min(220, v)))); }} onKeyDown={(e) => { if(e.key === "Enter" && canLog) logCardio(); }} placeholder="Press Enter to log" /></Field>
        </div>
        <button style={{ ...styles.primaryBtn, opacity: canLog ? 1 : 0.5 }} disabled={!canLog} onClick={logCardio}><Plus size={14} /> Log session</button>
      </Card>

      {chartData.length > 1 && (
        <Card title="HR trend">
          <SimpleLineChart data={chartData} lines={[{ key: "avgHr", color: "var(--accent)" }]} height={140} />
        </Card>
      )}
    </div>
  );
}

function zoneColor(z) {
  return ["#5FA8A0", "#5FA8A0", "#C9A24B", "#C1502E", "#C1502E"][z - 1];
}

/* ---------------------------------------------------------------
   HISTORY
--------------------------------------------------------------- */
function HistoryView({ data, setData }) {
  const [view, setView] = useState("sessions"); // sessions | progression | log
  const [selectedExId, setSelectedExId] = useState(null);
  const [expandedDate, setExpandedDate] = useState(null);
  const [confirmDeleteDate, setConfirmDeleteDate] = useState(null);

  // Group all strength entries into per-day sessions. Each set carries its exId + original
  // array index so a single set can be deleted precisely, even if duplicate weight/reps exist.
  const sessions = useMemo(() => {
    const byDate = {};
    Object.entries(data.strengthLog).forEach(([exId, arr]) => {
      const ex = data.exercises.find(e => e.id === exId);
      arr.forEach((h, idx) => {
        if (!byDate[h.date]) byDate[h.date] = { date: h.date, sets: [], totalReps: 0, totalVolume: 0, improvedCount: 0 };
        byDate[h.date].sets.push({ exId, idx, name: ex?.name || exId, ...h });
        byDate[h.date].totalReps += h.reps || 0;
        byDate[h.date].totalVolume += (h.weight || 0) * (h.reps || 0);
        if (h.improved) byDate[h.date].improvedCount += 1;
      });
    });
    return Object.values(byDate).sort((a, b) => b.date.localeCompare(a.date));
  }, [data]);

  // Recompute lastLogDate (used for the streak) after any deletion, since the deleted
  // date might have been the most recent logged day.
  // (moved to top-level — see recomputeLastLogDate near the other shared date utilities;
  // this was previously a local function only HistoryView could actually call, which would
  // have thrown a ReferenceError the moment LiveWorkout's delete-a-set needed the same logic)

  // Delete a single set — e.g. you logged a bad rep by mistake but the rest of the
  // session should still count.
  function deleteSet(exId, idx) {
    const nextStrengthLog = {
      ...data.strengthLog,
      [exId]: data.strengthLog[exId].filter((_, i) => i !== idx),
    };
    setData({
      ...data,
      strengthLog: nextStrengthLog,
      lastLogDate: recomputeLastLogDate(nextStrengthLog, data.cardioLog, data.recoveryLog),
    });
  }

  // Delete an entire workout day — every strength set logged that date, across every
  // exercise, e.g. for a test session you don't want to count at all.
  function deleteWholeSession(date) {
    const nextStrengthLog = {};
    Object.entries(data.strengthLog).forEach(([exId, arr]) => {
      nextStrengthLog[exId] = arr.filter(h => h.date !== date);
    });
    setData({
      ...data,
      strengthLog: nextStrengthLog,
      lastLogDate: recomputeLastLogDate(nextStrengthLog, data.cardioLog, data.recoveryLog),
    });
    setConfirmDeleteDate(null);
    setExpandedDate(null);
  }

  // List of exercises that have history, for the progression picker
  const exercisesWithHistory = useMemo(() => {
    return Object.keys(data.strengthLog)
      .filter(exId => (data.strengthLog[exId] || []).length > 0)
      .map(exId => ({ id: exId, name: data.exercises.find(e => e.id === exId)?.name || exId }))
      .sort((a, b) => a.name.localeCompare(b.name));
  }, [data]);

  const activeExId = selectedExId || (exercisesWithHistory[0] && exercisesWithHistory[0].id);
  const progressionData = useMemo(() => {
    if (!activeExId) return [];
    return (data.strengthLog[activeExId] || [])
      .slice()
      .sort((a, b) => a.date.localeCompare(b.date))
      .map(h => ({ date: fmtDate(h.date), weight: h.weight, reps: h.reps, e1rm: Math.round(h.weight * (1 + h.reps / 30)) }));
  }, [data, activeExId]);

  const allEvents = useMemo(() => {
    const events = [];
    Object.entries(data.strengthLog).forEach(([exId, arr]) => {
      const ex = data.exercises.find(e => e.id === exId);
      arr.forEach(h => events.push({ date: h.date, kind: "Strength", detail: `${ex?.name}: ${h.weight} lb × ${h.reps}` }));
    });
    data.cardioLog.forEach(c => events.push({ date: c.date, kind: "Cardio", detail: `${c.type}: ${c.minutes} min` }));
    data.measurements.forEach(m => events.push({ date: m.date, kind: "Measurements", detail: `C:${m.chest ?? "—"} A:${m.arm ?? "—"} W:${m.waist ?? "—"}` }));
    return events.sort((a, b) => b.date.localeCompare(a.date));
  }, [data]);

  return (
    <div style={styles.stack}>
      <div style={{ display: "flex", gap: 8, marginBottom: 4 }}>
        {[
          { id: "sessions", label: "Past Workouts" },
          { id: "progression", label: "Progression" },
          { id: "log", label: "Full Log" },
        ].map(v => (
          <button
            key={v.id}
            onClick={() => setView(v.id)}
            style={{
              padding: "8px 14px", borderRadius: 10, fontSize: 13, fontWeight: 600,
              border: "1px solid var(--line)", cursor: "pointer",
              background: view === v.id ? "var(--accent-dim)" : "var(--surface)",
              color: view === v.id ? "var(--accent)" : "var(--ink-dim)",
            }}
          >
            {v.label}
          </button>
        ))}
      </div>

      {view === "sessions" && (
        <Card title={`Past workouts (${sessions.length})`}>
          {sessions.length === 0 ? (
            <EmptyHint text="No workouts logged yet." />
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {sessions.map((s) => {
                const isOpen = expandedDate === s.date;
                const exNames = [...new Set(s.sets.map(x => x.name))];
                return (
                  <div key={s.date} style={{ border: "1px solid var(--line)", borderRadius: 12, overflow: "hidden" }}>
                    <button
                      onClick={() => setExpandedDate(isOpen ? null : s.date)}
                      style={{
                        width: "100%", display: "flex", justifyContent: "space-between", alignItems: "center",
                        padding: "12px 14px", background: "var(--surface-2)", border: "none", cursor: "pointer", textAlign: "left",
                      }}
                    >
                      <div>
                        <div style={{ fontWeight: 700, fontSize: 14 }}>{fmtDate(s.date)}</div>
                        <div style={{ fontSize: 12, color: "var(--ink-dim)", marginTop: 2 }}>
                          {exNames.length} exercise{exNames.length !== 1 ? "s" : ""} · {s.sets.length} sets · {s.totalVolume.toLocaleString()} lb
                          {s.improvedCount > 0 && <span style={{ color: "var(--accent)", fontWeight: 600 }}> · {s.improvedCount} improved</span>}
                        </div>
                      </div>
                      <ChevronRight size={16} style={{ transform: isOpen ? "rotate(90deg)" : "rotate(0deg)", transition: "transform 0.15s" }} />
                    </button>
                    {isOpen && (
                      <div style={{ padding: "12px 16px", display: "flex", flexDirection: "column", gap: 8 }}>
                        {s.sets.map((set, i) => (
                          <div key={i} style={{ paddingBottom: 8, borderBottom: "1px solid var(--line)" }}>
                            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", fontSize: 13 }}>
                              <span>{set.name}</span>
                              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                                <span style={{ fontFamily: "var(--font-mono)", fontWeight: 600 }}>
                                  {set.weight}×{set.reps} @ RPE {set.rpe}
                                  {set.isAllTimePR ? <span style={{ marginLeft: 6 }}>🏆</span> : set.improved && <span style={{ color: "var(--accent)", marginLeft: 6 }}>✅</span>}
                                </span>
                                <button
                                  onClick={() => deleteSet(set.exId, set.idx)}
                                  title="Delete this set"
                                  style={{ background: "transparent", border: "none", color: "var(--ink-dim)", cursor: "pointer", padding: 4, display: "flex" }}
                                >
                                  <X size={14} />
                                </button>
                              </div>
                            </div>
                            {set.note && (
                              <div style={{ fontSize: 11, color: "var(--ink-dim)", fontStyle: "italic", marginTop: 4 }}>
                                💬 {set.note}
                              </div>
                            )}
                          </div>
                        ))}

                        {confirmDeleteDate === s.date ? (
                          <div style={{ marginTop: 4 }}>
                            <div style={{ fontSize: 12, color: "var(--danger)", fontWeight: 600, marginBottom: 8 }}>
                              ⚠️ This deletes all {s.sets.length} sets from {fmtDate(s.date)}. This can't be undone.
                            </div>
                            <div style={{ display: "flex", gap: 8 }}>
                              <button
                                onClick={() => deleteWholeSession(s.date)}
                                style={{ flex: 1, padding: "10px", borderRadius: 10, border: "none", background: "var(--danger)", color: "#FFFFFF", fontSize: 13, fontWeight: 700, cursor: "pointer" }}
                              >
                                Yes, delete workout
                              </button>
                              <button
                                onClick={() => setConfirmDeleteDate(null)}
                                style={{ flex: 1, padding: "10px", borderRadius: 10, border: "1px solid var(--line)", background: "transparent", color: "var(--ink-dim)", fontSize: 13, fontWeight: 600, cursor: "pointer" }}
                              >
                                Cancel
                              </button>
                            </div>
                          </div>
                        ) : (
                          <button
                            onClick={() => setConfirmDeleteDate(s.date)}
                            style={{ marginTop: 4, padding: "10px", borderRadius: 10, border: "1px solid var(--danger)", background: "transparent", color: "var(--danger)", fontSize: 13, fontWeight: 600, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}
                          >
                            <X size={13} /> Delete entire workout
                          </button>
                        )}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}
        </Card>
      )}

      {view === "progression" && (
        <Card title="Exercise progression">
          {exercisesWithHistory.length === 0 ? (
            <EmptyHint text="Log a few sets to see progression here." />
          ) : (
            <>
              <select
                style={{ ...styles.input, marginBottom: 16, maxWidth: 320 }}
                value={activeExId}
                onChange={(e) => setSelectedExId(e.target.value)}
              >
                {exercisesWithHistory.map(ex => <option key={ex.id} value={ex.id}>{ex.name}</option>)}
              </select>

              {progressionData.length > 1 ? (
                <>
                  <div style={{ fontSize: 12, color: "var(--ink-dim)", fontWeight: 600, marginBottom: 6 }}>WEIGHT OVER TIME (lb)</div>
                  <SimpleLineChart data={progressionData} lines={[{ key: "weight", color: "var(--accent)" }]} height={180} />
                  <div style={{ fontSize: 12, color: "var(--ink-dim)", fontWeight: 600, margin: "20px 0 6px" }}>ESTIMATED 1-REP MAX</div>
                  <SimpleLineChart data={progressionData} lines={[{ key: "e1rm", color: "var(--energy)" }]} height={140} />

                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 12, marginTop: 20 }}>
                    <div style={{ background: "var(--surface-2)", padding: 12, borderRadius: 10 }}>
                      <div style={{ fontSize: 11, color: "var(--ink-dim)" }}>FIRST LOGGED</div>
                      <div style={{ fontFamily: "var(--font-mono)", fontWeight: 700 }}>{progressionData[0].weight}×{progressionData[0].reps}</div>
                    </div>
                    <div style={{ background: "var(--surface-2)", padding: 12, borderRadius: 10 }}>
                      <div style={{ fontSize: 11, color: "var(--ink-dim)" }}>MOST RECENT</div>
                      <div style={{ fontFamily: "var(--font-mono)", fontWeight: 700 }}>{progressionData[progressionData.length - 1].weight}×{progressionData[progressionData.length - 1].reps}</div>
                    </div>
                    <div style={{ background: "var(--accent-dim)", padding: 12, borderRadius: 10 }}>
                      <div style={{ fontSize: 11, color: "var(--ink-dim)" }}>CHANGE</div>
                      <div style={{ fontFamily: "var(--font-mono)", fontWeight: 700, color: "var(--accent)" }}>
                        {progressionData[progressionData.length - 1].weight - progressionData[0].weight >= 0 ? "+" : ""}
                        {progressionData[progressionData.length - 1].weight - progressionData[0].weight} lb
                      </div>
                    </div>
                  </div>
                </>
              ) : (
                <EmptyHint text="Log this exercise at least twice to see a progression trend." />
              )}
            </>
          )}
        </Card>
      )}

      {view === "log" && (
        <Card title={`Full log (${allEvents.length} entries)`}>
          {allEvents.length === 0 ? (
            <EmptyHint text="No activity yet." />
          ) : (
            <div style={styles.logList}>
              {allEvents.map((e, i) => (
                <div key={i} style={styles.logRow}>
                  <span style={styles.dim}>{fmtDate(e.date)}</span>
                  <span style={{ ...styles.kindTag, color: kindTagColor(e.kind) }}>{e.kind}</span>
                  <span style={styles.mono}>{e.detail}</span>
                </div>
              ))}
            </div>
          )}
        </Card>
      )}
    </div>
  );
}

function kindTagColor(kind) {
  const map = { Strength: "#C9A24B", Cardio: "#5FA8A0", Measurements: "#8FA5B3", Recovery: "#C1502E" };
  return map[kind] || "var(--ink-dim)";
}

/* ---------------------------------------------------------------
   IMPORT
--------------------------------------------------------------- */
function ImportView({ data, setData }) {
  const [raw, setRaw] = useState("");
  const [status, setStatus] = useState(null);

  const parseAndImport = () => {
    try {
      const parsed = JSON.parse(raw);
      const list = Array.isArray(parsed) ? parsed : [parsed];
      // Only count entries with a genuine, physiologically plausible HR number — otherwise
      // pasting malformed or unrelated JSON would silently report "success" while writing
      // entries with hr: null that this chart (rightly) can never use for anything.
      const normalized = list
        .map(item => ({ date: item.date || todayStr(), hr: item.hr ?? item.heartRate ?? null }))
        .filter(item => typeof item.hr === "number" && item.hr >= 30 && item.hr <= 220);
      const skipped = list.length - normalized.length;
      if (normalized.length === 0) {
        setStatus({ ok: false, msg: "No valid HR entries found — each item needs a real \"hr\" or \"heartRate\" number between 30–220." });
        return;
      }
      setData({ ...data, hrImports: [...data.hrImports, ...normalized] });
      setStatus({ ok: true, msg: `Imported ${normalized.length} entries${skipped > 0 ? ` (${skipped} skipped — no valid HR value)` : ""}. Check the HR trend chart on the Cardio tab.` });
      setRaw("");
    } catch (e) {
      setStatus({ ok: false, msg: "Parse error." });
    }
  };

  return (
    <div style={styles.stack}>
      <Card title="Apple Health import">
        <p style={styles.para}>
          Build a Shortcuts automation that exports HR data as JSON, then paste it here.
        </p>
        <textarea
          style={styles.textarea}
          rows={4}
          placeholder='[{"date":"2026-08-05","hr":142}]'
          value={raw}
          onChange={(e) => setRaw(e.target.value)}
        />
        <button style={styles.primaryBtn} onClick={parseAndImport}><UploadCloud size={14} /> Import</button>
        {status && (
          <div style={{ fontSize: 12, marginTop: 8, color: status.ok ? "var(--accent)" : "#C1502E" }}>
            {status.ok ? "✓" : "✕"} {status.msg}
          </div>
        )}
      </Card>
    </div>
  );
}
