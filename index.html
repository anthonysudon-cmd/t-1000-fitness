  <!-- maximum-scale=1.0 + user-scalable=no is deliberate: without it, tapping any input
       whose effective font-size renders under 16px triggers iOS Safari's automatic
       zoom-to-legible-size behavior, and the viewport can end up shifted off-center
       afterward — exactly the "everything is zoomed and cut off on the left" bug a real
       screenshot on a real iPhone showed. This app is meant to feel like a native app, not
       a webpage someone might want to pinch-zoom around in, so trading away pinch-zoom to
       guarantee the layout never drifts off-center is the right call here.
       viewport-fit=cover matters specifically once this is installed via "Add to Home
       Screen": without it, the page content is inset to avoid the notch/status bar, which
       sounds safe but actually leaves an ugly bar of mismatched color at the top and bottom
       instead of the app filling the screen like a real installed app does. Paired with
       real safe-area-inset padding on the app's own root container (see styles.app) so
       content is pushed clear of the notch and home indicator without losing that
       edge-to-edge look. -->

  <script>
    // window.storage is an async key-value API Claude's artifact preview environment
    // injects automatically — but this app also gets deployed standalone (e.g. to Vercel),
    // where no such API exists at all. Every persistence call in this app (all workout
    // data, profiles, settings) goes through window.storage, so without this fallback the
    // app would fail completely outside Claude's own preview — not just profile creation,
    // literally every save and load. If the real API isn't present, transparently provide
    // one with the identical shape, backed by real browser localStorage instead. Wrapped in
    // try/catch throughout so a private-browsing quota error degrades gracefully (returns
    // null/empty) rather than throwing and producing the same "check your connection"
    // message for an unrelated reason.
    if (typeof window.storage === "undefined") {
      window.storage = {
        get: function (key, shared) {
          return new Promise(function (resolve) {
            try {
              var raw = localStorage.getItem(key);
              resolve(raw !== null ? { key: key, value: raw, shared: !!shared } : null);
            } catch (e) { resolve(null); }
          });
        },
        set: function (key, value, shared) {
          return new Promise(function (resolve, reject) {
            try {
              localStorage.setItem(key, value);
              resolve({ key: key, value: value, shared: !!shared });
            } catch (e) { reject(e); }
          });
        },
        delete: function (key, shared) {
          return new Promise(function (resolve) {
            try {
              var existed = localStorage.getItem(key) !== null;
              localStorage.removeItem(key);
              resolve(existed ? { key: key, deleted: true, shared: !!shared } : null);
            } catch (e) { resolve(null); }
          });
        },
        list: function (prefix, shared) {
          return new Promise(function (resolve) {
            try {
              var keys = [];
              for (var i = 0; i < localStorage.length; i++) {
                var k = localStorage.key(i);
                if (!prefix || k.indexOf(prefix) === 0) keys.push(k);
              }
              resolve({ keys: keys, prefix: prefix, shared: !!shared });
            } catch (e) { resolve({ keys: [], prefix: prefix, shared: !!shared }); }
          });
        },
      };
    }
  </script>

    :root {
      /* Concrete-and-steel neutrals, not iOS greys. Gym lighting is bright and flat, so the
         light theme reads as poured concrete rather than paper white. */
      --bg: #EDEDEE; --surface: #FFFFFF; --surface-2: #F4F4F5; --line: #D6D6D9;
      --ink: #141416; --ink-dim: #6B6B72;
      /* Deep petrol — readable as text (8:1 on white), industrial, and deliberately not
         iOS blue. Yellow is reserved as a signal fill, never text, so it stays legible. */
      --accent: #A83F06; --accent-dim: rgba(237,98,1,0.12);
      /* Calibrated plate colours: 15kg yellow for PRs and streaks, 10kg green for success,
         25kg red for destructive. The sport's own colour language, not a generic palette. */
      --energy: #96631A; --energy-dim: rgba(237,98,1,0.16);
      --fun-purple: #5B4B8A; --fun-pink: #C8102E; --fun-teal: #2A7F8F;
      --fun-green: #1E7A4C; --fun-green-dim: rgba(30,122,76,0.14);
      --danger: #C8102E;
      /* One superfamily in three roles — the way equipment is labelled. */
      --font-display: 'Barlow Condensed', 'Barlow', sans-serif;
      --font-body: 'Barlow', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      /* Three-step radius scale. Instruments have consistent corners. */
      --r-sm: 4px; --r-md: 8px; --r-lg: 12px;
    }
    [data-theme="dark"] {
      --bg: #0A0A0B; --surface: #151517; --surface-2: #1E1E21; --line: #2C2C31;
      --ink: #F2F2F3; --ink-dim: #8A8A90;
      --accent: #FF7A29; --accent-dim: rgba(255,122,41,0.16);
      --energy: #FFB443; --energy-dim: rgba(255,180,67,0.16);
      --fun-purple: #8E7CC3; --fun-pink: #E23A52; --fun-teal: #45A8B8;
      --fun-green: #35B87A; --fun-green-dim: rgba(53,184,122,0.18);
      --danger: #E23A52;
    }
    body { transition: background-color 0.25s ease; }
    [data-theme="dark"] input, [data-theme="dark"] select, [data-theme="dark"] textarea { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    html, body { margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--ink); font-family: var(--font-body); line-height: 1.6; }
    #root { min-height: 100vh; }
    input, select, textarea { font-family: var(--font-mono); font-size: 16px; -webkit-appearance: none; -moz-appearance: none; appearance: none; }
    input:focus, select:focus, textarea:focus { outline: none; box-shadow: 0 0 0 3px rgba(0,122,255,0.2); }
    button { -webkit-appearance: none; -moz-appearance: none; appearance: none; }
    button { transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1); }
    button:active { transform: scale(0.93); }
    ::placeholder { color: #D2D2D7; }
    @keyframes prPulse { 0% { transform: scale(1); } 30% { transform: scale(1.06); } 100% { transform: scale(1); } }
    @keyframes navPop { 0% { transform: scale(0.7); opacity: 0.5; } 60% { transform: scale(1.1); } 100% { transform: scale(1); opacity: 1; } }
    @keyframes cardIn { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }
    @keyframes prGlow { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,149,0,0.45); } 50% { box-shadow: 0 0 0 10px rgba(255,149,0,0); } }
    @keyframes checkBounce {
      0% { transform: scale(1); }
      35% { transform: scale(1.28) rotate(-6deg); }
      60% { transform: scale(0.94) rotate(3deg); }
      100% { transform: scale(1) rotate(0); }
    }
    @keyframes rowFlash {
      0% { background-color: var(--accent-dim); }
      100% { background-color: transparent; }
    }
    @keyframes flameFlicker {
      0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
      25% { transform: scale(1.08) rotate(-3deg); opacity: 0.92; }
      50% { transform: scale(0.96) rotate(2deg); opacity: 1; }
      75% { transform: scale(1.05) rotate(-1deg); opacity: 0.95; }
    }
    @keyframes confettiBurst {
      0% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
      100% { transform: var(--fly) rotate(var(--spin)) scale(0.4); opacity: 0; }
    }
    @keyframes bouncePlate {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(180deg); }
    }
    @keyframes dotPulse {
      0%, 80%, 100% { opacity: 0.25; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1); }
    }
    @keyframes sheetFadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes sheetSlideUp {
      0% { transform: translateY(100%); }
      100% { transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    function SimpleLineChart({ data, lines, height = 180, xKey = "date" }) {
      if (!data || data.length === 0) return null;
      const width = 600; const padding = { top: 10, right: 10, bottom: 24, left: 8 };
      const innerW = width - padding.left - padding.right; const innerH = height - padding.top - padding.bottom;
      // Null/undefined means "not logged that day" — must NOT be treated as 0, or a skipped
      // field creates a misleading false dip to the bottom of the chart. Only real numeric
      // values count toward the axis range and get plotted; missing points create a genuine
      // gap in the line instead of a fake zero.
      const allValues = data.flatMap(d => lines.map(l => d[l.key])).filter(v => v !== null && v !== undefined && !isNaN(v)).map(Number);
      const minV = allValues.length ? Math.min(...allValues, 0) : 0;
      const maxV = allValues.length ? Math.max(...allValues, 1) : 1;
      const range = (maxV - minV) || 1;
      const xStep = data.length > 1 ? innerW / (data.length - 1) : 0;
      const yFor = (v) => padding.top + innerH - ((v - minV) / range) * innerH;
      const xFor = (i) => padding.left + i * xStep; const labelEvery = Math.max(1, Math.ceil(data.length / 6));
      const isValid = (v) => v !== null && v !== undefined && !isNaN(Number(v));
      return (
        <svg viewBox={`0 0 ${width} ${height}`} width="100%" height={height} preserveAspectRatio="none">
          {[0, 0.25, 0.5, 0.75, 1].map((t, i) => (
            <line key={i} x1={padding.left} x2={width - padding.right}
              y1={padding.top + innerH * t} y2={padding.top + innerH * t}
              stroke="var(--line)" strokeWidth="1" opacity="0.5" />
          ))}
          {lines.map((l, li) => {
            // Split into contiguous runs of valid points — each run becomes its own
            // polyline, so a gap (missing value) breaks the line instead of drawing
            // through a fake zero.
            const runs = [];
            let current = [];
            data.forEach((d, i) => {
              if (isValid(d[l.key])) {
                current.push(`${xFor(i)},${yFor(Number(d[l.key]))}`);
              } else if (current.length > 0) {
                runs.push(current);
                current = [];
              }
            });
            if (current.length > 0) runs.push(current);
            return (
              <g key={li}>
                {runs.map((run, ri) => <polyline key={ri} points={run.join(" ")} fill="none" stroke={l.color} strokeWidth="2.5" />)}
                {data.map((d, i) => isValid(d[l.key]) ? (<circle key={i} cx={xFor(i)} cy={yFor(Number(d[l.key]))} r="3" fill={l.color} opacity="0.8" />) : null)}
              </g>

// Flat lookup of every library exercise by id, e.g. for finding an exercise's type/recommendation from anywhere.
// Accepts an optional list of user-created custom exercises to search too, so custom exercises
// get the exact same equipment-aware coaching, recommendations, and category info as built-in ones.
const EXERCISE_LIBRARY_FLAT = Object.values(EXERCISE_LIBRARY).flatMap(g => g.exercises);
function findLibraryExercise(id, customExercises) {
  return EXERCISE_LIBRARY_FLAT.find(e => e.id === id) || (customExercises || []).find(e => e.id === id);
}

function generateProgramWorkouts(phase, weeks, templateKey, startDate = todayStr()) {
  const template = WORKOUT_TEMPLATES[templateKey];
  if (!template) return [];

  // Read the user's rest-day preference from Settings directly — this is what the Settings
  // screen's "auto-skipped in programs" claim refers to. Previously this was never actually
  // read anywhere outside the Settings component itself, so toggling rest days did nothing.
  let restDayIndices = [0, 6]; // default: Sunday, Saturday — matches Settings' own default
  try {
    const saved = localStorage.getItem("restDays");
    if (saved) restDayIndices = JSON.parse(saved);
  } catch (e) {}

  const workouts = [];
  const phaseObj = PHASES.find(p => p.id === phase);
  const volumeMultiplier = phaseObj?.id === "strength" ? 0.8 : phaseObj?.id === "power" ? 0.6 : 1.0;
  
  let currentDate = new Date(startDate);
  let dayOfPattern = 0;
  let daysScheduled = 0;
  // Safety cap so a misconfigured/empty template pattern (or all 7 days marked as rest)
  // can never spin this into an effectively infinite loop.
  const maxCalendarDays = weeks * 7 * 3;
  let calendarDaysWalked = 0;

  while (daysScheduled < weeks * 7 && calendarDaysWalked < maxCalendarDays) {
    calendarDaysWalked++;
    const dow = currentDate.getDay();
    const dateStr = currentDate.toISOString().split('T')[0];
    const isUserRestDay = restDayIndices.includes(dow);
    const focusArea = isUserRestDay ? "Rest" : template.pattern[dayOfPattern % 7];

    if (focusArea !== "Rest") {
      const week = Math.floor(daysScheduled / 7) + 1;
      const exercises = (TEMPLATE_EXERCISE_PICKS[templateKey]?.[focusArea] || []).map(ex => ({
        ...ex,
        // Adjust sets/reps based on phase
        sets: phase === "strength" ? Math.max(3, ex.sets - 1) : ex.sets,
        reps: phase === "strength" ? Math.max(3, Math.floor(ex.reps * 0.7)) : phase === "power" ? Math.max(1, Math.floor(ex.reps * 0.5)) : ex.reps,
        weight: Math.round(ex.weight * volumeMultiplier),
      }));

      workouts.push({
        id: Math.random().toString(36).slice(2),
        date: dateStr,
        week,
        focus: focusArea,
        exercises,
      });
    }

    // Only advance the template's own pattern on a day that wasn't forced to rest by the
    // user's preference — so a user rest day pushes the next training day later instead of
    // silently dropping a workout from the pattern.
    if (!isUserRestDay) dayOfPattern++;
    daysScheduled++;
    currentDate.setDate(currentDate.getDate() + 1);
  }

  return workouts;
}

--------------------------------------------------------------- */
const STORAGE_KEY = "ironlog-pro:v2";
const PROFILES_KEY = "ironlog-pro:profiles";
function profileDataKey(profileId) { return `ironlog-pro:v2:${profileId}`; }

// One-time migration for anyone who was already using the app before multi-profile
// support existed: their real workout history is sitting under the old flat STORAGE_KEY,
// with no profile wrapper at all. Auto-creates ONE profile from that data and copies it to
// the new per-profile key — this is the single riskiest part of this whole feature, since
// getting it wrong looks exactly like "my history disappeared." Deliberately does NOT
// delete the old key afterward; leaving that redundant copy in place costs almost nothing
// and is a real safety net if anything about the new path turns out to be wrong.
// Returns the migrated profile (so the caller can pre-select it) or null if there was
// nothing to migrate (a genuinely fresh install, or migration already happened before).
async function migrateSingleProfileIfNeeded() {
  try {
    const existingProfiles = await window.storage.get(PROFILES_KEY, false);
    if (existingProfiles && existingProfiles.value) {
      // Already migrated at some point — never re-run this, even if it looks like it could.
      return null;
    }

    const oldRes = await window.storage.get(STORAGE_KEY, false);
    if (!oldRes || !oldRes.value) {
      // Genuinely fresh install — nothing to migrate, just mark migration as done with an
      // empty profile list so we never check again.
      await window.storage.set(PROFILES_KEY, JSON.stringify([]), false);
      return null;
    }

    let oldData;
    try {
      oldData = sanitizeLoadedData(JSON.parse(oldRes.value));
    } catch (e) {
      // Old data was unreadable garbage — nothing real to migrate, but still don't lose the
      // raw bytes; leave the old key untouched and just start clean going forward.
      await window.storage.set(PROFILES_KEY, JSON.stringify([]), false);
      return null;
    }

    // A sanitized-but-genuinely-empty dataset (never actually used) isn't worth turning
    // into a profile someone then has to notice and rename.
    const hasRealContent = Object.keys(oldData.strengthLog || {}).length > 0
      || (oldData.programs || []).length > 0
      || (oldData.routines || []).length > 0
      || !!oldData.profile?.name;
    if (!hasRealContent) {
      await window.storage.set(PROFILES_KEY, JSON.stringify([]), false);
      return null;
    }

    const id = "p_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    const name = oldData.profile?.name || "My Profile";
    await window.storage.set(profileDataKey(id), JSON.stringify(oldData), false);
    const profiles = [{ id, name, createdAt: todayStr() }];
    await window.storage.set(PROFILES_KEY, JSON.stringify(profiles), false);
    return { id, name };
  } catch (e) {
    // If migration itself fails for any reason, fail safe: don't write a partial/broken
    // PROFILES_KEY that could make it look like migration succeeded when it didn't. The old
    // data stays exactly where it was, untouched, and migration will simply be retried next
    // launch.
    return null;
  }
}

// Guarantees loaded data actually matches the shape the app expects, whatever was in
// storage. Without this, a corrupt or partial write (storage quota hit mid-save, the tab
// killed while writing, a bad older build) gets loaded straight into live state and the
// app hard-crashes to a blank white screen — which looks exactly like "all my data is
// gone" to the person, even when most of it is fine.
//
// Deliberately merges onto defaultData() rather than replacing wholesale: any field that
// IS valid is preserved exactly as-is, and only genuinely broken/missing fields fall back
// to a safe empty default. Losing one corrupted field beats losing the entire history.
function sanitizeLoadedData(raw) {
  const base = defaultData();
  if (!raw || typeof raw !== "object" || Array.isArray(raw)) return base;

  const arrayField = (v) => (Array.isArray(v) ? v : []);

  // strengthLog must be a plain object of exerciseId -> array-of-entries. Any value that
  // isn't a real array gets dropped rather than being allowed to crash .forEach later.
  let strengthLog = {};
  if (raw.strengthLog && typeof raw.strengthLog === "object" && !Array.isArray(raw.strengthLog)) {
    Object.entries(raw.strengthLog).forEach(([exId, entries]) => {
      if (Array.isArray(entries)) {
        // Keep only entries that at least have a usable date — everything downstream
        // (streaks, history grouping, PRs) assumes that field exists.
        const valid = entries.filter(e => e && typeof e === "object" && typeof e.date === "string");
        if (valid.length > 0) strengthLog[exId] = valid;
      }
    });
  }

  const profile = (raw.profile && typeof raw.profile === "object" && !Array.isArray(raw.profile))
    ? { ...base.profile, ...raw.profile }
    : base.profile;

  return {
    ...base,
    profile,
    strengthLog,
    exercises: arrayField(raw.exercises),
    cardioLog: arrayField(raw.cardioLog).filter(e => e && typeof e.date === "string"),
    recoveryLog: arrayField(raw.recoveryLog).filter(e => e && typeof e.date === "string"),
    nutritionLog: arrayField(raw.nutritionLog),
    hrImports: arrayField(raw.hrImports),
    measurements: arrayField(raw.measurements).filter(e => e && typeof e.date === "string"),
    programs: arrayField(raw.programs),
    routines: arrayField(raw.routines),
    customExercises: arrayField(raw.customExercises),
    milestones: arrayField(raw.milestones),
    lastLogDate: typeof raw.lastLogDate === "string" ? raw.lastLogDate : null,
  };
}

function useIronLogStore(storageKey) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [isSaving, setIsSaving] = useState(false);
  const pendingRef = useRef(null);
  const loadedForKeyRef = useRef(null);

  // Detected and cleared SYNCHRONOUSLY during render, not in an effect — this matters.
  // Effects run after render/commit, so on the exact render where storageKey first changes
  // (switching profiles), `data` would still briefly hold the PREVIOUS profile's data if we
  // only reset it in an effect. Any component that initializes its own local state from
  // `data` at that moment (e.g. Dashboard's `editingProfile = useState(!data.profile.name)`)
  // would seed itself from the wrong profile's data and never get a chance to correct
  // itself, since useState initializers only run once per mount. Clearing `data` to null
  // (and pendingRef, which could otherwise resolve a stale in-flight save against the new
  // key) the instant the key changes — before this render commits — closes that gap.
  if (storageKey !== loadedForKeyRef.current) {
    loadedForKeyRef.current = storageKey;
    if (data !== null) { setData(null); pendingRef.current = null; }
  }

  useEffect(() => {
    if (!storageKey) return; // no profile selected yet — nothing to load
    setLoading(true);
    (async () => {
      try {
        const res = await window.storage.get(storageKey, false);
        if (res && res.value) {
          // Always sanitize — never trust stored data to match the current shape.
          setData(sanitizeLoadedData(JSON.parse(res.value)));
        } else {
          setData(defaultData());
        }
      } catch (e) {
        setData(defaultData());
      } finally {
        setLoading(false);
      }
    })();
  }, [storageKey]);

  const save = useCallback(async (next) => {
    if (!storageKey) return;
    // Support functional updates (setData(prev => ({...prev, x})) same as React's own
    // useState setter. Without this, two setData calls fired in the same synchronous
    // handler (e.g. creating a custom exercise, then immediately swapping it in) each
    // spread the SAME stale `data` closure — the second call silently overwrites whatever
    // the first one just set, because neither one has seen the other's update yet. Resolving
    // functional updates against the latest pending/actual value fixes that at the root,
    // for every future setData call, not just the ones that happened to break first.
    const resolved = typeof next === "function" ? next(pendingRef.current ?? data) : next;
    setData(resolved);
    pendingRef.current = resolved;
    
    // If already saving, queue for next save
    if (isSaving) return;
    
    setIsSaving(true);
    try {
      // Use queued data (might have been updated while saving)
      const toSave = pendingRef.current || resolved;
      await window.storage.set(storageKey, JSON.stringify(toSave), false);
      
      // If pending changed during save, save again
      if (pendingRef.current !== toSave) {
        await save(pendingRef.current);
      }
    } catch (e) {
      setError("Save failed: " + (e?.message || "unknown error"));
    } finally {
      setIsSaving(false);
    }
  }, [isSaving, data, storageKey]);

  return { data, setData: save, loading, error };
}

// Shared across every sound effect in the app. Browsers block a BRAND NEW AudioContext
// from actually producing audible sound when it's created outside a direct user gesture —
// a well-known autoplay-policy restriction, and exactly why the rest timer's completion
// beep (fired from a setInterval tick, not a click) could run with zero errors and still
// produce no sound at all. Reusing ONE context everywhere means it gets genuinely unlocked
// the first time ANY sound in the app fires from a real click — starting a workout,
// checking off a set — and that same unlocked context then keeps working correctly for
// later, non-gesture-triggered sounds like the timer's own completion chime.
let sharedAudioCtx = null;
function getSharedAudioContext() {
  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  if (!AudioContextClass) return null;
  if (!sharedAudioCtx || sharedAudioCtx.state === "closed") {
    sharedAudioCtx = new AudioContextClass();
  }
  if (sharedAudioCtx.state === "suspended") {
    // Best-effort resume — this can still fail silently if we're truly outside any gesture
    // history, but succeeds once the context has been unlocked by an earlier real tap.
    sharedAudioCtx.resume().catch(() => {});
  }
  return sharedAudioCtx;
}

// ---- Sound design toolkit -------------------------------------------------
// A bare oscillator on its own always sounds like a microwave beep: one pure
// tone, flat volume, hard cutoff. Real, satisfying sounds have three things —
// several partials sounding at once, a fast attack with a decaying tail, and a
// touch of pitch movement. These helpers give every sound in the app those,
// so a PR feels like an event rather than an appliance notification.

// One voice: an oscillator + its own gain envelope. `attack` is deliberately
// tiny (a few ms) — that sharp onset is what makes a sound read as "struck"
// rather than "faded in", and it's the single biggest difference between
// punchy and limp.
function toneVoice(ctx, { freq, type = "sine", at, dur, peak, attack = 0.005, glideTo = null }) {
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.type = type;
  osc.frequency.setValueAtTime(freq, at);
  // A short upward pitch glide reads as energy/effort — used on the PR hits so
  // they lift rather than sit flat.
  if (glideTo) osc.frequency.exponentialRampToValueAtTime(glideTo, at + dur * 0.8);
  gain.gain.setValueAtTime(0.0001, at);
  gain.gain.exponentialRampToValueAtTime(peak, at + attack);
  gain.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  osc.start(at);
  osc.stop(at + dur + 0.02);
}

// A weighted hit: fundamental + harmonics stacked, so it has body instead of
// being a thin sine. The square/sawtooth upper partials add the bite that cuts
// through gym noise.
function impactHit(ctx, { freq, at, peak = 0.5, dur = 0.5, bright = true }) {
  toneVoice(ctx, { freq, type: "sine", at, dur, peak, glideTo: freq * 1.02 });
  toneVoice(ctx, { freq: freq * 2, type: "triangle", at, dur: dur * 0.6, peak: peak * 0.45 });
  if (bright) toneVoice(ctx, { freq: freq * 3.01, type: "sawtooth", at, dur: dur * 0.25, peak: peak * 0.18 });
}

const todayStr = () => {
  const d = new Date();
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const date = String(d.getDate()).padStart(2, '0');
  return `${year}-${month}-${date}`;
};
const fmtDate = (d) => new Date(d + "T00:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric" });
// "1st", "2nd", "3rd", "4th"... "11th", "12th", "13th" (the teens are always "th",
// not "1th"/"2th"/"3th" — the classic mod-100 exception).
function ordinalSuffix(n) {
  const mod100 = n % 100;
  if (mod100 >= 11 && mod100 <= 13) return "th";
  switch (n % 10) {
    case 1: return "st";
    case 2: return "nd";
    case 3: return "rd";
    default: return "th";
  }
}
// Time-based greeting for the header — the pattern serious health/fitness apps use instead
// of a logo: something personal and immediate, not a brand mark you see a thousand times.
function getGreeting() {
  const hour = new Date().getHours();
  if (hour < 5) return "Still up";
  if (hour < 12) return "Good morning";
  if (hour < 17) return "Good afternoon";
  if (hour < 21) return "Good evening";
  return "Good evening";
}
const estMaxHr = (profile) => {
  if (profile.maxHrOverride) return profile.maxHrOverride;
  return Math.round(207 - 0.7 * (profile.age || 35));
};

// NOTE: STRENGTH_STANDARDS only contains a "male" data table — there's no female standards
// data in the app. The old signature took a `sex` param and did `STRENGTH_STANDARDS[sex] ||
// STRENGTH_STANDARDS.male`, which LOOKED like it personalized by sex but never actually could:
// the object's only key is "male", so `STRENGTH_STANDARDS["m"]` (or "f", or anything else)
// was always undefined and silently fell through to male standards regardless of input.
// Rather than fabricate a female standards table with numbers we can't vouch for as accurate,
// this is now explicit about what it actually does — general standards, not personalized.
function getStrengthCategory(weight, exercise, bodyweight) {
  const standards = STRENGTH_STANDARDS.male[exercise];
  if (!standards || !weight || weight < 0 || !bodyweight || bodyweight < 0) {
    return { level: "unknown", nextLevel: null, remaining: 0, nextTarget: null };
  }
  
  // Clamp bodyweight to available brackets
  const minBracket = 120;
  const maxBracket = 200;
  const clampedBw = Math.max(minBracket, Math.min(maxBracket, bodyweight));
  
  let bracket = standards[0];
  for (let s of standards) {
    if (clampedBw <= s.bw) { bracket = s; break; }
  }
  
  const levels = ["untrained", "novice", "intermediate", "advanced", "elite"];
  let currentLevel = "untrained";
  for (let level of levels) {
    if (weight >= bracket[level]) currentLevel = level;
  }
  
  const idx = levels.indexOf(currentLevel);
  const nextLevel = idx < levels.length - 1 ? levels[idx + 1] : null;
  const nextTarget = nextLevel ? bracket[nextLevel] : null;
  const remaining = nextTarget ? Math.max(0, nextTarget - weight) : 0;
  
  return { level: currentLevel, nextLevel, remaining, nextTarget };
}

// Returns the set of every date (YYYY-MM-DD) on which the user did ANY tracked activity —
// strength sets, cardio, or recovery — used for both streak math and the training heatmap.
function getTrainingDateSet(data) {
  const dates = new Set();
  // Defensive even though sanitizeLoadedData should guarantee these shapes — this function
  // is called from several places including on data built mid-session, and a crash here
  // takes down the entire app (it feeds the streak on the Dashboard).
  Object.values(data.strengthLog || {}).forEach(arr => {
    if (Array.isArray(arr)) arr.forEach(e => { if (e && e.date) dates.add(e.date); });
  });
  (data.cardioLog || []).forEach(e => { if (e && e.date) dates.add(e.date); });
  (data.recoveryLog || []).forEach(e => { if (e && e.date) dates.add(e.date); });
  return dates;
}

// Recompute lastLogDate (used for the streak) after any deletion, since the deleted date
// might have been the most recent logged day. Top-level so both HistoryView (deleting a
// set or a whole session) and LiveWorkout (deleting a set mid-workout) can share the exact
// same logic — this used to live only inside HistoryView, which meant calling it from
// LiveWorkout would have thrown a ReferenceError the moment that feature needed it.
function recomputeLastLogDate(nextStrengthLog, nextCardioLog, nextRecoveryLog) {
  const allDates = [
    ...Object.values(nextStrengthLog).flat().map(e => e.date),
    ...nextCardioLog.map(e => e.date),
    ...nextRecoveryLog.map(e => e.date),
  ];
  return allDates.length > 0 ? allDates.sort().slice(-1)[0] : null;
}

// Real consecutive-day streak math (the previous implementation only ever returned 0 or 1,
// which made the "day streak" number on Dashboard essentially meaningless for motivation).
function computeStreaks(dateSet) {
  if (dateSet.size === 0) return { current: 0, best: 0 };

  // Current streak: walk backward from today (or yesterday, if today hasn't been logged yet)
  // counting consecutive days.
  let current = 0;
  let cursor = new Date(todayStr() + "T00:00:00");
  if (!dateSet.has(todayStr())) {
    cursor.setDate(cursor.getDate() - 1); // today not logged yet — see if yesterday keeps a streak alive
  }
  while (dateSet.has(cursor.toISOString().slice(0, 10))) {
    current++;
    cursor.setDate(cursor.getDate() - 1);
  }

  // Best streak ever: scan every logged date, find the longest consecutive run.
  const sorted = [...dateSet].sort();
  let best = 1, run = 1;
  for (let i = 1; i < sorted.length; i++) {
    const prev = new Date(sorted[i - 1] + "T00:00:00");
    const cur = new Date(sorted[i] + "T00:00:00");
    const diffDays = Math.round((cur - prev) / (1000 * 60 * 60 * 24));
    if (diffDays === 1) { run++; } else { run = 1; }
    best = Math.max(best, run);
  }
  best = Math.max(best, current);

  return { current, best };
}

// One-time achievement badges — distinct from PRs and the streak counter, these celebrate
// specific milestones a lifter actually cares about: the first 2-plate bench, pulling your
// own bodyweight off the floor, a real 30-day streak. Checked against `newData` (the state
// AFTER the set that might have just earned one), and only fires once per badge ever —
// already-earned ids are tracked in data.milestones so they don't re-trigger every session.
function checkNewMilestones(newData, justLoggedExId, justLoggedEntry) {
  const earned = new Set((newData.milestones || []).map(m => m.id));
  const newlyEarned = [];
  const exInfo = newData.exercises.find(e => e.id === justLoggedExId);
  const exName = (exInfo?.name || "").toLowerCase();

  // First 2-plate bench: 225 lb+ (45 bar + two 45s + two 25s per side... colloquially "2 plates")
  // on any bench press variant, first time ever reaching it.
  if (!earned.has("bench_225") && exName.includes("bench press") && (justLoggedEntry.weight || 0) >= 225) {
    const priorMax = (newData.strengthLog[justLoggedExId] || []).slice(0, -1).reduce((m, e) => Math.max(m, e.weight || 0), 0);
    if (priorMax < 225) newlyEarned.push({ id: "bench_225", title: "First 2-Plate Bench", detail: `${justLoggedEntry.weight} lb — that's 45s on each side.`, icon: "🏋️" });
  }

  // First bodyweight deadlift: pulling your own bodyweight off the floor, first time ever.
  if (!earned.has("deadlift_bodyweight") && exName.includes("deadlift") && newData.profile.bodyweightLb) {
    const bw = newData.profile.bodyweightLb;
    if ((justLoggedEntry.weight || 0) >= bw) {
      const priorMax = (newData.strengthLog[justLoggedExId] || []).slice(0, -1).reduce((m, e) => Math.max(m, e.weight || 0), 0);
      if (priorMax < bw) newlyEarned.push({ id: "deadlift_bodyweight", title: "Bodyweight Deadlift", detail: `${justLoggedEntry.weight} lb — your full bodyweight, off the floor.`, icon: "💪" });
    }
  }

  // 30-day streak: real consecutive training days, checked against the state AFTER this set.
  if (!earned.has("streak_30")) {
    const { current } = computeStreaks(getTrainingDateSet(newData));
    if (current >= 30) newlyEarned.push({ id: "streak_30", title: "30-Day Streak", detail: "30 days in a row. That's a real habit now.", icon: "🔥" });
  }

  return newlyEarned;
}

// What actually happens to the body during a sauna session, by elapsed minute. Grounded in
// well-established sauna physiology (core temp rise, cardiovascular response, heat-shock
// protein expression) rather than invented specifics — deliberately descriptive about
// mechanisms rather than promising particular health outcomes, since the research on
// long-term benefits is genuinely more mixed than sauna marketing suggests.
// Physiological phases of passive heat exposure, with the parameters and mechanisms
// actually measured in the sauna literature. Written to be genuinely readable: technical
// terms are used because they're correct, but each is explained in plain language on first
// use, so a reader without a physiology background learns the vocabulary rather than being
// walled out by it. Deliberately descriptive of mechanism rather than promissory about
// outcomes — the responses below are well characterised, whereas long-term health claims
// from observational sauna studies remain confounded and are not asserted here.
const SAUNA_STAGES = [
  {
    minMinute: 0, icon: "🌡️", title: "Cutaneous vasodilation",
    headline: "Blood vessels near the skin open up",
    body: "Skin temperature rises from about 33°C to 40°C within the first few minutes. The small blood vessels feeding your skin widen (vasodilation), redirecting blood from your core out to the surface where heat can escape into the air. That's the flush you see and feel. Your internal core temperature has barely moved yet — this stage is all surface.",
  },
  {
    minMinute: 4, icon: "💧", title: "Thermoregulatory sweating",
    headline: "Sweating starts doing the real cooling",
    body: "Once your brain's temperature set point is crossed, your sweat glands switch on properly. Evaporating sweat now becomes the main way you shed heat — which is why a humid room feels so much harder, since sweat can't evaporate efficiently. Expect to lose roughly 0.5–1.0 litres of fluid across a session. Core temperature now starts climbing, around 0.1–0.2°C per minute.",
  },
  {
    minMinute: 8, icon: "❤️", title: "Cardiovascular strain",
    headline: "Your heart is now working like light exercise",
    body: "Heart rate typically reaches 100–150 bpm — comparable to a brisk walk or easy cycling. Each beat pumps more blood while your widened vessels offer less resistance, so total blood flow can roughly double. Meanwhile the fluid you're losing thins your blood volume slightly. That combination is exactly why going in dehydrated makes a session feel so much worse.",
  },
  {
    minMinute: 12, icon: "🧬", title: "Heat shock protein expression",
    headline: "Your cells switch on a protective response",
    body: "Core temperature is now up about 0.5–1.0°C — enough to register as genuine stress at the cellular level. Cells respond by producing heat shock proteins (chiefly one called HSP70), which act as molecular repair crews: they refold proteins that heat has damaged and stop them clumping together. This response keeps building for hours or even days after you leave.",
  },
  {
    minMinute: 17, icon: "🫀", title: "Sustained hyperthermia",
    headline: "The range the research actually measured",
    body: "Core temperature approaches 38.5–39°C — roughly a moderate fever, sustained deliberately. This matters because most controlled sauna studies used sessions of 15–20 minutes at 80–100°C. So this window isn't arbitrary: it's the actual condition under which the reported adaptations were observed, rather than guessed at by going longer.",
  },
  {
    minMinute: 22, icon: "⚠️", title: "Exposure threshold exceeded",
    headline: "Costs rising, benefits flattening",
    body: "You're past the duration used in the research. Beyond here you accumulate more fluid loss and cardiovascular strain, plus a higher chance of feeling faint when you stand (blood pools in those widened vessels and pressure drops). The adaptive signal doesn't scale up to match. Step out, rehydrate, cool down gradually — and stop immediately if you feel dizzy, nauseated, or notice your heart pounding or skipping.",
  },
];

function getSaunaStage(elapsedSeconds) {
  const minutes = elapsedSeconds / 60;
  let stage = SAUNA_STAGES[0];
  for (const s of SAUNA_STAGES) {
    if (minutes >= s.minMinute) stage = s;
  }
  return stage;
}

// Everything that lives behind "More" — secondary destinations, Strong keeps these one tap away
const MORE_ITEMS = [
  { id: "programs", label: "Programs", icon: Zap },
  { id: "standards", label: "Strength", icon: Award },
  { id: "measurements", label: "Measurements", icon: Ruler },
  { id: "cardio", label: "Cardio", icon: HeartPulse },
  { id: "sauna", label: "Sauna", icon: Flame },
  { id: "settings", label: "Settings", icon: SettingsIcon },
  { id: "import", label: "Import", icon: UploadCloud },
];

function IronLogPro() {
  // Netflix-style profile gate: deliberately never persisted across app opens, since the
  // whole point is asking again each time in case the device changed hands. `profiles` is
  // null while we're still checking storage (including the one-time migration below), then
  // becomes a real array once known.
  const [selectedProfile, setSelectedProfile] = useState(null);
  const [profiles, setProfiles] = useState(null);

  // Runs once at true app startup: migrates any pre-existing single-profile data (from
  // before multi-profile support existed) into the new per-profile storage scheme, then
  // loads whatever the current profile list actually is.
  useEffect(() => {
    (async () => {
      const migrated = await migrateSingleProfileIfNeeded();
      try {
        const res = await window.storage.get(PROFILES_KEY, false);
        const list = res && res.value ? JSON.parse(res.value) : [];
        setProfiles(Array.isArray(list) ? list : []);
        // If migration JUST happened in this exact page load (someone who was already
        // using the app before multi-profile support existed), carry them straight into
        // their existing data this one time instead of surprising them with an unexplained
        // "who's training?" gate right after an update. From their NEXT app open onward,
        // PROFILES_KEY already exists, migration is a no-op, and the picker shows
        // normally — this is genuinely one-time, not a way to skip the picker generally.
        if (migrated) setSelectedProfile(migrated);
      } catch (e) {
        setProfiles([]);
      }
    })();
  }, []);

  const { data, setData, loading, error } = useIronLogStore(selectedProfile ? profileDataKey(selectedProfile.id) : null);
  const [tab, setTab] = useState("dashboard");
  const [moreOpen, setMoreOpen] = useState(false);
  const [theme, setTheme] = useState(() => {
    // localStorage can throw in restrictive contexts (private browsing in some browsers,
    // file:// origins, storage disabled entirely) — this runs at the app root on every
    // mount, so an unguarded throw here would take down the whole app before it ever gets
    // a chance to render anything, not just lose the theme preference.
    try { return localStorage.getItem("theme") || "light"; } catch (e) { return "light"; }
  });

  // Applied at the app root (not inside Settings) so it takes effect regardless of which
  // tab is active — the control lives in Settings, but the actual DOM attribute and
  // persistence live here.
  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
    try { localStorage.setItem("theme", theme); } catch (e) {}
  }, [theme]);

  if (profiles === null) {
    return (
      <div style={styles.loadingWrap}>
        <style>{globalCss}</style>
        <div style={{ animation: "bouncePlate 1.1s ease-in-out infinite" }}><Logo width={190} /></div>
        <div style={{ fontFamily: "var(--font-mono)", color: "var(--ink-dim)", fontSize: 13, letterSpacing: "0.08em", display: "flex", alignItems: "center", gap: 6 }}>
          <span>LOADING</span>
          {[0, 1, 2].map(i => (
            <span key={i} style={{ display: "inline-block", width: 5, height: 5, borderRadius: "50%", background: "var(--accent)", animation: `dotPulse 1.2s ease-in-out ${i * 0.15}s infinite` }} />
          ))}
        </div>
      </div>
    );
  }

  if (!selectedProfile) {
    return (
      <ProfilePicker
        profiles={profiles}
        onSelect={(p) => { setSelectedProfile(p); setTab("dashboard"); }}
        onCreated={(nextList, newProfile) => { setProfiles(nextList); setSelectedProfile(newProfile); setTab("dashboard"); }}
        onDeleted={(nextList) => setProfiles(nextList)}
      />
    );
  }

  if (loading || !data) {
    return (
      <div style={styles.loadingWrap}>
        <style>{globalCss}</style>
        <div style={{ animation: "bouncePlate 1.1s ease-in-out infinite" }}><Logo width={190} /></div>
        <div style={{ fontFamily: "var(--font-mono)", color: "var(--ink-dim)", fontSize: 13, letterSpacing: "0.08em", display: "flex", alignItems: "center", gap: 6 }}>
          <span>LOADING</span>
          {[0, 1, 2].map(i => (
            <span key={i} style={{ display: "inline-block", width: 5, height: 5, borderRadius: "50%", background: "var(--accent)", animation: `dotPulse 1.2s ease-in-out ${i * 0.15}s infinite` }} />
          ))}
        </div>
      </div>
    );
  }

  const trainingDates = getTrainingDateSet(data);
  const { current: streak, best: bestStreak } = computeStreaks(trainingDates);

  // key={selectedProfile.id} forces this entire subtree to genuinely remount on every
  // profile switch — without it, React reuses the same component instances across
  // profiles (same type, same tree position), so any component's local state initialized
  // via useState(...) from a prop — like Dashboard's editingProfile, which decides whether
  // onboarding shows — silently carries over stale state from whichever profile was active
  // before, instead of re-evaluating fresh for the new profile's actual data. This is what
  // makes onboarding correctly re-trigger for a second profile instead of silently skipping it.
  return (
    <div style={styles.app} key={selectedProfile.id}>
      <style>{globalCss}</style>
      <header style={styles.header}>
        <div>
          <div style={styles.greeting}>{getGreeting()}{data.profile.name ? `, ${data.profile.name}` : ""}</div>
          <div style={styles.headerDate}>{new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })}</div>
        </div>
        <div style={styles.streakBadge}>
          <FireIcon size={14} />
          <span>{streak}</span>
        </div>
      </header>

      {error && (
        <div style={{background: "#C1502E", color: "#FFF", padding: "10px 16px", margin: "0 0 12px 0", borderRadius: 6, fontSize: 12}}>
          ⚠️ Storage error: {error} — Changes may not persist. Please refresh if this continues.
        </div>
      )}

      <main style={styles.main}>
        {tab === "dashboard" && <Dashboard data={data} setData={setData} setTab={setTab} streak={streak} bestStreak={bestStreak} trainingDates={trainingDates} suggestedName={selectedProfile?.name} />}
        {tab === "analytics" && <Analytics data={data} />}
        {tab === "workout" && <LiveWorkout data={data} setData={setData} setTab={setTab} />}
        {tab === "standards" && <Strength data={data} setData={setData} />}
        {tab === "programs" && <Programs data={data} setData={setData} />}
        {tab === "measurements" && <Measurements data={data} setData={setData} />}
        {tab === "cardio" && <Cardio data={data} setData={setData} />}
        {tab === "sauna" && <Sauna data={data} setData={setData} />}
        {tab === "history" && <HistoryView data={data} setData={setData} />}
        {tab === "settings" && <Settings data={data} setData={setData} theme={theme} setTheme={setTheme} onSwitchProfile={() => setSelectedProfile(null)} currentProfileName={selectedProfile?.name} activeStorageKey={selectedProfile ? profileDataKey(selectedProfile.id) : null} />}
        {tab === "import" && <ImportView data={data} setData={setData} />}
      </main>

      {/* Strong-style bottom tab bar: Home / Workout / History / Progress / More */}
      <nav style={styles.bottomBar}>
        {BOTTOM_TABS.map((t) => {
          const Icon = t.icon;
          const active = t.id === "more"
            ? MORE_ITEMS.some(m => m.id === tab)
            : tab === t.id;
          return (
            <button
              key={t.id}
              onClick={() => t.id === "more" ? setMoreOpen(true) : setTab(t.id)}
              style={styles.bottomBarBtn}
            >
              {t.primary ? (
                <div style={{ ...styles.bottomBarPrimaryCircle, ...(active ? styles.bottomBarPrimaryCircleActive : {}) }}>
                  <Icon size={20} strokeWidth={2.25} color={active ? "#FFFFFF" : "#FFFFFF"} />
                </div>
              ) : (
                <div style={{
                  width: 40, height: 26, borderRadius: 13, display: "flex", alignItems: "center", justifyContent: "center",
                  background: active ? "var(--accent-dim)" : "transparent",
                  transform: active ? "scale(1)" : "scale(1)",
                  animation: active ? "navPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1)" : "none",
                }}>
                  <Icon size={20} strokeWidth={2} color={active ? "var(--accent)" : "var(--ink-dim)"} />
                </div>
              )}
              <span style={{ fontSize: 10, fontWeight: 600, marginTop: 4, color: active ? "var(--accent)" : "var(--ink-dim)" }}>
                {t.label}
              </span>
            </button>
          );
        })}
      </nav>

      {moreOpen && (
        <div style={styles.sheetOverlay} onClick={() => setMoreOpen(false)}>
          <div style={styles.sheet} onClick={(e) => e.stopPropagation()}>
            <div style={styles.sheetHandle} />
            <div style={styles.sheetTitle}>More</div>
            <div style={styles.sheetGrid}>
              {MORE_ITEMS.map((t) => {
                const Icon = t.icon;
                const active = tab === t.id;
                return (
                  <button
                    key={t.id}
                    onClick={() => { setTab(t.id); setMoreOpen(false); }}
                    style={{ ...styles.sheetItem, ...(active ? styles.sheetItemActive : {}) }}
                  >
                    <Icon size={20} strokeWidth={2} />
                    <span>{t.label}</span>
                  </button>
                );
              })}
            </div>
            <button style={styles.sheetCloseBtn} onClick={() => setMoreOpen(false)}>Close</button>
          </div>
        </div>
      )}
    </div>
  );
}

function Dashboard({ data, setData, setTab, streak, bestStreak, trainingDates, suggestedName }) {
  const [editingProfile, setEditingProfile] = useState(!data.profile.name);
  const activeProgram = data.programs.find(p => p.active);
  const todayLogged = Object.values(data.strengthLog).flat().concat(data.cardioLog, data.recoveryLog)
    .some(e => e.date === todayStr());

  // Recent workouts: group every logged strength set by date, most recent first — this is
  // the actual "what have I been doing" view a home screen should lead with, not a bare
  // streak number. Capped at 4 so this stays a glance, not another full history screen.
  const recentSessions = useMemo(() => {
    const byDate = {};
    Object.entries(data.strengthLog).forEach(([exId, arr]) => {
      const ex = data.exercises.find(e => e.id === exId);
      arr.forEach(h => {
        if (!byDate[h.date]) byDate[h.date] = { date: h.date, exerciseNames: new Set(), totalVolume: 0, totalSets: 0 };
        byDate[h.date].exerciseNames.add(ex?.name || exId);
        byDate[h.date].totalVolume += (h.weight || 0) * (h.reps || 0);
        byDate[h.date].totalSets += 1;
      });
    });
    return Object.values(byDate)
      .sort((a, b) => b.date.localeCompare(a.date))
      .slice(0, 4)
      .map(s => ({ ...s, exerciseNames: [...s.exerciseNames] }));
  }, [data.strengthLog, data.exercises]);

  const personalBests = useMemo(() => calculatePersonalRecords(data.strengthLog, data.customExercises), [data.strengthLog, data.customExercises]);

  return (
    <div style={styles.stack}>
      {editingProfile ? (
        <Card title={data.profile.name ? "Edit profile" : ""}>
          {!data.profile.name && (
            <div style={{ marginBottom: 20 }}>
              <div style={{ fontSize: 32, marginBottom: 8 }}>💪</div>
              <div style={{ fontFamily: "var(--font-display)", fontSize: 24, fontWeight: 700, marginBottom: 6 }}>
                Welcome
              </div>
              <div style={{ fontSize: 14, color: "var(--ink-dim)", lineHeight: 1.6 }}>
                Let's get your profile set up — it takes about 30 seconds, and helps us build workouts and track your progress correctly.
              </div>
            </div>
          )}
          <ProfileForm
            profile={data.profile}
            suggestedName={suggestedName}
            onSave={(p) => {
              setData({ ...data, profile: p });
              setEditingProfile(false);
            }}
          />
        </Card>
      ) : (
        <>
          {!activeProgram && (
            <div style={{
              background: "var(--accent-dim)",
              border: "1px solid var(--accent)",
              padding: "16px",
              borderRadius: 12,
              marginBottom: 4,
            }}>
              <div style={{fontSize: 14, fontWeight: 600, color: "var(--accent)", marginBottom: 6}}>
                👉 Get started
              </div>
              <div style={{fontSize: 13, color: "var(--ink)", lineHeight: 1.5, marginBottom: 12}}>
                Build a program and we'll auto-generate your schedule with progressive overload — or just jump straight into a workout and log as you go.
              </div>
              {/* Two real paths, not one. Previously this pushed program creation as the only
                  way in, even though starting an empty workout is a completely valid (and for
                  many people, preferable) way to begin — you'd have to find it on another tab
                  to discover it existed. */}
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                <button
                  style={{ ...styles.primaryBtn, flex: 1, minWidth: 130, justifyContent: "center" }}

                >
                  Create program
                </button>
                <button
                  style={{ ...styles.secondaryBtn, flex: 1, minWidth: 130, justifyContent: "center" }}

                >
                  Start a workout

              </div>

          {/* One compact row instead of two separate tiles + a heatmap taking up real estate

                        {s.exerciseNames.join(", ")}
                      </div>
                    </div>
                    <div style={{ textAlign: "right", flexShrink: 0 }}>
                      <div style={{ fontSize: 13, fontWeight: 700, fontFamily: "var(--font-mono)", color: "var(--accent)" }}>{s.totalVolume.toLocaleString()} lb</div>
                      <div style={{ fontSize: 10, color: "var(--ink-dim)" }}>{s.totalSets} sets</div>
                    </div>
                  </button>
                ))}
              </div>
            </Card>
          ) : (
            <Card title="Recent workouts">
              <div style={styles.dimSmall}>Nothing logged yet — once you finish a workout, it'll show up here.</div>

          {personalBests.length > 0 && (
            <Card title="🏆 Personal bests">
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>

                    background: "var(--energy-dim)", borderRadius: 10, padding: "10px 12px",
                  }}>

                    <div style={{ fontSize: 10, color: "var(--ink-dim)" }}>×{pr.maxReps}</div>

              </div>

          )}
        </>
      )}
    </div>
  );
}

// Netflix-style "who's training" gate, shown on every fresh app open — deliberately never
// remembers the last-picked profile, since the whole point is re-asking each time in case
// the device changed hands. Each profile's actual workout data lives under its own storage
// key entirely (see profileDataKey), so profiles are genuinely isolated from each other —
// nothing from one can leak into another.
function ProfilePicker({ profiles, onSelect, onCreated, onDeleted }) {
  const [creating, setCreating] = useState(false);
  const [newName, setNewName] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [deleteConfirmId, setDeleteConfirmId] = useState(null);

  async function handleCreate() {
    if (!newName.trim() || busy) return;
    setBusy(true);
    setErr("");
    const id = "p_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    const name = newName.trim();
    try {
      await window.storage.set(profileDataKey(id), JSON.stringify(defaultData()), false);
      const nextList = [...profiles, { id, name, createdAt: todayStr() }];
      await window.storage.set(PROFILES_KEY, JSON.stringify(nextList), false);
      onCreated(nextList, { id, name });
    } catch (e) {
      // Leave them on the create screen with what they typed intact, rather than silently
      // losing it and dropping them back to a blank form.
      setErr("Couldn't create that profile — check your connection and try again.");
    } finally {
      setBusy(false);
    }
  }

  // Deleting a profile deletes ALL of that person's data permanently — same gravity as
  // "Delete All Data" in Settings, so it gets the same never-a-single-tap safety pattern:
  // an explicit inline confirmation naming exactly who and what, not a generic dialog.
  async function handleDelete(profile) {
    setBusy(true);
    setErr("");
    try {
      await window.storage.delete(profileDataKey(profile.id), false);
      const nextList = profiles.filter(p => p.id !== profile.id);
      await window.storage.set(PROFILES_KEY, JSON.stringify(nextList), false);
      onDeleted(nextList);
    } catch (e) {
      setErr("Couldn't delete that profile — check your connection and try again.");
    } finally {
      setBusy(false);
      setDeleteConfirmId(null);
    }
  }

  return (
    <div style={{ ...styles.app, display: "flex", flexDirection: "column", justifyContent: "center", minHeight: "100vh", overflowX: "hidden" }}>
      <style>{globalCss}</style>
      <div style={{ textAlign: "center", marginBottom: 28 }}>
        <div style={{ marginBottom: 16 }}><Logo width={170} /></div>
        <div style={{ fontFamily: "var(--font-display)", fontSize: 24, fontWeight: 700 }}>Who's training?</div>
      </div>
      {!creating ? (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {profiles.map(p => (
            <Card key={p.id} title="">
              {deleteConfirmId === p.id ? (
                <div>
                  <div style={{ fontSize: 13, color: "var(--ink)", marginBottom: 12, lineHeight: 1.5 }}>
                    Delete <strong>{p.name}</strong>? This removes all of their workout history — this can't be undone.
                  </div>

function ProfileForm({ profile, onSave, suggestedName }) {
  // If they already told us their name at the "who's training?" picker, don't make them
  // type it again here — pre-fill it as a convenience. The underlying data.profile.name
  // stays empty until Save is actually tapped, so the welcome/onboarding gate still shows
  // and age/bodyweight/sex still get genuinely confirmed rather than silently defaulted.
  const [form, setForm] = useState(() => (profile.name ? profile : { ...profile, name: suggestedName || "" }));
  const [error, setError] = useState("");

  function handleSave() {
    if (!form.name || !form.name.trim()) {
      setError("Enter your name to get started.");
      return;
    }
    setError("");
    // Defensive coercion at save time — the onBlur handlers on age/bodyweight normally
    // convert these to numbers and clamp them, but if Save is tapped before a blur event
    // ever fires (e.g. typing then tapping Save directly), the raw string could otherwise
    // flow straight into storage uncoerced.
    const ageNum = +form.age;
    const bwNum = +form.bodyweightLb;
    const hrNum = form.maxHrOverride === null || form.maxHrOverride === "" ? null : +form.maxHrOverride;
    onSave({
      ...form,
      name: form.name.trim(),
      age: isNaN(ageNum) ? 35 : Math.max(16, Math.min(120, ageNum)),
      bodyweightLb: isNaN(bwNum) ? 185 : Math.max(90, Math.min(500, bwNum)),
      maxHrOverride: hrNum === null || isNaN(hrNum) ? null : Math.max(100, Math.min(220, hrNum)),
    });
  }

  return (
    <div style={styles.formGrid}>
      <Field label="Name">
        <input
          style={{ ...styles.input, ...(error ? { border: "1px solid var(--danger)" } : {}) }}
          value={form.name}
          onChange={(e) => { setForm({ ...form, name: e.target.value }); if (error) setError(""); }}
          placeholder="e.g. Anthony"
        />
        {error && <div style={{ fontSize: 12, color: "var(--danger)", marginTop: 6, fontWeight: 600 }}>{error}</div>}
      </Field>
      <Field label="Age">
        <input type="number" inputMode="numeric" min="16" max="120" style={styles.input} value={form.age} onChange={(e) => setForm({ ...form, age: e.target.value })} onBlur={(e) => { const v = +e.target.value; setForm({ ...form, age: e.target.value === "" || isNaN(v) ? 35 : Math.max(16, Math.min(120, v)) }); }} />
      </Field>
      <Field label="Bodyweight (lb)">
        <input type="number" inputMode="decimal" min="90" max="500" style={styles.input} value={form.bodyweightLb} onChange={(e) => setForm({ ...form, bodyweightLb: e.target.value })} onBlur={(e) => { const v = +e.target.value; setForm({ ...form, bodyweightLb: e.target.value === "" || isNaN(v) ? 185 : Math.max(90, Math.min(500, v)) }); }} />
      </Field>

/* ---------------------------------------------------------------
   PROGRESSIVE OVERLOAD CALCULATOR
--------------------------------------------------------------- */
// Equipment-aware floors/baselines — a barbell can't go below an empty 45 lb bar, but that
// same 45 lb floor is nonsensical for bodyweight work (where 0 added weight is completely
// normal) or a light dumbbell/cable exercise. Forcing everything through the barbell floor
// was producing genuinely bad advice: "drop to 45 lb" on a Pull-Up that was at 5 lb added
// weight is a massive, backwards jump, not a sensible deload.
function equipmentFloorAndBaseline(equipment) {
  switch (equipment) {
    case "Barbell": return { floor: 45, baseline: 45 };
    case "EZ Bar": return { floor: 20, baseline: 20 };
    case "Bodyweight": return { floor: 0, baseline: 0 };
    case "Dumbbell": return { floor: 5, baseline: 10 };
    case "Cable": return { floor: 5, baseline: 10 };
    case "Machine": return { floor: 10, baseline: 20 };
    default: return { floor: 0, baseline: 20 };
  }
}
// Auto-generated warm-up ramp — nobody wants to do this math loading a bar. Ramps from the
// equipment floor up to the working weight in 3 steps (roughly 50%/75%/90%), rounded to a
// sensible increment, descending reps as the weight climbs. Skipped entirely for bodyweight
// exercises and anything too light for a ramp to be meaningful.
function getWarmupSets(workingWeight, equipment) {
  const { floor } = equipmentFloorAndBaseline(equipment);
  if (!workingWeight || workingWeight <= floor + 10 || equipment === "Bodyweight") return [];
  const roundTo = equipment === "Barbell" || equipment === "EZ Bar" ? 5 : (equipment === "Dumbbell" ? 2.5 : 5);
  const round = (w) => Math.max(floor, Math.round(w / roundTo) * roundTo);
  const steps = [
    { pct: 0, reps: 8 },    // the bar/floor itself
    { pct: 0.5, reps: 5 },
    { pct: 0.75, reps: 3 },
    { pct: 0.9, reps: 1 },
  ];
  const sets = steps.map(s => ({ weight: round(floor + (workingWeight - floor) * s.pct), reps: s.reps }));
  // De-dupe adjacent steps that rounded to the same weight (common for lighter working weights).
  return sets.filter((s, i) => i === 0 || s.weight !== sets[i - 1].weight);
}
// Standard US barbell plates, largest first — the actual "what do I load on the bar" math
// nobody wants to do mid-set. Greedily fills each side with the biggest plates that fit,
// down to a 2.5 lb pair, which is the smallest plate a typical gym stocks. Anything left
// over that can't be represented exactly (an odd target weight) is reported separately
// rather than silently rounded, so the number shown never quietly disagrees with the
// actual logged weight.
const STANDARD_PLATES = [45, 35, 25, 10, 5, 2.5];
function calculatePlates(totalWeight, barWeight = 45) {
  if (!totalWeight || totalWeight <= barWeight) return { plates: [], perSide: 0, remainder: 0 };
  const perSide = (totalWeight - barWeight) / 2;
  let remaining = perSide;
  const plates = [];
  for (const size of STANDARD_PLATES) {
    while (remaining >= size - 0.001) {
      plates.push(size);
      remaining -= size;
    }
  }
  // Round away floating-point crumbs (e.g. 0.0000000003) that aren't a genuine remainder.
  const remainder = Math.round(remaining * 100) / 100;
  return { plates, perSide, remainder: remainder > 0.01 ? remainder : 0 };
}
function calculateProgressiveOverload(exerciseName, history, lastAttempt, exerciseType, equipment) {
  // Recommend next set/session weight, reps, AND rest time — and be explicit about the
  // direction (more/same/less), not just descriptive. This is meant to read like a coach
  // actually pushing you, not a neutral data readout.
  const isCompound = exerciseType
    ? exerciseType === "compound"
    : ["Squat", "Deadlift", "Bench", "Press", "Row", "Pull-Up", "Pull-up", "Thrust", "Lunge"].some(c => exerciseName.includes(c));
  const restSuggestion = isCompound ? "Rest 2–3 min" : "Rest 60–90s";
  const { floor, baseline } = equipmentFloorAndBaseline(equipment);

  if (!lastAttempt) {
    return {
      recommendation: baseline === 0
        ? `🎯 First time on this one — start with bodyweight only, find something you can do for 5 clean reps, and we'll build from there. ${restSuggestion} between sets.`
        : `🎯 First time on this one — start with ${baseline} lb or a light weight, find something you can do for 5 clean reps, and we'll build from there. ${restSuggestion} between sets.`,
      nextWeight: baseline,
      nextReps: 5,
      direction: "baseline",
      restSuggestion,
      status: "no_data"
    };
  }

  const { weight, reps, targetReps } = lastAttempt;
  const hitTarget = reps >= targetReps;
  
  let nextWeight = weight;
  let nextReps = targetReps;
  let recommendation = "";
  let status = "";
  let direction = "same";
  
  if (hitTarget) {
    // Success! Push for more next time — a real coach doesn't just note it, they tell you
    // exactly what to do about it.
    const increment = isCompound ? 5 : 2.5;
    nextWeight = weight + increment;
    direction = "more";
    recommendation = `🔼 Crushed it — ${weight}×${reps}. Go up to ${nextWeight}×${targetReps} next set. ${restSuggestion}.`;
    status = "ready_to_progress";
  } else if (reps >= targetReps - 1) {
    // Almost there — hold, don't push weight yet.
    nextWeight = weight;
    nextReps = targetReps;
    direction = "same";
    recommendation = `🟡 So close — ${reps}/${targetReps}. Same weight (${weight} lb) next set, chase that last rep. ${restSuggestion}.`;
    status = "close_to_target";
  } else {
    // Missed by 2+ reps — back off, don't grind at a weight that's beating you. Floor is
    // equipment-aware now (see above), not a blanket barbell-only 45 lb minimum.
    nextWeight = Math.max(floor, weight - 5);
    direction = "less";
    recommendation = `🔽 That one was tough — ${reps}/${targetReps}. Drop to ${nextWeight}×${targetReps} next set so you can actually hit the reps. ${restSuggestion}.`;
    status = "reduce_weight";
  }
  
  return { recommendation, nextWeight, nextReps, hitTarget, status, direction, restSuggestion };
}

--------------------------------------------------------------- */
// ============================================================================
// ANALYTICS — Calculate trends, volume, PRs
// ============================================================================

function calculateVolume(strengthLog, days = 30) {
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - days);
  const cutoffStr = cutoff.toISOString().slice(0, 10);
  
  let totalVolume = 0;
  let totalSets = 0;
  // Was Object.keys(strengthLog).length — an ALL-TIME count of every exercise ever logged,
  // mixed into a function whose other fields are correctly windowed to `days`. The UI
  // literally shows this under a "Last 30 days:" header, so an exercise logged once six
  // months ago and never touched since would still count toward a "last 30 days" stat.
  const exercisesInWindow = new Set();
  
  Object.entries(strengthLog).forEach(([exId, attempts]) => {
    attempts.forEach(att => {
      if (att.date >= cutoffStr) {
        totalVolume += (att.weight || 0) * (att.reps || 0) * (att.sets || 1);
        totalSets += (att.sets || 1);
        exercisesInWindow.add(exId);
      }
    });
  });
  
  return { totalVolume: Math.round(totalVolume), totalSets, exerciseCount: exercisesInWindow.size };
}

function calculatePersonalRecords(strengthLog, customExercises) {
  const prs = [];
  Object.entries(strengthLog).forEach(([exId, attempts]) => {
    if (attempts.length === 0) return;
    const maxByWeight = attempts.reduce((a, b) => ((a.weight || 0) > (b.weight || 0) ? a : b), attempts[0]);
    const libEx = findLibraryExercise(exId, customExercises);
    prs.push({
      exId,
      name: libEx?.name || exId,
      maxWeight: maxByWeight.weight,
      maxReps: maxByWeight.reps,
      date: maxByWeight.date,
      allTime: true,
    });
  });
  return prs.sort((a, b) => (b.maxWeight || 0) - (a.maxWeight || 0));
}

function calculateWorkoutConsistency(data, days = 30) {
  // Was counting SCHEDULED workout dates from the program (with no upper bound — even
  // dates weeks in the future counted), not days the user actually trained. That meant
  // "consistency" could show a high percentage the moment a program was created, before
  // a single set was ever logged — an actively misleading false positive, not just an
  // inert feature. Now measures genuine training activity via getTrainingDateSet, the
  // same real "did you do anything that day" data the streak/heatmap feature uses.
  const trainingDates = getTrainingDateSet(data);
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - days);
  const today = new Date(todayStr() + "T00:00:00");

  let completed = 0;
  trainingDates.forEach(dateStr => {
    const d = new Date(dateStr + "T00:00:00");
    if (d >= cutoff && d <= today) completed++;
  });

  return { workoutsCompleted: completed, daysTracked: days, percentage: Math.round((completed / days) * 100) };
}

function calculateVolumeChart(strengthLog, days = 30) {
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - days);
  
  const chart = [];
  for (let i = days; i >= 0; i--) {
    const date = new Date();
    date.setDate(date.getDate() - i);
    const dateStr = date.toISOString().slice(0, 10);
    let dayVolume = 0;
    
    Object.values(strengthLog).forEach(attempts => {
      attempts.forEach(att => {
        if (att.date === dateStr) {
          dayVolume += (att.weight || 0) * (att.reps || 0) * (att.sets || 1);
        }
      });
    });
    
    if (dayVolume > 0) {
      chart.push({ date: dateStr.slice(-5), volume: Math.round(dayVolume / 1000) }); // In thousands
    }
  }
  
  return chart.slice(-15); // Last 15 workouts only
}

// Volume broken down by muscle group over a rolling window — the single most actionable
// insight a lifter can get at a glance: which groups have actually been trained, and how
// they compare to each other. Falls back to the library/custom-exercise lookup for group
// when data.exercises itself doesn't have it (e.g. very old entries from before groups were
// consistently recorded), rather than silently dropping that volume from the breakdown.
function calculateMuscleGroupVolume(data, days = 30) {
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - days);
  const cutoffStr = cutoff.toISOString().slice(0, 10);

  const groupVolume = {};
  Object.entries(data.strengthLog).forEach(([exId, attempts]) => {
    const registered = data.exercises.find(e => e.id === exId);
    const libEx = findLibraryExercise(exId, data.customExercises);
    const group = registered?.group || libEx?.group || "Other";
    attempts.forEach(att => {
      if (att.date >= cutoffStr) {
        const vol = (att.weight || 0) * (att.reps || 0) * (att.sets || 1);
        groupVolume[group] = (groupVolume[group] || 0) + vol;
      }
    });
  });

  return Object.entries(groupVolume)
    .map(([group, volume]) => ({ group, volume: Math.round(volume) }))
    .sort((a, b) => b.volume - a.volume);
}

        // True merge, not overwrite — importing an older backup must never destroy anything

        const mergedExercises = [...data.exercises];

          const toAdd = entries.filter(e2 => !existingKeys.has(`${e2.date}|${e2.weight}|${e2.reps}|${e2.rpe}`));

          exercises: mergedExercises,

        setTimeout(() => setImportMsg(""), 3000);
      }
    };
    reader.readAsText(file);

    }
  };

// ============================================================================
// DYNAMIC WORKOUT ADJUSTMENT — Auto-adjust based on previous performance
// ============================================================================

function adjustWorkoutForPerformance(workout, strengthLog, customExercises) {
  if (!workout || !workout.exercises) return workout;
  
  return {
    ...workout,
    exercises: workout.exercises.map(ex => {
      const history = strengthLog[ex.exId] || [];
      if (history.length === 0) return ex; // No history, keep as-is
      
      const lastAttempt = history[history.length - 1];
      const libEx = findLibraryExercise(ex.exId, customExercises);

      // Coming back after a real layoff (10+ days since this exercise was last touched)
      // deserves a lighter, safer restart — not the normal "you hit target, add 5 lb"
      // progression math, which assumes continuous training and can load someone up too
      // fast right after time off. This is a real safety consideration, not just UX polish.
      const daysSinceLastAttempt = Math.round((new Date(todayStr()) - new Date(lastAttempt.date)) / 86400000);
      if (daysSinceLastAttempt >= 10) {
        const { floor } = equipmentFloorAndBaseline(libEx?.equipment);
        const easedWeight = Math.max(floor, Math.round(((lastAttempt.weight || 0) * 0.85) / 5) * 5);
        return {
          ...ex,
          weight: easedWeight,
          _originalWeight: ex.weight,
          _adjusted: easedWeight !== ex.weight,
          _comeback: true,
          _daysSinceLastAttempt: daysSinceLastAttempt,
          _recommendation: `Welcome back — it's been ${daysSinceLastAttempt} days since you trained this, so we eased the weight down from your last ${lastAttempt.weight} lb to ${easedWeight} lb to ease back in safely.`,
        };
      }

      const overload = calculateProgressiveOverload(ex.name, history, lastAttempt, libEx?.type, libEx?.equipment);
      
      // Determine if we should adjust
      if (!overload) return ex;
      
      const hitTarget = overload.hitTarget; // Did they hit the target reps last time?
      const recommendation = overload.recommendation; // "Increase weight", "Hit target", etc.
      
      // Logic: If they hit the target, use the recommended next weight
      // Otherwise, keep current weight (they struggled)
      const adjustedWeight = hitTarget ? overload.nextWeight : ex.weight;
      
      // Optionally adjust reps if weight increased
      // Keep reps the same unless weight increased significantly
      const adjustedReps = adjustedWeight > ex.weight ? Math.max(ex.reps - 1, 1) : ex.reps;
      
      return {
        ...ex,
        weight: adjustedWeight,
        reps: adjustedReps,
        _originalWeight: ex.weight, // Store original for display
        _adjusted: adjustedWeight !== ex.weight, // Flag for UI
        _recommendation: recommendation,
      };
    })
  };
}
