    // Self-contained chart components (no external CDN dependency)
    function SimpleLineChart({ data, lines, height = 180, xKey = "date" }) {
      if (!data || data.length === 0) return null;
      const width = 600;
      const padding = { top: 10, right: 10, bottom: 24, left: 8 };
      const innerW = width - padding.left - padding.right;
      const innerH = height - padding.top - padding.bottom;
      const allValues = data.flatMap(d => lines.map(l => Number(d[l.key]) || 0));
      const minV = Math.min(...allValues, 0);
      const maxV = Math.max(...allValues, 1);
      const range = (maxV - minV) || 1;
      const xStep = data.length > 1 ? innerW / (data.length - 1) : 0;
      const yFor = (v) => padding.top + innerH - ((v - minV) / range) * innerH;
      const xFor = (i) => padding.left + i * xStep;
      const labelEvery = Math.max(1, Math.ceil(data.length / 6));
      return (
        <svg viewBox={`0 0 ${width} ${height}`} width="100%" height={height} preserveAspectRatio="none">
          {[0, 0.25, 0.5, 0.75, 1].map((t, i) => (
            <line key={i} x1={padding.left} x2={width - padding.right}
              y1={padding.top + innerH * t} y2={padding.top + innerH * t}
              stroke="var(--line)" strokeWidth="1" />
          ))}
          {lines.map((l, li) => {
            const points = data.map((d, i) => `${xFor(i)},${yFor(Number(d[l.key]) || 0)}`).join(" ");
            return (
              <g key={li}>
                <polyline points={points} fill="none" stroke={l.color} strokeWidth="2" />
                {data.map((d, i) => (
                  <circle key={i} cx={xFor(i)} cy={yFor(Number(d[l.key]) || 0)} r="2.5" fill={l.color} />
                ))}
              </g>
            );
          })}
          {data.map((d, i) => {
            if (i % labelEvery !== 0 && i !== data.length - 1) return null;
            return (
              <text key={i} x={xFor(i)} y={height - 6} fontSize="9" fill="var(--ink-dim)" textAnchor="middle">{d[xKey]}</text>
            );
          })}
        </svg>
      );
    }
    function SimpleBarChart({ data, barKey, color = "#5FA8A0", height = 120, xKey = "date" }) {
      if (!data || data.length === 0) return null;
      const width = 600;
      const padding = { top: 10, right: 10, bottom: 24, left: 8 };
      const innerW = width - padding.left - padding.right;
      const innerH = height - padding.top - padding.bottom;
      const values = data.map(d => Number(d[barKey]) || 0);
      const maxV = Math.max(...values, 1);
      const gap = innerW / data.length;
      const barW = gap * 0.6;
      const labelEvery = Math.max(1, Math.ceil(data.length / 6));
      return (
        <svg viewBox={`0 0 ${width} ${height}`} width="100%" height={height} preserveAspectRatio="none">
          {data.map((d, i) => {
            const v = Number(d[barKey]) || 0;
            const barH = (v / maxV) * innerH;
            const x = padding.left + i * gap + (gap - barW) / 2;
            const y = padding.top + innerH - barH;
            return <rect key={i} x={x} y={y} width={barW} height={Math.max(barH, 1)} fill={color} rx="3" />;
          })}
          {data.map((d, i) => {
            if (i % labelEvery !== 0 && i !== data.length - 1) return null;
            const x = padding.left + i * gap + gap / 2;
            return <text key={i} x={x} y={height - 6} fontSize="9" fill="var(--ink-dim)" textAnchor="middle">{d[xKey]}</text>;
          })}
        </svg>
      );
    }

function generateProgramWorkouts(phase, weeks, templateKey, startDate = todayStr()) {
  const template = WORKOUT_TEMPLATES[templateKey];
  if (!template) return [];

  const workouts = [];
  const phaseObj = PHASES.find(p => p.id === phase);
  const volumeMultiplier = phaseObj?.id === "strength" ? 0.8 : phaseObj?.id === "power" ? 0.6 : 1.0;
  
  let currentDate = new Date(startDate);
  let dayOfPattern = 0;

  for (let week = 1; week <= weeks; week++) {
    for (let i = 0; i < 7; i++) {
      const focusArea = template.pattern[dayOfPattern % 7];
      const dateStr = currentDate.toISOString().split('T')[0];

      if (focusArea !== "Rest") {
        const exercises = (TEMPLATE_EXERCISE_PICKS[templateKey]?.[focusArea] || []).map(ex => ({
          ...ex,
          // Adjust sets/reps based on phase
          sets: phase === "strength" ? Math.max(3, ex.sets - 1) : ex.sets,
          reps: phase === "strength" ? Math.max(3, Math.floor(ex.reps * 0.7)) : phase === "power" ? Math.max(1, Math.floor(ex.reps * 0.5)) : ex.reps,
          weight: Math.round(ex.weight * volumeMultiplier),
        }));

        workouts.push({
          id: Math.random().toString(36).slice(2),
          date: dateStr,
          week,
          focus: focusArea,
          exercises,
        });
      }

      currentDate.setDate(currentDate.getDate() + 1);
      dayOfPattern++;
    }
  }

  return workouts;
}

/* ---------------------------------------------------------------

--------------------------------------------------------------- */
const STORAGE_KEY = "ironlog-pro:v2";

function useIronLogStore() {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [isSaving, setIsSaving] = useState(false);
  const pendingRef = useRef(null);

  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(STORAGE_KEY, false);
        if (res && res.value) {
          setData(JSON.parse(res.value));
        } else {
          setData(defaultData());
        }
      } catch (e) {
        setData(defaultData());
      } finally {
        setLoading(false);
      }
    })();
  }, []);

  const save = useCallback(async (next) => {
    setData(next);
    pendingRef.current = next;
    
    // If already saving, queue for next save
    if (isSaving) return;
    
    setIsSaving(true);
    try {
      // Use queued data (might have been updated while saving)
      const toSave = pendingRef.current || next;
      await window.storage.set(STORAGE_KEY, JSON.stringify(toSave), false);
      
      // If pending changed during save, save again
      if (pendingRef.current !== toSave) {
        await save(pendingRef.current);
      }
    } catch (e) {
      setError("Save failed: " + (e?.message || "unknown error"));
    } finally {
      setIsSaving(false);
    }
  }, [isSaving]);

  return { data, setData: save, loading, error };
}

const todayStr = () => {
  const d = new Date();
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const date = String(d.getDate()).padStart(2, '0');
  return `${year}-${month}-${date}`;
};
const fmtDate = (d) => new Date(d + "T00:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric" });
const estMaxHr = (profile) => {
  if (profile.maxHrOverride) return profile.maxHrOverride;
  return Math.round(207 - 0.7 * (profile.age || 35));
};

function getStrengthCategory(weight, exercise, bodyweight, sex = "m") {
  const standards = STRENGTH_STANDARDS[sex]?.[exercise] || STRENGTH_STANDARDS.male[exercise];
  if (!standards || !weight || weight < 0 || !bodyweight || bodyweight < 0) {
    return { level: "unknown", nextLevel: null, remaining: 0, nextTarget: null };
  }
  
  // Clamp bodyweight to available brackets
  const minBracket = 120;
  const maxBracket = 200;
  const clampedBw = Math.max(minBracket, Math.min(maxBracket, bodyweight));
  
  let bracket = standards[0];
  for (let s of standards) {
    if (clampedBw <= s.bw) { bracket = s; break; }
  }
  
  const levels = ["untrained", "novice", "intermediate", "advanced", "elite"];
  let currentLevel = "untrained";
  for (let level of levels) {
    if (weight >= bracket[level]) currentLevel = level;
  }
  
  const idx = levels.indexOf(currentLevel);
  const nextLevel = idx < levels.length - 1 ? levels[idx + 1] : null;
  const nextTarget = nextLevel ? bracket[nextLevel] : null;
  const remaining = nextTarget ? Math.max(0, nextTarget - weight) : 0;
  
  return { level: currentLevel, nextLevel, remaining, nextTarget };
}

function calculateStreak(lastLogDate) {
  if (!lastLogDate) return 0;
  const today = todayStr();
  const last = new Date(lastLogDate + "T00:00:00");
  const now = new Date(today + "T00:00:00");
  const daysSinceLog = Math.floor((now - last) / (1000 * 60 * 60 * 24));
  if (daysSinceLog > 1) return 0;
  if (daysSinceLog === 0) return 1; // logged today already
  // yesterday was logged, so streak continues today if they log
  return 1;
}

/* ---------------------------------------------------------------
   PROGRESSIVE OVERLOAD CALCULATOR
--------------------------------------------------------------- */
function calculateProgressiveOverload(exerciseName, history, lastAttempt, exerciseType) {
  // Recommend next workout weight/reps based on last performance
  if (!lastAttempt) {
    return { 
      recommendation: "🎯 Start with bar (45 lb) and establish a baseline",
      nextWeight: 45, 
      nextReps: 5,
      status: "no_data"
    };
  }

  const { weight, reps, targetReps } = lastAttempt;
  const hitTarget = reps >= targetReps;
  
  let nextWeight = weight;
  let nextReps = targetReps;
  let recommendation = "";
  let status = "";
  
  if (hitTarget) {
    // Success! Add weight for next time
    const isCompound = exerciseType
      ? exerciseType === "compound"
      : ["Squat", "Deadlift", "Bench", "Press", "Row", "Pull-Up", "Pull-up", "Thrust", "Lunge"].some(c => exerciseName.includes(c));
    const increment = isCompound ? 5 : 2.5;
    nextWeight = weight + increment;
    recommendation = `✅ Nice! You hit ${weight}×${reps}. Next: Try ${nextWeight}×${targetReps}`;
    status = "ready_to_progress";
  } else if (reps >= targetReps - 1) {
    // Almost there
    nextWeight = weight;
    nextReps = targetReps;
    recommendation = `Almost! You got ${reps}/${targetReps}. Try ${weight}×${targetReps} again next time.`;
    status = "close_to_target";
  } else {
    // Missed by 2+ reps
    nextWeight = Math.max(45, weight - 5);
    recommendation = `${reps}/${targetReps} reps. Dial it back to ${nextWeight}×${targetReps} next session.`;
    status = "reduce_weight";
  }
  
  return { recommendation, nextWeight, nextReps, hitTarget, status };
}

function LiveWorkout({ data, setData }) {
  const [sessionStarted, setSessionStarted] = useState(false);
  const [currentSetIdx, setCurrentSetIdx] = useState(0);
  const [repsAchieved, setRepsAchieved] = useState("");
  const [rpeVal, setRpeVal] = useState(7);
  const [isSubmitting, setIsSubmitting] = useState(false);
  const activeProgram = data.programs.find(p => p.active);
  
  if (!activeProgram) {
    return (
      <div style={styles.stack}>
        <Card title="Live workout">
          <div style={styles.dimSmall}>No program active. Create one in the Programs tab to start training.</div>
        </Card>
      </div>
    );
  }

  if (!activeProgram.workouts || activeProgram.workouts.length === 0) {
    return (
      <div style={styles.stack}>
        <Card title="Live workout">
          <div style={styles.dimSmall}>Program "{activeProgram.name}" has no workouts generated. Try creating a new program.</div>
        </Card>
      </div>
    );
  }

  const todayPlan = activeProgram.workouts.find(w => w.date === todayStr());
  const exercises = todayPlan?.exercises || [];

  if (!todayPlan) {
    const lastWorkout = [...activeProgram.workouts].reverse().find(w => w.date < todayStr());
    const nextWorkout = activeProgram.workouts.find(w => w.date > todayStr());
    return (
      <div style={styles.stack}>
        <Card title="Live workout">
          <div style={styles.dimSmall}>No workout scheduled for today.</div>
          {lastWorkout && <div style={{...styles.dimSmall, marginTop: 8}}>Last session: {fmtDate(lastWorkout.date)} ({lastWorkout.focus})</div>}
          {nextWorkout && <div style={{...styles.dimSmall, marginTop: 4}}>Next session: {fmtDate(nextWorkout.date)} ({nextWorkout.focus})</div>}
        </Card>
      </div>
    );
  }

  if (!sessionStarted) {
    return (
      <div style={styles.stack}>
        <Card title="Today's workout">
          <div style={styles.workoutPlan}>
            {exercises.map((ex, i) => {
              // Find last attempt for this exercise to show progression
              const exHistory = data.strengthLog[ex.exId] || [];
              const lastAttempt = exHistory.length > 0 ? exHistory[exHistory.length - 1] : null;
              const overload = lastAttempt ? calculateProgressiveOverload(ex.name, exHistory, lastAttempt) : null;
              
              return (
                <div key={i} style={{...styles.workoutExercise, borderLeft: overload && overload.hitTarget ? "3px solid var(--accent)" : "3px solid var(--line)"}}>
                  <div style={styles.exName}>{ex.name}</div>
                  <div style={styles.exSpec}>{ex.sets}×{ex.reps} @ {ex.weight} lb</div>
                  {lastAttempt && (
                    <div style={{fontSize: 11, color: "var(--ink-dim)", marginTop: 6, fontFamily: "var(--font-mono)"}}>
                      Last: {lastAttempt.weight}×{lastAttempt.reps} ({lastAttempt.date})
                      {overload && overload.hitTarget ? " ✅" : ""}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
          <button style={styles.primaryBtn} onClick={() => setSessionStarted(true)}>
            <Play size={14} /> Start session
          </button>
        </Card>
      </div>
    );
  }

  const currentEx = exercises[currentSetIdx];

  return (
    <div style={styles.stack}>
      <Card title="Live session">
        <div style={styles.liveHeader}>
          <div style={styles.liveExName}>{currentEx.name}</div>
          <div style={styles.liveProgress}>{currentSetIdx + 1} / {exercises.length}</div>
        </div>
        <div style={styles.liveSpec}>
          <div style={styles.specItem}>
            <div style={styles.specLabel}>Weight</div>
            <div style={styles.specValue}>{currentEx.weight} lb</div>
          </div>
          <div style={styles.specItem}>
            <div style={styles.specLabel}>Target reps</div>
            <div style={styles.specValue}>{currentEx.reps}</div>
          </div>
          <div style={styles.specItem}>
            <div style={styles.specLabel}>Sets</div>
            <div style={styles.specValue}>{currentEx.sets}</div>
          </div>
        </div>
      </Card>

      <Card title="Log this set">
        <div style={styles.formGrid}>
          <Field label="Reps achieved">
            <input type="number" style={styles.input} value={repsAchieved} onChange={(e) => setRepsAchieved(e.target.value)} />
          </Field>
          <Field label="RPE (1-10)">
            <input type="number" min="1" max="10" style={styles.input} value={rpeVal} onChange={(e) => setRpeVal(e.target.value)} />
          </Field>
        </div>
        <button
          style={{...styles.primaryBtn, opacity: isSubmitting ? 0.6 : 1, cursor: isSubmitting ? "wait" : "pointer"}}
          disabled={isSubmitting}
          onClick={() => {
            if (!repsAchieved || isSubmitting) return;
            setIsSubmitting(true);
            
            let exId = currentEx.exId;
            if (!exId) {
              const found = data.exercises.find(e => e.name.toLowerCase() === currentEx.name.toLowerCase());
              exId = found?.id || "other";
            }
            
            const entry = {
              date: todayStr(),
              weight: +currentEx.weight || 0,
              reps: +repsAchieved,
              sets: currentEx.sets,
              rpe: +rpeVal,
              targetReps: currentEx.reps,
            };
            const updated = {
              ...data,
              strengthLog: {
                ...data.strengthLog,
                [exId]: [...(data.strengthLog[exId] || []), entry],
              },
              lastLogDate: todayStr(),
            };
            setData(updated);
            
            if (currentSetIdx < exercises.length - 1) {
              setCurrentSetIdx(currentSetIdx + 1);
              setRepsAchieved("");
              setRpeVal(7);
              setIsSubmitting(false);
            } else {
              setSessionStarted(false);
              setIsSubmitting(false);
              alert("Workout complete! Great session.");
            }
          }}
        >
          <Check size={14} /> {isSubmitting ? "Saving..." : "Set done, next"}
        </button>
      </Card>

      <RestTimer seconds={120} />
    </div>
  );
}

function RestTimer({ seconds = 120 }) {
  const [remaining, setRemaining] = useState(seconds);
  const [running, setRunning] = useState(false);
  const [customInput, setCustomInput] = useState("");
  const [completed, setCompleted] = useState(false);

  useEffect(() => setRemaining(seconds), [seconds]);
  
  // Main timer loop
  useEffect(() => {
    if (!running) return;
    if (remaining <= 0) { 
      setRunning(false);
      setCompleted(true);
      // Vibration on completion
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      // Audio beep (if browser allows)
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = 800;
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.2);
      } catch (e) {}
      // Auto-clear completed state after 2 seconds
      setTimeout(() => setCompleted(false), 2000);
      return;
    }
    const t = setTimeout(() => setRemaining((r) => r - 1), 1000);
    return () => clearTimeout(t);
  }, [running, remaining]);

  const mm = String(Math.floor(remaining / 60)).padStart(2, "0");
  const ss = String(remaining % 60).padStart(2, "0");
  const pct = Math.max(0, remaining / seconds);
  const pctDisplay = Math.round(pct * 100);

  const presets = [30, 60, 90, 120, 180];
  
  const setDuration = (secs) => {
    setRemaining(secs);
    setRunning(false);
    setCompleted(false);
  };

  const handleCustomSet = () => {
    const val = parseInt(customInput);
    if (val && val > 0 && val <= 600) {
      setDuration(val);
      setCustomInput("");
    }
  };

  return (
    <Card title="Rest timer">
      <div style={{...styles.timerBox, opacity: completed ? 0.6 : 1}}>
        {/* SVG Ring */}
        <div style={{ position: "relative", width: 100, height: 100 }}>
          <svg width="100" height="100" viewBox="0 0 100 100" style={{ position: "absolute", top: 0, left: 0 }}>
            <circle cx="50" cy="50" r="45" fill="none" stroke="var(--line)" strokeWidth="3" />
            <circle
              cx="50" cy="50" r="45" fill="none" stroke={completed ? "#C1502E" : "var(--accent)"} strokeWidth="3"
              strokeDasharray={2 * Math.PI * 45}
              strokeDashoffset={2 * Math.PI * 45 * (1 - pct)}
              strokeLinecap="round"
              transform="rotate(-90 50 50)"
              style={{ 
                transition: "stroke-dashoffset 1s linear, stroke 0.2s",
                filter: completed ? "drop-shadow(0 0 8px #C1502E)" : "none"
              }}
            />
          </svg>
          {/* Center text */}
          <div style={{
            position: "absolute", top: 0, left: 0, width: 100, height: 100,
            display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center"
          }}>
            <div style={{ fontFamily: "var(--font-mono)", fontSize: 24, fontWeight: 700, letterSpacing: "0.05em" }}>
              {mm}:{ss}
            </div>
            <div style={{ fontFamily: "var(--font-mono)", fontSize: 11, color: "var(--ink-dim)", letterSpacing: "0.08em" }}>
              {pctDisplay}%
            </div>
          </div>
        </div>

        {/* Controls */}
        <div style={styles.timerBtns}>
          <button style={{...styles.iconBtn, minWidth: 44, minHeight: 44}} onClick={() => setRunning(!running)} title={running ? "Pause" : "Start"}>
            {running ? <Pause size={18} /> : <Play size={18} />}
          </button>
          <button style={{...styles.iconBtn, minWidth: 44, minHeight: 44}} onClick={() => { setRunning(false); setRemaining(seconds); setCompleted(false); }} title="Reset">
            <RotateCcw size={18} />
          </button>
        </div>

        {completed && <div style={{ fontFamily: "var(--font-display)", fontSize: 12, color: "#C1502E", fontWeight: 600, marginTop: 8, letterSpacing: "0.05em" }}>✓ REST COMPLETE</div>}

        {/* Preset buttons */}
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", justifyContent: "center", marginTop: 12 }}>
          {presets.map(p => (
            <button
              key={p}
              onClick={() => setDuration(p)}
              style={{
                ...styles.ghostBtn,
                padding: "6px 12px",
                fontSize: 12,
                fontFamily: "var(--font-mono)",
                fontWeight: 500,
                minWidth: 44,
                minHeight: 44,
                background: remaining === p && !customInput ? "var(--accent)" : "transparent",
                color: remaining === p && !customInput ? "var(--bg)" : "var(--ink)",
                border: `1px solid ${remaining === p && !customInput ? "var(--accent)" : "var(--line)"}`
              }}
            >
              {p}s
            </button>
          ))}
        </div>

        {/* Custom input */}
        <div style={{ display: "flex", gap: 6, marginTop: 12 }}>
          <input
            type="number"
            min="1"
            max="600"
            style={{ ...styles.input, flex: 1, padding: "8px 12px", fontSize: 12 }}
            value={customInput}
            onChange={(e) => setCustomInput(Math.max(1, Math.min(600, e.target.value)))}
            placeholder="Custom (1-600s)"
            onKeyDown={(e) => { if(e.key === "Enter") handleCustomSet(); }}
          />
          <button
            style={{...styles.primaryBtn, padding: "8px 12px", fontSize: 12, minWidth: 44, minHeight: 44}}
            onClick={handleCustomSet}
            disabled={!customInput}
          >
            Set
          </button>
        </div>
      </div>
    </Card>
  );
}

/* ---------------------------------------------------------------
   CARDIO
--------------------------------------------------------------- */
function Cardio({ data, setData }) {
  const maxHr = estMaxHr(data.profile);
  const zones = [
    { zone: 1, label: "Recovery", lo: 0.5, hi: 0.6 },
    { zone: 2, label: "Aerobic", lo: 0.6, hi: 0.7 },
    { zone: 3, label: "Tempo", lo: 0.7, hi: 0.8 },
    { zone: 4, label: "Threshold", lo: 0.8, hi: 0.9 },
    { zone: 5, label: "VO2", lo: 0.9, hi: 1.0 },
  ].map(z => ({ ...z, loBpm: Math.round(z.lo * maxHr), hiBpm: Math.round(z.hi * maxHr) }));

  const [type, setType] = useState("Run");
  const [minutes, setMinutes] = useState("");
  const [avgHr, setAvgHr] = useState("");

  const logCardio = () => {
    if (!minutes || !avgHr) return;
    const pct = (+avgHr) / maxHr;
    let zone = 1;
    for (let z of zones) {
      if (pct >= z.lo && pct < z.hi) { zone = z.zone; break; }
    }
    if (pct >= 1.0) zone = 5;
    const entry = { date: todayStr(), type, minutes: +minutes, avgHr: +avgHr, zone };
    setData({ ...data, cardioLog: [...data.cardioLog, entry], lastLogDate: todayStr() });
    setMinutes(""); setAvgHr("");
  };

  const chartData = data.cardioLog.slice(-14).map(c => ({ date: fmtDate(c.date), avgHr: c.avgHr }));

  return (
    <div style={styles.stack}>
      <Card title={`Heart rate zones (Max HR ≈ ${maxHr} bpm)`}>
        <div style={styles.zoneList}>
          {zones.map(z => (
            <div key={z.zone} style={styles.zoneRow}>
              <div style={{ ...styles.zoneDot, background: zoneColor(z.zone) }} />
              <span>Z{z.zone} · {z.label}</span>
              <span style={styles.mono}>{z.loBpm}–{z.hiBpm}</span>
            </div>
          ))}
        </div>
      </Card>

      <Card title="Log cardio">
        <div style={styles.formGrid3}>
          <Field label="Type">
            <select style={styles.input} value={type} onChange={(e) => setType(e.target.value)}>
              {["Run", "Row", "Bike", "Swim"].map(t => <option key={t}>{t}</option>)}
            </select>
          </Field>
          <Field label="Minutes"><input type="number" min="1" max="300" style={styles.input} value={minutes} onChange={(e) => setMinutes(Math.max(1, Math.min(300, e.target.value)))} /></Field>
          <Field label="Avg HR (bpm)"><input type="number" min="30" max="220" style={styles.input} value={avgHr} onChange={(e) => setAvgHr(Math.max(30, Math.min(220, e.target.value)))} onKeyDown={(e) => { if(e.key === "Enter" && minutes && avgHr) logCardio(); }} placeholder="Press Enter to log" /></Field>
        </div>
        <button style={styles.primaryBtn} onClick={logCardio}><Plus size={14} /> Log session</button>
      </Card>

      {chartData.length > 1 && (
        <Card title="HR trend">
          <div style={{ height: 140 }}>
            <SimpleLineChart height={140} data={chartData} lines={[
              { key: "avgHr", color: "#5FA8A0", name: "Avg HR" },
            ]} />
          </div>
        </Card>
      )}
    </div>
  );
}

function zoneColor(z) {
  return ["#5FA8A0", "#5FA8A0", "#C9A24B", "#C1502E", "#C1502E"][z - 1];
}

/* ---------------------------------------------------------------
   HISTORY
--------------------------------------------------------------- */
function HistoryView({ data }) {
  const allEvents = useMemo(() => {
    const events = [];
    Object.entries(data.strengthLog).forEach(([exId, arr]) => {
      const ex = data.exercises.find(e => e.id === exId);
      arr.forEach(h => events.push({ date: h.date, kind: "Strength", detail: `${ex?.name}: ${h.weight} lb × ${h.reps}` }));
    });
    data.cardioLog.forEach(c => events.push({ date: c.date, kind: "Cardio", detail: `${c.type}: ${c.minutes} min` }));
    data.measurements.forEach(m => events.push({ date: m.date, kind: "Measurements", detail: `C:${m.chest} A:${m.arm} W:${m.waist}` }));
    return events.sort((a, b) => b.date.localeCompare(a.date));
  }, [data]);

  return (
    <div style={styles.stack}>
      <Card title={`Full log (${allEvents.length} entries)`}>
        {allEvents.length === 0 ? (
          <EmptyHint text="No activity yet." />
        ) : (
          <div style={styles.logList}>
            {allEvents.map((e, i) => (
              <div key={i} style={styles.logRow}>
                <span style={styles.dim}>{fmtDate(e.date)}</span>
                <span style={{ ...styles.kindTag, color: kindTagColor(e.kind) }}>{e.kind}</span>
                <span style={styles.mono}>{e.detail}</span>
              </div>
            ))}
          </div>
        )}
      </Card>
    </div>
  );
}

function kindTagColor(kind) {
  const map = { Strength: "#C9A24B", Cardio: "#5FA8A0", Measurements: "#8FA5B3", Recovery: "#C1502E" };
  return map[kind] || "var(--ink-dim)";
}

/* ---------------------------------------------------------------
   IMPORT
--------------------------------------------------------------- */
function ImportView({ data, setData }) {
  const [raw, setRaw] = useState("");
  const [status, setStatus] = useState(null);

  const parseAndImport = () => {
    try {
      const parsed = JSON.parse(raw);
      const list = Array.isArray(parsed) ? parsed : [parsed];
      const normalized = list.map(item => ({
        date: item.date || todayStr(),
        hr: item.hr || item.heartRate || null,
      }));
      setData({ ...data, hrImports: [...data.hrImports, ...normalized] });
      setStatus({ ok: true, msg: `Imported ${normalized.length} entries.` });
      setRaw("");
    } catch (e) {
      setStatus({ ok: false, msg: "Parse error." });
    }
  };

  return (
    <div style={styles.stack}>
      <Card title="Apple Health import">
        <p style={styles.para}>
          Build a Shortcuts automation that exports HR data as JSON, then paste it here.
        </p>
        <textarea
          style={styles.textarea}
          rows={4}
          placeholder='[{"date":"2026-08-05","hr":142}]'
          value={raw}
          onChange={(e) => setRaw(e.target.value)}
        />
        <button style={styles.primaryBtn} onClick={parseAndImport}><UploadCloud size={14} /> Import</button>
        {status && (
          <div style={{ fontSize: 12, marginTop: 8, color: status.ok ? "var(--accent)" : "#C1502E" }}>
            {status.ok ? "✓" : "✕"} {status.msg}
          </div>
        )}
      </Card>
    </div>
  );
}
