          rather than hardcoded, so it stays correct if the timer's height changes (e.g. the
          settings panel expanding). */}
      <div style={{ height: timerBarHeight }} />

      {exercises.map((rawEx, exIdx) => {
        const override = exerciseOverrides[exIdx];
        const currentEx = override ? { ...rawEx, name: override.name, exId: override.exId } : rawEx;
        const exHistory = data.strengthLog[currentEx.exId] || [];
        const lastAttempt = exHistory.length > 0 ? exHistory[exHistory.length - 1] : null;
        const libExForHint = findLibraryExercise(currentEx.exId, data.customExercises);
        const overload = lastAttempt ? calculateProgressiveOverload(currentEx.name, exHistory, lastAttempt, libExForHint?.type, libExForHint?.equipment) : null;
        const warmupSets = getWarmupSets(currentEx.weight, libExForHint?.equipment);
        const isBarbellEquipment = libExForHint?.equipment === "Barbell" || libExForHint?.equipment === "EZ Bar";
        const plateInfo = isBarbellEquipment ? calculatePlates(currentEx.weight, equipmentFloorAndBaseline(libExForHint?.equipment).floor) : null;
        const rows = getRowsFor(exIdx);
        const updateRows = (newRows) => updateRowsFor(exIdx, newRows);
        const showRpeHint = rpeHintOpenFor === exIdx;
        const showWeightHint = weightHintOpenFor === exIdx;

        return (
          <div data-exercise-card={currentEx.name} key={exIdx}>
          <Card title="">
            <div style={{display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8}}>
              <div style={styles.liveExName}>{currentEx.name}</div>
              {!override && currentEx._adjusted && (
                <div style={{fontSize: 12, background: "var(--accent)", color: "#FFFFFF", padding: "6px 12px", borderRadius: 8, fontWeight: 600, whiteSpace: "nowrap", marginLeft: 12, letterSpacing: "0.03em"}}>
                  📈 AUTO-ADJUSTED
                </div>
              )}
            </div>
            <div style={{fontSize: 13, color: "var(--ink-dim)", marginBottom: 4}}>
              Target: {currentEx.sets}×{currentEx.reps} @ {currentEx.weight} lb
              {!override && currentEx._originalWeight && currentEx._originalWeight !== currentEx.weight && (
                <span style={{marginLeft: 10, color: "var(--accent)", fontFamily: "var(--font-mono)", fontWeight: 700, fontSize: 12}}>
                  ↑ {currentEx._originalWeight} → {currentEx.weight} lb
                </span>
              )}
              {!freeformMode && (
                <button
                  onClick={() => setWeightHintOpenFor(showWeightHint ? null : exIdx)}
                  style={{
                    marginLeft: 10, background: "none", border: "none", padding: 0, font: "inherit",
                    color: "var(--ink-dim)", cursor: "pointer", textDecoration: "underline dotted", textUnderlineOffset: 3,
                  }}
                >
                  why this weight?
                </button>
              )}
            </div>
            {showWeightHint && !freeformMode && (
              <div style={{ fontSize: 11, color: "var(--ink-dim)", lineHeight: 1.6, marginBottom: 10, background: "var(--surface-2)", padding: "10px 12px", borderRadius: 10 }}>
                {currentEx._recommendation
                  ? <>{currentEx._recommendation}</>
                  : <>No history yet for this exercise, so this is a baseline starting point — log a set and next time the app will suggest a weight based on how it went.</>}
                <div style={{ marginTop: 6 }}>
                  <strong>The rule:</strong> hit your target reps → weight goes up next time (+5 lb for big compound lifts, +2.5 lb for accessories). Miss by 1 rep → same weight again. Miss by 2+ → weight drops slightly so the next attempt is achievable.
                </div>
              </div>
            )}
            {warmupSets.length > 0 && (
              <div style={{ fontSize: 12, color: "var(--ink-dim)", marginBottom: 10, display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
                <span style={{ fontWeight: 600 }}>Warm up:</span>
                {warmupSets.map((s, i) => (
                  <span key={i} style={{ fontFamily: "var(--font-mono)" }}>
                    {s.weight}×{s.reps}{i < warmupSets.length - 1 ? "," : ""}
                  </span>
                ))}
              </div>
            )}
            {plateInfo && plateInfo.plates.length > 0 && (() => {
              const uniqueSizes = [...new Set(plateInfo.plates)].sort((a, b) => b - a);
              return (
                <div style={{ fontSize: 12, color: "var(--ink-dim)", marginBottom: 10, display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
                  <span style={{ fontWeight: 600 }}>🏋️ Per side:</span>
                  {uniqueSizes.map((size, i) => {
                    const count = plateInfo.plates.filter(p => p === size).length;
                    return (
                      <span key={size} style={{ fontFamily: "var(--font-mono)" }}>
                        {count}×{size}{i < uniqueSizes.length - 1 ? "," : ""}
                      </span>
                    );
                  })}
                  {plateInfo.remainder > 0 && (
                    <span style={{ color: "var(--energy)" }}>(+{plateInfo.remainder} lb not exactly loadable with standard plates)</span>
                  )}
                </div>
              );
            })()}
            <button style={styles.swapExerciseLink} onClick={() => { setPickerIntent("swap"); setSwapTargetIdx(exIdx); setSwapPickerOpen(true); }}>
              <RotateCcw size={12} /> {override ? "Swapped — change again" : "Swap exercise"}
            </button>
            {/* "Last time" is genuinely useful context before you've done anything yet this
                session — but once you've logged a real set today, the real-time coaching
                banners below (which reflect what you JUST did) are more current and more
                useful. Showing both together is confusing, stale-vs-fresh clutter — e.g. a
                static "last time you hit the target!" sitting right next to a fresh "crushed
                it, go up next set" for the same exercise. Suppress the static block once
                today's own data has taken over. */}
            {!rows.some(r => r.done) && lastAttempt && (
              <div style={{fontSize: 12, color: "var(--ink-dim)", margin: "12px 0 4px"}}>
                Last time: <span style={{fontFamily: "var(--font-mono)", fontWeight: 600, color: "var(--ink)"}}>{lastAttempt.weight}×{lastAttempt.reps}</span> @ RPE {lastAttempt.rpe} ({lastAttempt.date})
              </div>
            )}
            {!rows.some(r => r.done) && overload && overload.hitTarget && (
              <div style={{fontSize: 12, color: "var(--accent)", fontWeight: 600, marginBottom: 16}}>
                ✅ You hit the target last time — ready to progress!
              </div>
            )}
            {!rows.some(r => r.done) && overload && !overload.hitTarget && overload.status === "close_to_target" && (
              <div style={{fontSize: 12, color: "var(--accent)", marginBottom: 16}}>
                🟡 So close last time — try again for the full target.
              </div>
            )}
            {(!overload || (overload.hitTarget === undefined && overload.status !== "close_to_target")) && lastAttempt && !rows.some(r => r.done) && (
              <div style={{ marginBottom: 4 }} />
            )}
            {(!lastAttempt || rows.some(r => r.done)) && <div style={{ marginBottom: 12 }} />}

            {/* Strong-style set table: every prescribed set is its own editable, checkable row */}
            <div style={styles.setTable}>
              <div style={styles.setTableHeader}>
                <div style={{ width: 20 }}>SET</div>
                <div style={{ flex: 1 }}>PREVIOUS</div>
                <div style={{ width: 58, textAlign: "center" }}>LB</div>
                <div style={{ width: 50, textAlign: "center" }}>REPS<span style={{ color: "var(--accent)", fontWeight: 700 }}> ({currentEx.reps})</span></div>
                <button
                  onClick={() => setRpeHintOpenFor(showRpeHint ? null : exIdx)}
                  style={{
                    width: 36, textAlign: "center", background: "none", border: "none", padding: 0,
                    font: "inherit", color: "inherit", cursor: "pointer", textDecoration: "underline dotted",
                    textDecorationColor: "var(--ink-dim)", textUnderlineOffset: 3,
                  }}
                >
                  RPE
                </button>
                <div style={{ width: 32 }} />
              </div>
              {showRpeHint && (
                <div style={{ fontSize: 11, color: "var(--ink-dim)", padding: "0 4px 8px", lineHeight: 1.5 }}>
                  RPE = how hard the set felt, 1–10. <strong>Fill it in after each set</strong> — it's not a target.
                  10 = couldn't do another rep · 7–8 = a few reps left in the tank · 5 = easy.
                </div>
              )}
              {rows.map((row, i) => {
                const priorForThisRow = exHistory[exHistory.length - rows.length + i];
                const isPendingSuggestion = !row.done && !!row.suggestionNote;
                return (
                  <div key={i}>
                    {isPendingSuggestion && (
                      <div style={{
                        fontSize: 11, color: "var(--energy)", background: "var(--energy-dim)",
                        padding: "6px 10px", borderRadius: 8, marginBottom: 4, fontWeight: 700,
                      }}>
                        {row.suggestionNote}
                        {row.suggestionApplied && <span style={{ fontWeight: 500, opacity: 0.85 }}> — filled in below, ready to go.</span>}
                      </div>
                    )}
                    <div style={{
                      ...styles.setTableRow,
                      ...(row.isPR ? { background: "var(--energy-dim)" } : row.done ? styles.setTableRowDone : {}),
                      ...(isPendingSuggestion ? { background: "var(--energy-dim)", border: "1px solid var(--energy)" } : {}),
                      ...(row.done ? { animation: "rowFlash 0.6s ease-out" } : {}),
                    }}>
                      <div style={{ width: 20, fontWeight: 700, color: "var(--ink-dim)", fontSize: 13 }}>
                        {row.isPR ? "🏆" : i + 1}
                      </div>
                      <div style={{ flex: 1, fontSize: 11, color: "var(--ink-dim)", fontFamily: "var(--font-mono)", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                        {priorForThisRow ? `${priorForThisRow.weight}×${priorForThisRow.reps}` : "—"}
                      </div>
                      <input
                        type="number" inputMode="decimal"
                        disabled={row.done && !row.editing}
                        style={{ ...styles.setTableInput, width: 58 }}
                        value={row.weight}
                        placeholder={String(currentEx.weight || 0)}
                        onChange={(e) => updateRows(rows.map((r, idx) => idx === i ? { ...r, weight: e.target.value, weightManuallyEdited: true } : r))}
                      />
                      <input
                        type="number" inputMode="numeric"
                        disabled={row.done && !row.editing}
                        style={{ ...styles.setTableInput, width: 50 }}
                        value={row.reps}
                        placeholder={String(currentEx.reps)}
                        onChange={(e) => updateRows(rows.map((r, idx) => idx === i ? { ...r, reps: e.target.value } : r))}
                      />
                      <input
                        type="number" inputMode="numeric"
                        min="1" max="10"
                        disabled={row.done && !row.editing}
                        style={{ ...styles.setTableInput, width: 36 }}
                        value={row.rpe}
                        onChange={(e) => updateRows(rows.map((r, idx) => idx === i ? { ...r, rpe: e.target.value } : r))}
                        onBlur={(e) => {
                          const v = +e.target.value;
                          const clamped = e.target.value === "" || isNaN(v) ? "7" : String(Math.max(1, Math.min(10, v)));
                          updateRows(rows.map((r, idx) => idx === i ? { ...r, rpe: clamped } : r));
                        }}
                      />
                      {row.done && !row.editing ? (
                        <button
                          style={{ ...styles.setCheckBtn, ...styles.setCheckBtnDone }}
                          onClick={() => editSetRow(exIdx, i)}
                          title="Edit this set"
                        >
                          <Pencil size={12} />
                        </button>
                      ) : row.editing ? (
                        <button
                          style={{ ...styles.setCheckBtn, background: "var(--accent)", color: "#FFFFFF", border: "none" }}
                          onClick={() => saveEditedSet(exIdx, i)}
                          title="Save changes"
                        >
                          <Check size={14} strokeWidth={3} />
                        </button>
                      ) : (
                        <button
                          style={{ ...styles.setCheckBtn, ...(row.done ? styles.setCheckBtnDone : {}), ...(row.done ? { animation: "checkBounce 0.4s ease" } : {}) }}
                          onClick={() => completeRow(exIdx, i)}
                          disabled={row.done}
                          title={row.done ? "Set completed" : "Complete this set"}
                        >
                          <Check size={14} strokeWidth={3} />
                        </button>
                      )}
                    </div>
                    {row.done && (
                      <div style={{ display: "flex", gap: 12, marginTop: 3, marginBottom: 2 }}>
                        {row.editing ? (
                          <button
                            onClick={() => cancelEditSetRow(exIdx, i)}
                            style={{ background: "none", border: "none", padding: 0, fontSize: 11, color: "var(--ink-dim)", cursor: "pointer", fontWeight: 600 }}
                          >
                            Cancel
                          </button>
                        ) : (
                          <button
                            onClick={() => deleteLiveSet(exIdx, i)}
                            style={{ background: "none", border: "none", padding: 0, fontSize: 11, color: "var(--danger)", cursor: "pointer", fontWeight: 600 }}
                          >
                            Delete set
                          </button>
                        )}
                      </div>
                    )}
                    {row.done && row.lastSetCoachNote && (
                      <div style={{
                        fontSize: 11, color: "var(--energy)", background: "var(--energy-dim)",
                        padding: "6px 10px", borderRadius: 8, marginTop: 4, fontWeight: 700,
                      }}>
                        {row.lastSetCoachNote}
                      </div>
                    )}
                    {row.done && (
                      <div style={{ display: "flex", alignItems: "center", gap: 6, padding: "2px 4px 6px 32px" }}>
                        <button
                          onClick={() => updateRows(rows.map((r, idx) => idx === i ? { ...r, noteOpen: !r.noteOpen } : r))}
                          title="Add a note to this set"
                          style={{
                            background: "none", border: "none", padding: 0, cursor: "pointer",
                            fontSize: 11, color: row.note ? "var(--accent)" : "var(--ink-dim)", fontWeight: 600,
                            display: "flex", alignItems: "center", gap: 4,
                          }}
                        >
                          💬 {row.note ? "Edit note" : "Add note"}
                        </button>
                      </div>
                    )}
                    {row.done && (row.noteOpen || row.note) && (
                      <div style={{ padding: "0 4px 10px 32px" }}>
                        <input
                          type="text"
                          value={row.note}
                          placeholder="e.g. felt heavy, used straps…"
                          onChange={(e) => updateSetNote(exIdx, i, e.target.value)}
                          style={{
                            width: "100%", fontSize: 12, padding: "8px 10px", borderRadius: 8,
                            border: "1px solid var(--line)", background: "var(--surface)", color: "var(--ink)", fontFamily: "var(--font-body)",
                          }}
                        />
                      </div>
                    )}
                  </div>
                );
              })}
            </div>

            <button
              style={{ ...styles.secondaryBtn, marginTop: 12 }}
              onClick={() => {
                const lastRow = rows[rows.length - 1];
                const suggestedWeight = lastRow?.lastSetCoachWeight;
                updateRows([...rows, {
                  weight: String(suggestedWeight !== undefined ? suggestedWeight : (currentEx.weight || "")),
                  reps: "", rpe: "7", note: "", noteOpen: false, weightManuallyEdited: false, done: false,
                }]);
              }}
            >
              <Plus size={14} /> Add set
            </button>
          </Card>
          </div>
        );
      })}

      {/* Strong lets you finish whenever you want — but if there are real, unfinished sets
          with data actually typed into them, it's worth a beat to ask what you want to do
          with them, matching Strong's own "Finish Workout?" confirmation exactly. */}
      <button
        style={styles.primaryBtn}
        onClick={handleFinishTap}
      >
        <Check size={14} /> Finish workout
      </button>

      {finishConfirm && (
        <div style={styles.sheetOverlay} onClick={() => setFinishConfirm(false)}>
          <div style={styles.sheet} onClick={(e) => e.stopPropagation()}>
            <div style={styles.sheetHandle} />
            <div style={{ textAlign: "center", padding: "8px 0 4px" }}>
              <div style={{ fontSize: 32, marginBottom: 8 }}>🎉</div>
              <div style={{ fontFamily: "var(--font-display)", fontSize: 20, fontWeight: 700, marginBottom: 8 }}>Finish workout?</div>
              <div style={{ fontSize: 13, color: "var(--ink-dim)", lineHeight: 1.5, marginBottom: 20 }}>
                There are sets with weight and reps entered that haven't been checked off yet. Invalid or empty sets won't be logged either way.
              </div>
            </div>
            <button
              style={{ ...styles.primaryBtn, width: "100%", marginBottom: 8, background: "var(--fun-green)" }}
              onClick={finishUnfinishedSets}
            >
              Complete Unfinished Sets
            </button>
            <button
              style={{ ...styles.secondaryBtn, width: "100%", marginBottom: 8, color: "var(--danger)", borderColor: "var(--danger)" }}
              onClick={() => { setFinishConfirm(false); setSessionComplete(true); }}
            >
              Discard Unfinished Sets
            </button>
            <button style={{ ...styles.secondaryBtn, width: "100%" }} onClick={() => setFinishConfirm(false)}>
              Cancel
            </button>
          </div>
        </div>
      )}

      {freeformMode && (
        <button
          style={styles.secondaryBtn}
          onClick={() => { setPickerIntent("addMore"); setSwapTargetIdx(exercises.length); setSwapPickerOpen(true); }}
        >
          <Plus size={14} /> Add another exercise
        </button>
      )}

      {/* Third way out: abandon the session entirely. Without this, starting a workout by
          mistake — or simply bailing early — left "Finish workout" as the only exit, which
          logs a session you didn't actually do. Styled as a quiet text link rather than a
          full button so it never competes with the two primary actions. */}
      <button
        style={{
          background: "none", border: "none", cursor: "pointer",
          color: "var(--ink-dim)", fontSize: 13, fontFamily: "var(--font-body)",
          padding: "10px 0", width: "100%", textAlign: "center",
        }}
        onClick={() => setCancelConfirm(true)}
      >
        Cancel workout
      </button>

      {cancelConfirm && (
        <div style={styles.sheetOverlay} onClick={() => setCancelConfirm(false)}>
          <div style={styles.sheet} onClick={(e) => e.stopPropagation()}>
            <div style={styles.sheetHandle} />
            <div style={{ textAlign: "center", padding: "8px 0 4px" }}>
              <div style={{ fontFamily: "var(--font-display)", fontSize: 20, fontWeight: 700, marginBottom: 8 }}>Cancel workout?</div>
              <div style={{ fontSize: 13, color: "var(--ink-dim)", lineHeight: 1.5, marginBottom: 20 }}>
                {completedSets > 0
                  ? `This discards the whole session, including the ${completedSets} set${completedSets === 1 ? "" : "s"} you've already logged. Nothing from this workout will be saved. This can't be undone.`
                  : "This ends the session without logging anything. Nothing has been checked off yet, so there's nothing to lose."}
              </div>
            </div>
            <button
              style={{ ...styles.primaryBtn, width: "100%", marginBottom: 8, background: "var(--danger)" }}
              onClick={cancelWorkout}
            >
              Cancel workout
            </button>
            <button style={{ ...styles.secondaryBtn, width: "100%" }} onClick={() => setCancelConfirm(false)}>
              Keep going
            </button>
          </div>
        </div>
      )}

      {swapPickerOpen && (
        <ExercisePickerSheet
          title={pickerIntent === "addMore" ? "Add exercises" : `Swap "${exercises[swapTargetIdx]?.name}" for…`}
          allLibraryExercises={allLibraryExercises}
            strengthLog={data.strengthLog}
          highlightExId={pickerIntent === "swap" ? getEffectiveEx(swapTargetIdx)?.exId : null}
          swapGroup={pickerIntent === "swap" ? (getEffectiveEx(swapTargetIdx)?.group || findLibraryExercise(getEffectiveEx(swapTargetIdx)?.exId, data.customExercises)?.group) : null}
          excludeIds={exercises.map((ex, i) => getEffectiveEx(i)?.exId).filter((id, i) => id && !(pickerIntent === "swap" && i === swapTargetIdx))}
          multiSelect={pickerIntent === "addMore"}
          onCreateCustom={createCustomExercise}
          onPick={(ex) => swapExercise(ex)}
          onConfirmMulti={(exs) => addFreeformExercisesMultiple(exs)}
          onClose={() => setSwapPickerOpen(false)}
        />
      )}
    </div>
  );
}

const REST_TIMER_KEY = "restTimerState";

function RestTimer({ seconds = 120, autoStartSignal }) {
  const [targetDuration, setTargetDuration] = useState(seconds);
  const [running, setRunning] = useState(false);
  // The real wall-clock timestamp the timer should hit zero at — not a tick counter. This
  // is the actual fix for the timer stopping/drifting when the app is backgrounded.
  const [endTime, setEndTime] = useState(null);
  const [remaining, setRemaining] = useState(seconds); // display value only, always recomputed from endTime while running
  const [customInput, setCustomInput] = useState("");
  const [completed, setCompleted] = useState(false);
  const [settingsOpen, setSettingsOpen] = useState(false); // presets/custom tucked away by default — this is a compact utility strip, not a hero feature
  // Guards the completion chime so it fires exactly once per timer, no matter which of the
  // three paths gets there first (the scheduled alarm, an interval tick, or the catch-up
  // when you return to a timer that expired while backgrounded).
  const chimedForRef = useRef(null);
  const alarmRef = useRef(null);
  // Tracks which second last played a countdown tick, so each of the final 10 seconds
  // sounds exactly once even though the tick function can fire more often than 1Hz.
  const lastTickedSecondRef = useRef(null);

  // Resume a still-active timer on mount — covers the component itself remounting (e.g.
  // navigating to another tab and back), which a plain tick-counter would have no way to
  // recover from, since that state would just be gone.
  useEffect(() => {
    try {
      const raw = localStorage.getItem(REST_TIMER_KEY);
      if (raw) {
        const saved = JSON.parse(raw);
        if (saved.endTime && saved.endTime > Date.now()) {
          setEndTime(saved.endTime);
          setTargetDuration(saved.targetDuration || seconds);
          setRunning(true);
        } else {
          // The timer expired while the app was closed or fully suspended, so no tick and
          // no alarm ever fired — the rest is genuinely over and the moment was missed
          // silently. Chime on return rather than saying nothing at all: you still need to
          // know your rest ended, even if the notification is late.
          if (saved.endTime) {
            setCompleted(true);
            playRestChime(saved.endTime);
            setTimeout(() => setCompleted(false), 2000);
          }
          localStorage.removeItem(REST_TIMER_KEY);
        }
      }
    } catch (e) {}
    // Deliberately mount-only — this restores a persisted in-progress timer once, it
    // shouldn't re-fire on every prop change.
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  useEffect(() => { if (!running) { setRemaining(seconds); setTargetDuration(seconds); } }, [seconds]);

  // Strong/Hevy pattern: rest timer starts itself the moment a set is checked off,
  // instead of waiting for the person to remember to tap play.
  useEffect(() => {
    if (autoStartSignal === undefined || autoStartSignal === 0) return;
    const newEndTime = Date.now() + seconds * 1000;
    setEndTime(newEndTime);
    setTargetDuration(seconds);
    setCompleted(false);
    setRunning(true);
    try { localStorage.setItem(REST_TIMER_KEY, JSON.stringify({ endTime: newEndTime, targetDuration: seconds })); } catch (e) {}
  }, [autoStartSignal]);

  // The completion chime, extracted so every path that can detect expiry calls the SAME
  // code — and guarded by endTime so it fires exactly once per timer, never twice.
  function playRestChime(forEndTime) {
    if (forEndTime != null && chimedForRef.current === forEndTime) return; // already chimed for this timer
    chimedForRef.current = forEndTime;

    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    try {
      const ctx = getSharedAudioContext();
      if (!ctx) return;
      const t0 = ctx.currentTime;

      // Boxing-bell strike. A real bell isn't a pure tone — it's several inharmonic
      // partials struck at once that decay at different rates, which is what makes it read
      // as "metal being hit" rather than "electronic beep". Ratios here are inharmonic on
      // purpose; harmonic ones (2x, 3x) would sound like an organ instead.
      const strike = (startAt, gainScale) => {
        const partials = [
          { ratio: 1.0,  gain: 1.00, decay: 1.9 },  // fundamental — the body of the ring
          { ratio: 2.76, gain: 0.62, decay: 1.3 },  // inharmonic partials give the metallic
          { ratio: 5.40, gain: 0.38, decay: 0.8 },  // clang and the bright leading edge
          { ratio: 8.93, gain: 0.22, decay: 0.45 },
        ];
        partials.forEach(p => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          // Upper partials use triangle rather than sine: a pure sine has no
          // harmonic content of its own, which is why an all-sine bell sounds
          // soft and hollow. The brighter waveform up top supplies the edge
          // that makes it read as metal, and helps it cut through gym noise.
          osc.type = p.ratio > 4 ? "triangle" : "sine";
          osc.frequency.value = 620 * p.ratio;
          const peak = 0.55 * p.gain * gainScale;
          // Near-instant attack then a long exponential tail — that sharp onset is what
          // makes it sound struck rather than faded in.
          gain.gain.setValueAtTime(0.0001, startAt);
          gain.gain.exponentialRampToValueAtTime(peak, startAt + 0.004);
          gain.gain.exponentialRampToValueAtTime(0.0001, startAt + p.decay);
          osc.start(startAt);
          osc.stop(startAt + p.decay + 0.05);
        });

        // The strike transient: the actual hammer-on-metal "clang" that happens
        // in the first few milliseconds before the bell settles into ringing.
        // Without this the partials alone just swell politely; this is what
        // makes it sound HIT. Very short and very bright, dropping fast.
        toneVoice(ctx, { freq: 3200, type: "square", at: startAt, dur: 0.045, peak: 0.30 * gainScale, attack: 0.001 });
        toneVoice(ctx, { freq: 5400, type: "sawtooth", at: startAt, dur: 0.028, peak: 0.18 * gainScale, attack: 0.001 });
      };

      // Two strikes, like a round bell — the second slightly softer, as a real second hit
      // lands on an already-ringing bell.
      strike(t0, 1.0);
      strike(t0 + 0.42, 0.85);
    } catch (e) {}
  }

  // Short tick for the final countdown. Deliberately quiet and brief — this is a
  // background cue while you're setting up, not an alarm. Rises slightly on the last three
  // seconds so the approach to zero is audible without needing to look.
  function playCountdownTick(secondsLeft) {
    try {
      const ctx = getSharedAudioContext();
      if (!ctx) return;
      const t = ctx.currentTime;
      const finalThree = secondsLeft <= 3;
      // A percussive click rather than a soft blip: square wave with a
      // near-instant attack and a very short decay, so it lands like a
      // stopwatch tick you'd hear across a gym. The final three seconds jump
      // in pitch and volume so the approach to zero is unmistakable.
      const freq = finalThree ? 1400 : 1000;
      const peak = finalThree ? 0.30 : 0.18;
      toneVoice(ctx, { freq, type: "square", at: t, dur: finalThree ? 0.075 : 0.055, peak, attack: 0.001 });
      // A low body underneath keeps it from sounding tinny on phone speakers.
      toneVoice(ctx, { freq: freq / 2, type: "triangle", at: t, dur: 0.06, peak: peak * 0.5, attack: 0.002 });
    } catch (e) {}
  }

  // Keep a ref to the latest tick logic so both the interval AND the explicit
  // visibility/focus listeners below always call the CURRENT version — avoiding a stale
  // closure over old endTime/running values — while there's still only one place that
  // actually defines what "check the timer" means.
  const tickRef = useRef(null);
  tickRef.current = () => {
    if (!running || !endTime) return;
    const real = Math.max(0, Math.ceil((endTime - Date.now()) / 1000));
    setRemaining(real);

    // Audible countdown over the final 10 seconds. Guarded by the last-ticked value so a
    // second only ever sounds once — the tick function can run more often than once per
    // second (visibility/focus events also call it), which would otherwise stutter.
    if (real > 0 && real <= 10 && lastTickedSecondRef.current !== real) {
      lastTickedSecondRef.current = real;
      playCountdownTick(real);
    }
    if (real > 10) lastTickedSecondRef.current = null; // reset if time was added

    if (real <= 0) {
      const expired = endTime;
      setRunning(false);
      setCompleted(true);
      setEndTime(null);
      lastTickedSecondRef.current = null;
      try { localStorage.removeItem(REST_TIMER_KEY); } catch (e) {}
      playRestChime(expired);
      // Auto-clear completed state after 2 seconds
      setTimeout(() => setCompleted(false), 2000);
    }
  };

  // Main timer loop — the interval only triggers a re-render; the actual remaining time is
  // ALWAYS recomputed from the real clock (endTime - Date.now()), never by decrementing a
  // counter on each tick. This is the real fix: mobile browsers throttle or fully suspend
  // setInterval while the app is backgrounded (switching to Spotify, minimizing, the phone
  // locking), so a naive tick-based countdown effectively freezes and never catches back up
  // once you return. Recomputing from a fixed real timestamp means the displayed number is
  // always correct the instant this fires again or the app returns to the foreground — no
  // drift, no catch-up needed, matching how Strong's own timer actually behaves.
  useEffect(() => {
    if (!running || !endTime) return;
    tickRef.current();
    const interval = setInterval(() => tickRef.current(), 1000);

    // A SINGLE setTimeout aimed at the exact expiry moment, alongside the 1s interval.
    // This matters: browsers throttle repeating intervals aggressively when backgrounded
    // (often to once a minute, sometimes suspending them entirely), so relying on the
    // interval alone means the chime can be minutes late — or never fire at all if the
    // timer expires while you're in another app. A one-shot timer scheduled for the precise
    // moment is treated far more favourably, so the ding actually lands on time. Both paths
    // funnel through the same once-only guard, so this can't double-beep.
    const msLeft = endTime - Date.now();
    if (alarmRef.current) clearTimeout(alarmRef.current);
    alarmRef.current = setTimeout(() => tickRef.current(), Math.max(0, msLeft));

    return () => {
      clearInterval(interval);
      if (alarmRef.current) clearTimeout(alarmRef.current);
    };
  }, [running, endTime]);

  // Explicit correction the INSTANT the app becomes visible/focused again — switching back
  // from Spotify, unlocking the phone, returning to this browser tab — instead of waiting
  // for the next scheduled interval tick. The timestamp-based math above is already
  // correct whenever it runs, but some mobile browsers noticeably delay the first interval
  // tick after throttling ends, which can leave a stale number on screen for up to a second
  // or more even though nothing is actually wrong yet — this closes that visible gap.
  // Three separate signals because no single one is reliably fired by every mobile browser
  // in every backgrounding scenario: visibilitychange for tab/app switches, focus for
  // window-level regains some browsers use instead, pageshow for iOS Safari's back-forward
  // cache restoring a suspended page without a full reload.
  useEffect(() => {
    const handleVisible = () => {
      if (document.visibilityState === "visible") tickRef.current();
    };
    document.addEventListener("visibilitychange", handleVisible);
    window.addEventListener("focus", handleVisible);
    window.addEventListener("pageshow", handleVisible);
    return () => {
      document.removeEventListener("visibilitychange", handleVisible);
      window.removeEventListener("focus", handleVisible);
      window.removeEventListener("pageshow", handleVisible);
    };
  }, []);

  const mm = String(Math.floor(remaining / 60)).padStart(2, "0");
  const ss = String(remaining % 60).padStart(2, "0");
  const pct = Math.max(0, Math.min(1, remaining / targetDuration));
  // Final-10s warning state, used to colour the ring and pulse the digits.
  const isEndingSoon = running && remaining > 0 && remaining <= 10;

  // Shared look for the timer's text buttons, so "Skip"/"Reset"/"Time" sit level with the
  // icon buttons instead of looking like stray links.
  const timerTextBtnStyle = {
    ...styles.iconBtn, width: "auto", height: 30, minWidth: 40, minHeight: 30,
    flexShrink: 0, padding: "0 9px", fontFamily: "var(--font-body)",
    fontSize: 11, fontWeight: 700, letterSpacing: "0.02em",
  };

  const presets = [30, 60, 90, 120, 180];
  
  const setDuration = (secs) => {
    setRemaining(secs);
    setTargetDuration(secs);
    setRunning(false);
    setEndTime(null);
    setCompleted(false);
    try { localStorage.removeItem(REST_TIMER_KEY); } catch (e) {}
  };

  const handleCustomSet = () => {
    const val = parseInt(customInput);
    if (val && val > 0 && val <= 600) {
      setDuration(val);
      setCustomInput("");
    }
  };

  // Pausing freezes at the CURRENT real remaining value (recomputed fresh, not whatever
  // the last tick happened to display) and clears endTime so nothing keeps recomputing.
  // Resuming picks a fresh real endTime from wherever it was frozen.
  const togglePlayPause = () => {
    if (running) {
      const real = endTime ? Math.max(0, Math.ceil((endTime - Date.now()) / 1000)) : remaining;
      setRemaining(real);
      setRunning(false);
      setEndTime(null);
      try { localStorage.removeItem(REST_TIMER_KEY); } catch (e) {}
    } else {
      const newEndTime = Date.now() + remaining * 1000;
      setEndTime(newEndTime);
      setRunning(true);
      try { localStorage.setItem(REST_TIMER_KEY, JSON.stringify({ endTime: newEndTime, targetDuration })); } catch (e) {}
    }
  };

  // "+30s" is the single most-used control on a rest timer — the common case mid-rest is
  // "I need a bit longer," not "start over." Without it, the only way to extend was to open
  // settings and pick a new duration, which restarts the countdown and loses the time
  // already elapsed. Extends from the CURRENT remaining time (or from a fresh 30s if the
  // timer already hit zero), and works whether running or paused.
  const handleAddTime = (extraSeconds = 30) => {
    setCompleted(false);
    // Extending past zero means this is a new rest period — clear the chime guard so the
    // extended timer can chime again when it finishes.
    chimedForRef.current = null;
    if (running && endTime) {
      const newEnd = endTime + extraSeconds * 1000;
      setEndTime(newEnd);
      setTargetDuration(t => t + extraSeconds);
      try { localStorage.setItem(REST_TIMER_KEY, JSON.stringify({ endTime: newEnd, targetDuration: targetDuration + extraSeconds })); } catch (e) {}
    } else {
      // Paused or finished: bank the time and stay in that state, so tapping +30s on a
      // finished timer gives you a fresh 30s to start rather than silently doing nothing.
      const base = Math.max(0, remaining);
      setRemaining(base + extraSeconds);
      setTargetDuration(t => Math.max(t, base + extraSeconds));
    }
  };

  const handleSkip = () => {
    setRunning(false);
    setRemaining(0);
    setEndTime(null);
    setCompleted(false);
    try { localStorage.removeItem(REST_TIMER_KEY); } catch (e) {}
  };

  const handleReset = () => {
    setRunning(false);
    setRemaining(seconds);
    setEndTime(null);
    setCompleted(false);
    try { localStorage.removeItem(REST_TIMER_KEY); } catch (e) {}
  };

  return (
    <div style={{
      background: completed ? "var(--energy-dim)" : "var(--surface-2)", borderRadius: 10,
      padding: "8px 10px", display: "flex", flexDirection: "column", gap: settingsOpen ? 8 : 0,
    }}>
      {/* Compact default row — small ring, countdown, play/pause, and a toggle for the
          presets/custom panel below. This is a utility strip, not a hero feature. Capped at
          3 simultaneous buttons max (not 4) — Skip and Reset are now one contextual button,
          since you rarely need both while actually resting. A prior version showed all 4 at
          once while running, which overflowed the row entirely on a real narrow iPhone. */}
      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
        <div style={{ position: "relative", width: 26, height: 26, flexShrink: 0 }}>
          <svg width="26" height="26" viewBox="0 0 26 26">
            <circle cx="13" cy="13" r="10.5" fill="none" stroke="var(--line)" strokeWidth="2.5" />
            <circle
              cx="13" cy="13" r="10.5" fill="none" stroke={completed ? "var(--energy)" : isEndingSoon ? "var(--energy)" : "var(--accent)"} strokeWidth="2.5"
              strokeDasharray={2 * Math.PI * 10.5}
              strokeDashoffset={2 * Math.PI * 10.5 * (1 - pct)}
              strokeLinecap="round"
              transform="rotate(-90 13 13)"
              style={{ transition: "stroke-dashoffset 1s linear, stroke 0.2s" }}
            />
          </svg>
        </div>
        <div style={{
          fontFamily: "var(--font-mono)", fontSize: 14, fontWeight: 700,
          letterSpacing: "0.01em", flexShrink: 0,
          fontVariantNumeric: "tabular-nums",
          color: isEndingSoon ? "var(--energy)" : "var(--ink)",
          // Final-10s pulse: you're mid-set or catching your breath, not staring at the
          // phone. Motion in peripheral vision communicates "almost up" without reading.
          animation: isEndingSoon ? "prPulse 1s ease-in-out infinite" : "none",
        }}>
          {mm}:{ss}
        </div>
        {completed && <div style={{ fontSize: 10, color: "var(--energy)", fontWeight: 700, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>✓ Done</div>}
        <div style={{ flex: 1, minWidth: 4 }} />
        {/* +30s sits first among the controls because it's the most-reached-for button on a
            rest timer. Text rather than an icon since "+30s" is unambiguous and needs no
            learning; kept to the same 30px height so the row stays aligned. */}
        <button
          style={{
            ...styles.iconBtn, width: "auto", height: 30, minWidth: 40, minHeight: 30,
            flexShrink: 0, padding: "0 8px", fontFamily: "var(--font-mono)",
            fontSize: 11, fontWeight: 700, letterSpacing: "0.02em",
          }}
          onClick={() => handleAddTime(30)}
          title="Add 30 seconds"
        >
          +30s
        </button>
        {/* Play/pause keeps an icon — it's the one universally understood control here.
            Everything else gets a WORD. These were previously icon-only with meaning carried
            solely by the `title` attribute, which is a hover tooltip: on a phone there's no
            hover, so the labels were effectively invisible and the icons had to be guessed
            at. A chevron in particular reads as "next", not "skip the rest". */}
        <button
          style={{ ...styles.iconBtn, width: 30, height: 30, minWidth: 30, minHeight: 30, flexShrink: 0 }}
          onClick={togglePlayPause}
          title={running ? "Pause the rest timer" : "Start the rest timer"}
          aria-label={running ? "Pause the rest timer" : "Start the rest timer"}
        >
          {running ? <Pause size={13} /> : <Play size={13} />}
        </button>
        {running ? (
          <button
            style={{ ...timerTextBtnStyle }}
            onClick={handleSkip}
            title="End rest now and jump to your next set"
            aria-label="Skip rest"
          >
            Skip
          </button>
        ) : (
          <button
            style={{ ...timerTextBtnStyle }}
            onClick={handleReset}
            title="Reset the countdown back to the full rest duration"
            aria-label="Reset rest timer"
          >
            Reset
          </button>
        )}
        <button
          style={{ ...timerTextBtnStyle, background: settingsOpen ? "var(--accent)" : "var(--surface-2)", color: settingsOpen ? "#FFFFFF" : "var(--ink)" }}
          onClick={() => setSettingsOpen(v => !v)}
          title="Change how long rest lasts"
          aria-label="Change rest duration"
        >
          Time
        </button>
      </div>

      {settingsOpen && (
        <div>
          {/* Names what the panel actually changes. Without it, a row of bare numbers next
              to a running countdown is ambiguous — they could plausibly be elapsed times,
              presets, or something you're being asked to pick from mid-set. */}
          <div style={{
            fontSize: 10, fontWeight: 700, letterSpacing: "0.08em", textTransform: "uppercase",
            color: "var(--ink-dim)", marginBottom: 6,
          }}>
            Rest length
          </div>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
            {presets.map(p => (
              <button
                key={p}
                onClick={() => setDuration(p)}
                style={{
                  padding: "5px 10px", fontSize: 11, fontFamily: "var(--font-mono)", fontWeight: 600,
                  borderRadius: 8, cursor: "pointer",
                  background: remaining === p && !customInput ? "var(--accent)" : "var(--surface)",
                  color: remaining === p && !customInput ? "#FFFFFF" : "var(--ink)",
                  border: `1px solid ${remaining === p && !customInput ? "var(--accent)" : "var(--line)"}`,
                }}
              >
                {p}s
              </button>
            ))}
          </div>
          <div style={{ display: "flex", gap: 6, marginTop: 6 }}>
            <input
              type="number" inputMode="numeric"
              min="1"
              max="600"
              style={{ ...styles.input, flex: 1, padding: "6px 10px", fontSize: 16 }}
              value={customInput}
              onChange={(e) => setCustomInput(e.target.value)} onBlur={(e) => { const v = +e.target.value; if (e.target.value !== "" && !isNaN(v)) setCustomInput(String(Math.max(1, Math.min(600, v)))); }}
              placeholder="Custom (1-600s)"
              onKeyDown={(e) => { if(e.key === "Enter") handleCustomSet(); }}
            />
            <button
              style={{...styles.primaryBtn, marginTop: 0, padding: "6px 12px", fontSize: 12}}
              onClick={handleCustomSet}
              disabled={!customInput}
            >
              Set
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

function Programs({ data, setData }) {
  const [showNew, setShowNew] = useState(false);
  const activeProgram = data.programs.find(p => p.active);

  return (
    <div style={styles.stack}>
      {showNew ? (
        <NewProgramForm
          onCreate={(prog) => {
            const updated = {
              ...data,
              programs: [...data.programs.map(p => ({...p, active: false})), prog],
            };
            setData(updated);
            setShowNew(false);
          }}
          onCancel={() => setShowNew(false)}
        />
      ) : (
        <>
          {activeProgram ? (
            <Card title="Active program">
              <div style={styles.programDetail}>
                <div style={styles.progName}>{activeProgram.name}</div>
                <div style={styles.progMeta}>
                  {PHASES.find(p => p.id === activeProgram.phase)?.name} · {activeProgram.weeks} weeks
                </div>
                <div style={styles.progDesc}>
                  {PHASES.find(p => p.id === activeProgram.phase)?.description}
                </div>
                <div style={styles.btnRow}>
                  <button style={styles.primaryBtn} onClick={() => setShowNew(true)}>
                    <Plus size={14} /> New program
                  </button>
                  <button style={styles.ghostBtn} onClick={() => {
                    setData({
                      ...data,
                      programs: data.programs.map(p => p.id === activeProgram.id ? {...p, active: false} : p),
                    });
                  }}>
                    <X size={14} /> End program
                  </button>
                </div>
              </div>
            </Card>
          ) : (
            <Card title="No active program">
              <EmptyHint text="Start a structured training phase." />
              <button style={styles.primaryBtn} onClick={() => setShowNew(true)}>
                <Plus size={14} /> Create program
              </button>
            </Card>
          )}

          {data.programs.length > 1 && (
            <Card title="Past programs">
              <div style={styles.logList}>
                {data.programs.filter(p => !p.active).map((p) => (
                  <div key={p.id} style={{ ...styles.logRow, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                    <div>
                      <span style={styles.dim}>{fmtDate(p.startDate)}</span>{" "}
                      <span style={styles.mono}>{p.name}</span>
                    </div>
                    <button
                      style={{ ...styles.ghostBtn, padding: "6px 12px", fontSize: 11 }}
                      onClick={() => {
                        setData({
                          ...data,
                          programs: data.programs.map(prog => ({ ...prog, active: prog.id === p.id })),
                        });
                      }}
                    >
                      Reactivate
                    </button>
                  </div>
                ))}
              </div>
            </Card>
          )}
        </>
      )}
    </div>
  );
}

function WorkoutCustomizer({ phase, weeks, template, startDate, onConfirm, onCancel }) {
  const workouts = generateProgramWorkouts(phase, weeks, template, startDate);
  const [editingWorkoutIdx, setEditingWorkoutIdx] = useState(null);
  
  if (workouts.length === 0) {
    return (
      <Card title="Workout Plan">
        <div style={styles.dimSmall}>Error generating workouts. Check your template selection.</div>
        <button style={styles.ghostBtn} onClick={onCancel}><X size={14} /> Cancel</button>
      </Card>
    );
  }

  const groupedByWeek = {};
  workouts.forEach(w => {
    if (!groupedByWeek[w.week]) groupedByWeek[w.week] = [];
    groupedByWeek[w.week].push(w);
  });

  return (
    <Card title={`Workout Plan Preview (${workouts.length} workouts)`}>
      <div style={{ maxHeight: 400, overflowY: "auto", paddingRight: 8 }}>
        {Object.entries(groupedByWeek).map(([week, weekWorkouts]) => (
          <div key={week} style={{ marginBottom: 16, paddingBottom: 12, borderBottom: "1px solid var(--line)" }}>
            <div style={{ fontSize: 12, fontWeight: 600, color: "var(--accent)", marginBottom: 8 }}>
              Week {week}
            </div>
            {weekWorkouts.map((workout, idx) => (
              <div key={workout.id} style={{ 
                fontSize: 11, 
                padding: 8, 
                background: "var(--surface-2)", 
                borderRadius: 4, 
                marginBottom: 6,
                cursor: "pointer",
                border: editingWorkoutIdx === idx ? "1px solid var(--accent)" : "1px solid var(--line)"
              }} onClick={() => setEditingWorkoutIdx(editingWorkoutIdx === idx ? null : idx)}>
                <div style={{ color: "var(--ink)", marginBottom: 4 }}>
                  <strong>{workout.focus}</strong> — {workout.exercises.length} exercises
                </div>
                {editingWorkoutIdx === idx && (
                  <div style={{ fontSize: 10, color: "var(--ink-dim)", marginTop: 6 }}>
                    {workout.exercises.map(ex => (
                      <div key={ex.exId} style={{ marginBottom: 3 }}>
                        {ex.name}: {ex.sets}×{ex.reps} @ {ex.weight}lb
                      </div>
                    ))}
                  </div>
                )}
              </div>
            ))}
          </div>
        ))}
      </div>
      <div style={{ ...styles.dimSmall, marginTop: 12, fontSize: 10 }}>
        ℹ️ This is auto-generated based on your phase. Weights auto-adjust as you log sets, and you can swap any exercise for a substitute right in your workout if something's unavailable — but the plan itself (exercises, sets, reps) is fixed once created. Start a new program to change the structure.
      </div>
      <div style={styles.btnRow}>
        <button style={styles.primaryBtn} onClick={() => onConfirm(workouts)}>
          <Check size={14} /> Accept & Create Program
        </button>
        <button style={styles.ghostBtn} onClick={onCancel}>
          <X size={14} /> Cancel
        </button>
      </div>
    </Card>
  );
}

function NewProgramForm({ onCreate, onCancel }) {
  const [name, setName] = useState("");
  const [phase, setPhase] = useState("hypertrophy");
  const [weeks, setWeeks] = useState(8);
  const [template, setTemplate] = useState("full_body_3x");
  const [showCustomizer, setShowCustomizer] = useState(false);
  const [validationError, setValidationError] = useState(null);

  if (showCustomizer) {
    return (
      <WorkoutCustomizer
        phase={phase}
        weeks={weeks}
        template={template}
        startDate={todayStr()}
        onConfirm={(workouts) => {
          onCreate({
            id: Math.random().toString(36).slice(2),
            name,
            phase,
            weeks: Math.max(1, weeks),
            startDate: todayStr(),
            active: true,
            currentWeek: 1,
            workouts,
          });
        }}
        onCancel={() => setShowCustomizer(false)}
      />
    );
  }

  return (
    <Card title="New program">
      <div style={styles.formGrid}>
        <Field label="Program name">
          <input style={styles.input} value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g., Summer Bulk" />
        </Field>
        <Field label="Phase">
          <select style={styles.input} value={phase} onChange={(e) => setPhase(e.target.value)}>
            {PHASES.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
          </select>
        </Field>
        <Field label="Duration (weeks)">
          <input type="number" inputMode="numeric" min="1" max="52" style={styles.input} value={weeks} onChange={(e) => setWeeks(e.target.value)} onBlur={(e) => { const v = +e.target.value; setWeeks(e.target.value === "" || isNaN(v) ? 8 : Math.max(1, Math.min(52, v))); }} />
        </Field>
        <Field label="Training split">
          <select style={styles.input} value={template} onChange={(e) => setTemplate(e.target.value)}>
            {Object.entries(WORKOUT_TEMPLATES).map(([key, tmpl]) => (
              <option key={key} value={key}>{tmpl.name} ({tmpl.daysPerWeek}x/week)</option>
            ))}
          </select>
        </Field>
      </div>
      
      <div style={{ ...styles.dimSmall, marginBottom: 12, padding: 8, background: "var(--surface-2)", borderRadius: 4 }}>
        <strong>{PHASES.find(p => p.id === phase)?.name}</strong><br/>
        {PHASES.find(p => p.id === phase)?.description}
        <br/><br/>
        <strong>{WORKOUT_TEMPLATES[template]?.name}</strong><br/>
        {WORKOUT_TEMPLATES[template]?.description}
      </div>

      <div style={styles.btnRow}>
        <button style={styles.primaryBtn} onClick={() => {
          if (!name) { 
            setValidationError("Program name is required"); 
            return; 
          }
          if (!weeks || weeks < 1) { 
            setValidationError("Program must be at least 1 week"); 
            return; 
          }
          setValidationError(null);
          setShowCustomizer(true);
        }}>
          <ChevronRight size={14} /> Review workout plan
        </button>
        <button style={styles.ghostBtn} onClick={onCancel}>
          <X size={14} /> Cancel
        </button>
      </div>
      
      {validationError && (
        <div style={{marginTop: 16, padding: 12, background: "rgba(255, 59, 48, 0.1)", border: "1px solid rgba(255, 59, 48, 0.3)", borderRadius: 8, color: "#FF3B30", fontSize: 13}}>
          {validationError}
        </div>
      )}
    </Card>
  );
}
