}

function LiveWorkout({ data, setData, setTab }) {
  // Session persistence — replaces the old "reconcile by matching any same-day strengthLog
  // entry" approach, which was WRONG: it couldn't tell "the same session, resumed" apart
  // from "a genuinely new session that happens to share an exercise with an earlier one
  // today." That produced exactly the bug you reported — a fresh freeform workout showing
  // an old session's checked-off set. This instead persists the actual session state (which
  // rows are done, not just "was this exercise touched today") and only restores it when
  // you're truly continuing, never when starting something new.
  const SESSION_KEY = "liveWorkoutSession";
  const activeProgramForResume = data.programs.find(p => p.active); // computed early, before any hook needs to validate resumability
  function loadPersistedSession() {
    try {
      const raw = localStorage.getItem(SESSION_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (!parsed || parsed.date !== todayStr()) return null; // never resurrect a stale session from a previous day
      // A program-based session (freeformMode false) has nowhere to resume into if that
      // program was ended or deleted while you were away — the exercise list itself comes
      // from the live program, not from anything persisted. Resuming would just strand you
      // on the "no active program" screen with a Resume button that does nothing. Treat it
      // as unresumable and clean up the stale entry rather than offer a dead end.
      if (!parsed.freeformMode && !activeProgramForResume) {
        try { localStorage.removeItem(SESSION_KEY); } catch (e2) {}
        return null;
      }
      return parsed;
    } catch (e) { return null; }
  }
  const persisted = loadPersistedSession();

  const [sessionStarted, setSessionStarted] = useState(false);
  const [sessionComplete, setSessionComplete] = useState(false);
  const [sessionStartTime, setSessionStartTime] = useState(persisted?.sessionStartTime || null);
  const [elapsedSeconds, setElapsedSeconds] = useState(0);
  const [swapTargetIdx, setSwapTargetIdx] = useState(0); // which exercise card the swap/add-exercise picker is acting on
  const [rpeHintOpenFor, setRpeHintOpenFor] = useState(null); // exIdx of the one card whose RPE hint is expanded, or null
  const [weightHintOpenFor, setWeightHintOpenFor] = useState(null); // same idea for "why this weight?"
  const [sessionImproveCount, setSessionImproveCount] = useState(persisted?.sessionImproveCount || 0);
  const [sessionPRCount, setSessionPRCount] = useState(persisted?.sessionPRCount || 0);
  const [sessionVolume, setSessionVolume] = useState(persisted?.sessionVolume || 0); // running total: sum of weight×reps across every completed set
  const [prBanner, setPrBanner] = useState(null); // { exerciseName, weight } when an all-time PR just landed
  const [milestoneBanner, setMilestoneBanner] = useState(null); // { title, detail, icon } when a one-time achievement badge is earned
  const [restTimerSignal, setRestTimerSignal] = useState(0);
  // Swap-exercise support (Strong-style): substitute an exercise mid-session without
  // touching the underlying program template. Must be declared here (top of component,
  // before any early return) so hook order stays stable across every render path.
  const [swapPickerOpen, setSwapPickerOpen] = useState(false);
  const [exerciseOverrides, setExerciseOverrides] = useState(persisted?.exerciseOverrides || {});
  // Strong's actual entry point: "Start Workout" lets you pick exercises freely, with or
  // without a template. freeformMode mirrors that — building a session from scratch instead
  // of only following a scheduled program day.
  const [freeformMode, setFreeformMode] = useState(persisted?.freeformMode || false);
  const [freeformExercises, setFreeformExercises] = useState(persisted?.freeformExercises || []);
  const [activeRoutineName, setActiveRoutineName] = useState(persisted?.activeRoutineName || null); // set when this session started FROM a saved routine
  const [saveRoutineName, setSaveRoutineName] = useState(""); // name being typed on the "save as routine" prompt
  const [routineSaved, setRoutineSaved] = useState(false);
  const [finishConfirm, setFinishConfirm] = useState(false); // shown when "Finish workout" is tapped with real, unfinished sets still pending
  const [pickerIntent, setPickerIntent] = useState("swap"); // 'swap' | 'addFirst' | 'addMore'
  // Strong-style set table: rows[exIdx] = [{ weight, reps, rpe, done }, ...] one row per set
  const [setRows, setSetRows] = useState(persisted?.setRows || {});
  // Flat list for the exercise-swap picker — static data, safe to compute before any early return.
  const allLibraryExercises = useMemo(
    () => [
      ...Object.entries(EXERCISE_LIBRARY).flatMap(([catId, cat]) => cat.exercises.map(ex => ({ ...ex, category: cat.label }))),
      ...(data.customExercises || []).map(ex => ({ ...ex, category: "Custom", sets: ex.sets || 3, reps: ex.reps || 8, restSec: ex.restSec || 90 })),
    ],
    [data.customExercises]
  );
  const activeProgram = activeProgramForResume; // same lookup, computed once above before it was needed for resume validation

  // Track elapsed time
  useEffect(() => {
    if (!sessionStarted || !sessionStartTime) return;
    const interval = setInterval(() => {
      const now = Date.now();
      setElapsedSeconds(Math.floor((now - sessionStartTime) / 1000));
    }, 1000);
    return () => clearInterval(interval);
  }, [sessionStarted, sessionStartTime]);

  // Persist the live session so navigating away and back genuinely resumes it — which
  // exercises, which sets are checked, everything — instead of guessing resumption from
  // same-day strengthLog entries (the source of the cross-session bug above). Only writes
  // while a session is truly in progress; a finished or never-started session writes nothing.
  useEffect(() => {
    if (!sessionStarted || sessionComplete) return;
    try {
      localStorage.setItem(SESSION_KEY, JSON.stringify({
        date: todayStr(),
        sessionStartTime,
        sessionImproveCount,
        sessionPRCount,
        sessionVolume,
        exerciseOverrides,
        freeformMode,
        freeformExercises,
        activeRoutineName,
        setRows,
      }));
    } catch (e) {}
  }, [sessionStarted, sessionComplete, sessionStartTime, sessionImproveCount, sessionPRCount, sessionVolume, exerciseOverrides, freeformMode, freeformExercises, activeRoutineName, setRows]);

  function fmtDuration(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = seconds % 60;
    if (mins === 0) return `${secs}s`;
    return `${mins}m ${secs}s`;
  }

  // Every other field needed to resume was already restored via the lazy useState
  // initializers above (sessionStartTime, freeformMode, freeformExercises, setRows, etc.) —
  // flipping this alone reveals the already-correctly-populated live session.
  function resumeSession() {
    setSessionStarted(true);
  }

  const ResumeBanner = persisted ? (
    <button
      onClick={resumeSession}
      style={{
        display: "flex", alignItems: "center", justifyContent: "center", gap: 8, width: "100%",
        padding: "14px", borderRadius: 10, border: "none", background: "var(--accent)", color: "#FFFFFF",
        fontSize: 14, fontWeight: 700, cursor: "pointer", marginBottom: 12,
      }}
    >
      <Play size={14} /> Resume workout in progress
    </button>
  ) : null;
  
  if (!activeProgram && !freeformMode) {
    return (
      <div style={styles.stack}>
        <Card title="Live workout">
          {ResumeBanner}
          <div style={{ textAlign: "center", padding: "20px 0" }}>
            <div style={{ fontSize: 40, marginBottom: 12 }}>🏋️</div>
            <div style={{ fontWeight: 700, fontSize: 16, marginBottom: 6 }}>No active program</div>
            <div style={styles.dimSmall}>Create a program to unlock today's workout, auto-adjusted weights, and progress tracking.</div>
            <button style={{ ...styles.primaryBtn, marginTop: 20 }} onClick={() => setTab && setTab("programs")}>
              <Zap size={14} /> Create a program
            </button>
            <button
              style={{ ...styles.secondaryBtn, marginTop: 10 }}
              onClick={() => { setPickerIntent("addFirst"); setSwapPickerOpen(true); }}
            >
              <Plus size={14} /> Or start an empty workout
            </button>
            <RoutinesQuickList routines={data.routines} onStart={startFromRoutine} onDelete={deleteRoutine} onUpdate={updateRoutine} />
          </div>
        </Card>
        {swapPickerOpen && (
          <ExercisePickerSheet
            title="Add exercises"
            allLibraryExercises={allLibraryExercises}
            currentExId={null}
            multiSelect
            onCreateCustom={createCustomExercise}
            onConfirmMulti={(exs) => startFreeformWithMultiple(exs)}
            onClose={() => setSwapPickerOpen(false)}
          />
        )}
      </div>
    );
  }

  if (!freeformMode && activeProgram && (!activeProgram.workouts || activeProgram.workouts.length === 0)) {
    return (
      <div style={styles.stack}>
        <Card title="Live workout">
          {ResumeBanner}
          <div style={{ textAlign: "center", padding: "20px 0" }}>
            <div style={styles.dimSmall}>Program "{activeProgram.name}" has no workouts generated. Try creating a new program.</div>
            <button style={{ ...styles.primaryBtn, marginTop: 20 }} onClick={() => setTab && setTab("programs")}>
              <Zap size={14} /> Go to Programs
            </button>
            <button
              style={{ ...styles.secondaryBtn, marginTop: 10 }}
              onClick={() => { setPickerIntent("addFirst"); setSwapPickerOpen(true); }}
            >
              <Plus size={14} /> Or start an empty workout
            </button>
            <RoutinesQuickList routines={data.routines} onStart={startFromRoutine} onDelete={deleteRoutine} onUpdate={updateRoutine} />
          </div>
        </Card>
        {swapPickerOpen && (
          <ExercisePickerSheet
            title="Add exercises"
            allLibraryExercises={allLibraryExercises}
            currentExId={null}
            multiSelect
            onCreateCustom={createCustomExercise}
            onConfirmMulti={(exs) => startFreeformWithMultiple(exs)}
            onClose={() => setSwapPickerOpen(false)}
          />
        )}
      </div>
    );
  }

  const todayPlan = (!freeformMode && activeProgram && activeProgram.workouts) ? activeProgram.workouts.find(w => w.date === todayStr()) : null;
  const adjustedPlan = todayPlan ? adjustWorkoutForPerformance(todayPlan, data.strengthLog, data.customExercises) : null;
  const exercises = freeformMode ? freeformExercises : (adjustedPlan?.exercises || []);

  function startFreeformWith(libEx) {
    setFreeformMode(true);
    setActiveRoutineName(null);
    setFreeformExercises([{ exId: libEx.id, name: libEx.name, sets: 1, reps: 8, weight: 0, group: libEx.group }]);
    setSetRows({});
    setSessionStarted(true);
    setSessionStartTime(Date.now());
    setElapsedSeconds(0);
    setSessionImproveCount(0);
    setSessionPRCount(0);
    setSessionVolume(0);
    setSwapPickerOpen(false);
  }

  // Multi-select version — pick several exercises at once to prepare the whole workout
  // upfront, instead of one at a time. Matches how Strong's own "Add Exercises" flow works.
  function startFreeformWithMultiple(libExArray) {
    setFreeformMode(true);
    setActiveRoutineName(null);
    setFreeformExercises(libExArray.map(libEx => ({ exId: libEx.id, name: libEx.name, sets: 1, reps: 8, weight: 0, group: libEx.group })));
    setSetRows({});
    setSessionStarted(true);
    setSessionStartTime(Date.now());
    setElapsedSeconds(0);
    setSessionImproveCount(0);
    setSessionPRCount(0);
    setSessionVolume(0);
    setSwapPickerOpen(false);
  }

  // Starting from a saved routine is one tap, same as Strong: pick the routine, you're
  // straight into logging with the exercises already loaded — no rebuilding it every time.
  function startFromRoutine(routine) {
    setFreeformMode(true);
    setActiveRoutineName(routine.name);
    setFreeformExercises(routine.exercises.map(ex => ({ ...ex })));
    setSetRows({});
    setSessionStarted(true);
    setSessionStartTime(Date.now());
    setElapsedSeconds(0);
    setSessionImproveCount(0);
    setSessionPRCount(0);
    setSessionVolume(0);
    setSwapPickerOpen(false);
  }

  function deleteRoutine(routineId) {
    setData({ ...data, routines: (data.routines || []).filter(r => r.id !== routineId) });
  }

  // Custom exercises stick around forever once created — they're stored in data.customExercises
  // and merged into allLibraryExercises, so they show up everywhere the built-in library does:
  // this picker, swap, routines, the Strength tab, everything. Uses the functional update form
  // since creating one is immediately followed by picking/swapping it in — another setData
  // call in the very same handler that would otherwise race against this one.
  function createCustomExercise(newEx) {
    setData(prev => ({ ...prev, customExercises: [...(prev.customExercises || []), newEx] }));
  }

  function updateRoutine(routineId, updates) {
    setData({
      ...data,
      routines: (data.routines || []).map(r => r.id === routineId ? { ...r, ...updates } : r),
    });
  }

  function saveCurrentAsRoutine() {
    if (!saveRoutineName.trim()) return;
    const newRoutine = {
      id: Math.random().toString(36).slice(2),
      name: saveRoutineName.trim(),
      exercises: exercises.map(ex => ({
        exId: ex.exId, name: ex.name, sets: ex.sets, reps: ex.reps, weight: ex.weight, group: ex.group,
      })),
      createdAt: todayStr(),
    };
    setData({ ...data, routines: [...(data.routines || []), newRoutine] });
    setRoutineSaved(true);
  }

  function addFreeformExercisesMultiple(libExArray) {
    const newList = [...freeformExercises, ...libExArray.map(libEx => ({ exId: libEx.id, name: libEx.name, sets: 1, reps: 8, weight: 0, group: libEx.group }))];
    setFreeformExercises(newList);
    setSwapPickerOpen(false);
  }

  if (!freeformMode && !todayPlan) {
    const lastWorkout = activeProgram && activeProgram.workouts ? [...activeProgram.workouts].reverse().find(w => w.date < todayStr()) : null;
    const nextWorkout = activeProgram && activeProgram.workouts ? activeProgram.workouts.find(w => w.date > todayStr()) : null;
    return (
      <div style={styles.stack}>

          <button
            style={{ ...styles.primaryBtn, marginTop: 16 }}
            onClick={() => { setPickerIntent("addFirst"); setSwapPickerOpen(true); }}
          >
            <Plus size={14} /> Start an empty workout
          </button>
          <RoutinesQuickList routines={data.routines} onStart={startFromRoutine} onDelete={deleteRoutine} onUpdate={updateRoutine} />
        </Card>
        {swapPickerOpen && (
          <ExercisePickerSheet
            title="Add exercises"
            allLibraryExercises={allLibraryExercises}
            currentExId={null}
            multiSelect
            onCreateCustom={createCustomExercise}
            onConfirmMulti={(exs) => startFreeformWithMultiple(exs)}
            onClose={() => setSwapPickerOpen(false)}
          />
        )}
      </div>
    );
  }

  if (sessionComplete) {
    const totalSets = exercises.reduce((sum, ex) => sum + ex.sets, 0);
    const durationMin = Math.floor(elapsedSeconds / 60);
    const durationSec = elapsedSeconds % 60;

    // Total lifetime workout count — distinct training days across strength, cardio, and
    // recovery logs, counting today (which just got logged) too. A small, genuinely
    // motivating touch: "that's your 57th workout!" lands very differently than a stat
    // grid with no sense of the bigger picture you're building.
    const lifetimeWorkoutCount = getTrainingDateSet(data).size;
    
    return (
      <div style={styles.stack}>
        <Card title="">
          <div style={{textAlign: "center", paddingTop: 12, paddingBottom: 12}}>
            <div style={{fontSize: 56, marginBottom: 12}}>{sessionPRCount > 0 ? "🏆" : "🔥"}</div>

              {sessionPRCount > 0
                ? `Awesome work! ${sessionPRCount} all-time PR${sessionPRCount !== 1 ? 's' : ''} today.`

            <div style={{display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 20}}>
              <div style={{background: "var(--accent-dim)", padding: 12, borderRadius: 10}}>
                <div style={{fontSize: 11, color: "var(--ink-dim)", marginBottom: 4}}>DURATION</div>
                <div style={{fontSize: 21, fontWeight: 700, color: "var(--accent)"}}>
                  {durationMin}m {durationSec}s
                </div>
              </div>
              <div style={{background: "var(--accent-dim)", padding: 12, borderRadius: 10}}>
                <div style={{fontSize: 11, color: "var(--ink-dim)", marginBottom: 4}}>TOTAL VOLUME</div>
                <div style={{fontSize: 21, fontWeight: 700, color: "var(--accent)"}}>{sessionVolume.toLocaleString()}<span style={{fontSize: 13}}> lb</span></div>
              </div>
              <div style={{background: "var(--accent-dim)", padding: 12, borderRadius: 10}}>
                <div style={{fontSize: 11, color: "var(--ink-dim)", marginBottom: 4}}>SETS</div>
                <div style={{fontSize: 21, fontWeight: 700, color: "var(--accent)"}}>{totalSets}</div>
              </div>
              <div style={{background: "var(--accent-dim)", padding: 12, borderRadius: 10}}>
                <div style={{fontSize: 11, color: "var(--ink-dim)", marginBottom: 4}}>EXERCISES</div>
                <div style={{fontSize: 21, fontWeight: 700, color: "var(--accent)"}}>{exercises.length}</div>
              </div>
              <div style={{background: "var(--accent-dim)", padding: 12, borderRadius: 10}}>
                <div style={{fontSize: 11, color: "var(--ink-dim)", marginBottom: 4}}>IMPROVED</div>
                <div style={{fontSize: 21, fontWeight: 700, color: "var(--accent)"}}>{sessionImproveCount}</div>
              </div>
              {sessionPRCount > 0 && (
                <div style={{background: "var(--energy-dim)", padding: 12, borderRadius: 10}}>
                  <div style={{fontSize: 11, color: "var(--ink-dim)", marginBottom: 4}}>PRs 🏆</div>
                  <div style={{fontSize: 21, fontWeight: 700, color: "var(--energy)"}}>{sessionPRCount}</div>
                </div>
              )}
            </div>

            {freeformMode && !activeRoutineName && exercises.length >= 2 && (
              routineSaved ? (
                <div style={{ fontSize: 13, color: "var(--accent)", fontWeight: 600, marginBottom: 16 }}>
                  ✅ Saved as "{saveRoutineName}" — find it next time you start a workout.
                </div>
              ) : (
                <div style={{ background: "var(--surface-2)", borderRadius: 10, padding: 14, marginBottom: 16, textAlign: "left" }}>
                  <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 8 }}>💾 Save this as a routine?</div>
                  <div style={{ fontSize: 12, color: "var(--ink-dim)", marginBottom: 10 }}>
                    You put together {exercises.length} exercises — save it with a name and start it in one tap next time, instead of rebuilding it from scratch.
                  </div>
                  <div style={{ display: "flex", gap: 8 }}>
                    <input
                      type="text"
                      value={saveRoutineName}
                      onChange={(e) => setSaveRoutineName(e.target.value)}
                      placeholder="e.g. Push Day"
                      style={{ ...styles.input, flex: 1 }}
                    />
                    <button style={{ ...styles.primaryBtn, marginTop: 0 }} onClick={saveCurrentAsRoutine}>
                      Save
                    </button>
                  </div>
                </div>
              )
            )}

            <button 
              style={styles.primaryBtn}
              onClick={() => {
                setSessionStarted(false);
                setSessionComplete(false);
                setFreeformMode(false);
                setFreeformExercises([]);
                setActiveRoutineName(null);
                setSaveRoutineName("");
                setRoutineSaved(false);
                try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
              }}
            >
              Done
            </button>
          </div>
        </Card>
      </div>
    );
  }

  if (!sessionStarted) {
    const planFocusLabel = exercises.length > 0 ? (todayPlan?.focus || "Workout") : "Rest day";
    return (
      <div style={styles.stack}>
        <Card title="">
          {ResumeBanner}
          <div style={{display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 16}}>
            <div>
              <div style={{fontSize: 12, color: "var(--ink-dim)", fontWeight: 600, letterSpacing: "0.02em", marginBottom: 4}}>TODAY'S WORKOUT</div>
              <div style={{fontSize: 18, fontWeight: 700}}>{planFocusLabel}</div>
            </div>
            <div style={{textAlign: "right"}}>
              {todayPlan && <div style={{fontSize: 12, color: "var(--ink-dim)", fontWeight: 600, marginBottom: 4}}>WEEK {todayPlan.week}</div>}
              <div style={{fontSize: 13, fontFamily: "var(--font-mono)", fontWeight: 500}}>{new Date().toLocaleDateString('en-US', {weekday: 'short', month: 'short', day: 'numeric'})}</div>
            </div>
          </div>

          {exercises.length > 0 && (
            <>
              {exercises.some(ex => ex._adjusted) && (
                <div style={{
                  background: "var(--accent-dim)", borderRadius: 10, padding: "10px 14px",
                  marginBottom: 12, fontSize: 12, color: "var(--ink)",
                }}>
                  📈 Some weights below are auto-adjusted from last time — you'll see exactly why once you start.
                </div>
              )}
              {todayPlan && todayPlan.week % 4 === 0 && (
                <div style={{
                  background: "var(--energy-dim)", borderRadius: 10, padding: "10px 14px",
                  marginBottom: 12, fontSize: 12, color: "var(--ink)",
                }}>
                  🔄 Deload week — lighter volume this week so you come back stronger.
                </div>
              )}

              {/* Clean, scannable preview — just what you're doing today. The full coaching
                  detail (last time, RPE, hit-target, recommendations) lives in the live
                  session itself once you actually start, not crammed into this glance. */}
              <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 4 }}>
                {exercises.map((ex, i) => (
                  <div key={i} style={{
                    display: "flex", justifyContent: "space-between", alignItems: "center",
                    background: "var(--surface-2)", borderRadius: 10, padding: "12px 14px",
                  }}>
                    <div style={{ fontSize: 14, fontWeight: 600 }}>{ex.name}</div>
                    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      <div style={{ fontSize: 12, fontFamily: "var(--font-mono)", color: "var(--ink-dim)" }}>
                        {ex.sets}×{ex.reps} @ {ex.weight} lb
                      </div>
                      {ex._adjusted && (
                        <div style={{ width: 6, height: 6, borderRadius: "50%", background: "var(--accent)" }} title="Weight auto-adjusted" />
                      )}
                    </div>
                  </div>
                ))}
              </div>
            </>
          )}
        </Card>

        {exercises.length > 0 && (
          <button style={styles.primaryBtn} onClick={() => {
            // Motivating "let's go" sound effect
            try {
              const ctx = new (window.AudioContext || window.webkitAudioContext)();
              // Quick upward sweep for motivation
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.type = 'sine';
              gain.gain.setValueAtTime(0.6, ctx.currentTime);
              gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
              osc.frequency.setValueAtTime(600, ctx.currentTime);
              osc.frequency.exponentialRampToValueAtTime(1000, ctx.currentTime + 0.3); // Rising pitch
              osc.start(ctx.currentTime);
              osc.stop(ctx.currentTime + 0.3);
            } catch (e) {}
            
            setSessionStarted(true);
            setSessionStartTime(Date.now());
            setElapsedSeconds(0);
            setSessionImproveCount(0);
            setSessionPRCount(0);
            setSessionVolume(0);
            setSetRows({});
          }}>
            <Play size={14} /> Start today's workout
          </button>
        )}
        <button
          style={styles.secondaryBtn}
          onClick={() => { setPickerIntent("addFirst"); setSwapPickerOpen(true); }}
        >
          <Plus size={14} /> Or start an empty workout
        </button>
        <RoutinesQuickList routines={data.routines} onStart={startFromRoutine} onDelete={deleteRoutine} onUpdate={updateRoutine} />
        {swapPickerOpen && (
          <ExercisePickerSheet
            title="Add exercises"
            allLibraryExercises={allLibraryExercises}
            currentExId={null}
            multiSelect
            onCreateCustom={createCustomExercise}
            onConfirmMulti={(exs) => startFreeformWithMultiple(exs)}
            onClose={() => setSwapPickerOpen(false)}
          />
        )}
      </div>
    );
  }

  // Swap-exercise support: substitute an exercise mid-session without touching the program template.
  function swapExercise(libEx) {
    setExerciseOverrides({ ...exerciseOverrides, [swapTargetIdx]: { name: libEx.name, exId: libEx.id } });
    // Register the swapped-in exercise so History/Progression can resolve its real name later
    // instead of falling back to the raw library id (e.g. "weighted_dip"). Functional update —
    // this can fire in the same handler right after creating a brand-new custom exercise,
    // which also calls setData; without the functional form this would silently overwrite it.
    if (!data.exercises.find(e => e.id === libEx.id)) {
      setData(prev => prev.exercises.find(e => e.id === libEx.id) ? prev : { ...prev, exercises: [...prev.exercises, { id: libEx.id, name: libEx.name, group: libEx.group }] });
    }
    // Fresh row table for the new exercise — old weight/reps don't carry over meaningfully
    const newRows = { ...setRows };
    delete newRows[swapTargetIdx];
    setSetRows(newRows);
    setSwapPickerOpen(false);
  }

  // Everything below used to derive a single "current" exercise's data from closures over
  // currentExIdx. Strong shows every exercise in the workout at once, each independently
  // completable — so these are now small helpers parameterized by exIdx instead, called once
  // per exercise inside the render loop below.
  function getEffectiveEx(exIdx) {
    const raw = exercises[exIdx];
    const override = exerciseOverrides[exIdx];
    return override ? { ...raw, name: override.name, exId: override.exId } : raw;
  }
  function getRowsFor(exIdx) {
    const ex = getEffectiveEx(exIdx);
    const override = exerciseOverrides[exIdx];
    if (setRows[exIdx]) return setRows[exIdx];

    // Plain fresh defaults. Genuine resumption is handled at the SESSION level now (see
    // the persisted-session restoration above and the "Resume workout in progress" button)
    // — not by guessing, per row, whether any same-day strengthLog entry might belong to
    // THIS session. That guess was the actual bug: it couldn't tell "the same session,
    // continued" apart from "a new session that happens to share an exercise with an
    // earlier, unrelated one today," so a fresh workout could inherit an old session's
    // already-checked sets. A genuinely resumed session already has its real setRows
    // restored before this function is ever called, so it never needs to reach this path.
    return Array.from({ length: ex.sets }, () => ({
      weight: String(override ? "" : (ex.weight || "")),
      reps: "",
      rpe: "7",
      note: "",
      noteOpen: false,
      weightManuallyEdited: false,
      done: false,
    }));
  }
  function updateRowsFor(exIdx, newRows) {
    setSetRows({ ...setRows, [exIdx]: newRows });
  }

  // Calculate total sets across all exercises + how many are actually logged/done.
  // Uses getRowsFor (not raw setRows) so this count is consistent with what the table
  // actually renders — including sets reconciled from strengthLog after resuming a
  // workout mid-session, before the user has interacted with that exercise again.
  const totalSets = exercises.reduce((sum, ex) => sum + ex.sets, 0);
  let completedSets = 0;
  exercises.forEach((ex, i) => {
    completedSets += getRowsFor(i).filter(row => row.done).length;
  });

  function playCompleteSound(improved, isPR) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (isPR) {
        // A real PR gets a bigger three-note fanfare — deliberately distinct from the routine
        // two-tone "improved" sound, so it actually feels like a different kind of moment.
        [600, 800, 1000].forEach((freq, i) => {
          const osc = ctx.createOscillator(); const gain = ctx.createGain();
          osc.connect(gain); gain.connect(ctx.destination);
          osc.type = "triangle";
          osc.frequency.value = freq;
          const start = ctx.currentTime + i * 0.12;
          gain.gain.setValueAtTime(0.55, start);
          gain.gain.exponentialRampToValueAtTime(0.01, start + 0.22);
          osc.start(start); osc.stop(start + 0.22);
        });
      } else if (improved) {
        const osc1 = ctx.createOscillator(); const gain1 = ctx.createGain();
        osc1.connect(gain1); gain1.connect(ctx.destination);
        osc1.type = "triangle";
        osc1.frequency.value = 600;
        gain1.gain.setValueAtTime(0.5, ctx.currentTime);
        gain1.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
        osc1.start(ctx.currentTime); osc1.stop(ctx.currentTime + 0.15);
        const osc2 = ctx.createOscillator(); const gain2 = ctx.createGain();
        osc2.connect(gain2); gain2.connect(ctx.destination);
        osc2.type = "triangle";
        osc2.frequency.value = 800;
        gain2.gain.setValueAtTime(0.5, ctx.currentTime + 0.2);
        gain2.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
        osc2.start(ctx.currentTime + 0.2); osc2.stop(ctx.currentTime + 0.35);
      } else {
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = "triangle";
        osc.frequency.value = 700;
        gain.gain.setValueAtTime(0.4, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
        osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.2);
      }
    } catch (e) {}
  }

  function playMilestoneSound() {
    // A milestone is rarer and bigger than a routine PR, so it gets the most elaborate sound
    // in the app — a five-note rising arpeggio, distinctly more triumphant than the PR
    // fanfare, so the rarest moments actually feel like the rarest moments.
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [523, 659, 784, 988, 1175].forEach((freq, i) => {
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = "triangle";
        osc.frequency.value = freq;
        const start = ctx.currentTime + i * 0.09;
        gain.gain.setValueAtTime(0.5, start);
        gain.gain.exponentialRampToValueAtTime(0.01, start + 0.35);
        osc.start(start); osc.stop(start + 0.35);
      });
    } catch (e) {}
  }

  function completeRow(exIdx, rowIdx) {
    const currentEx = getEffectiveEx(exIdx);
    const rows = getRowsFor(exIdx);
    const row = rows[rowIdx];
    if (row.done || row.reps === "" || row.weight === "") return;

    let exId = currentEx.exId;
    if (!exId) {
      const found = data.exercises.find(e => e.name.toLowerCase() === currentEx.name.toLowerCase());
      exId = found?.id || "other";
    }

    const exHistory = data.strengthLog[currentEx.exId] || [];
    const lastAttempt = exHistory.length > 0 ? exHistory[exHistory.length - 1] : null;

    const weightNum = +row.weight;
    const repsNum = +row.reps;
    const rpeNum = Math.max(1, Math.min(10, +row.rpe || 7));

    // "Previous" comparison for THIS set number specifically (Strong shows per-set history)
    const priorForThisRow = exHistory[exHistory.length - rows.length + rowIdx] || lastAttempt;

    let improved = false;
    if (priorForThisRow) {
      improved = repsNum > priorForThisRow.reps || (repsNum === priorForThisRow.reps && weightNum >= priorForThisRow.weight);
    } else {
      improved = true;
    }

    // All-time PR check — genuinely distinct from "improved vs last time": this looks across
    // EVERY set ever logged for this exercise, not just the most recent one. A weight can beat
    // last time's weight without being an all-time best; a real PR deserves a bigger moment.
    // Guarded to exHistory.length > 0 — your very first-ever log of an exercise has nothing to
    // beat yet, so it shouldn't trigger PR fanfare (it still gets the normal "improved" treatment).
    const allTimeMaxWeight = exHistory.reduce((max, h) => Math.max(max, h.weight || 0), 0);
    const isAllTimePR = exHistory.length > 0 && weightNum > allTimeMaxWeight;

    const entry = {
      date: todayStr(),
      weight: weightNum || 0,
      reps: repsNum,
      sets: currentEx.sets,
      rpe: rpeNum,
      targetReps: currentEx.reps,
      hitTarget: repsNum >= currentEx.reps,
      improved,
      isAllTimePR,
      note: (row.note || "").trim(),
    };

    // Register the exercise into data.exercises if it's not there yet — this covers BOTH
    // swapped-in exercises AND ordinary program-generated ones. A real, high-impact bug lived
    // here: workout templates reference exercises (pullup, rdl, leg_press, lat_pulldown, etc.)
    // that defaultData() never pre-registers, so most normal logged sets — not just swapped
    // ones — would show as raw ids like "pullup" throughout History/Progression instead of
    // their real names.
    const alreadyRegistered = data.exercises.some(e => e.id === exId);
    const nextExercises = alreadyRegistered
      ? data.exercises
      : [...data.exercises, { id: exId, name: currentEx.name, group: currentEx.group || "Other" }];

    const logIndex = (data.strengthLog[exId] || []).length; // where this entry will land, so a note typed afterward can find it again
    const nextStrengthLog = { ...data.strengthLog, [exId]: [...(data.strengthLog[exId] || []), entry] };

    // Check for one-time achievement badges against the state AFTER this set — built and
    // included in the SAME setData call below (not a second one), avoiding the exact
    // stale-closure race that broke custom-exercise creation a couple rounds back.
    const nextDataForMilestoneCheck = { ...data, exercises: nextExercises, strengthLog: nextStrengthLog, lastLogDate: todayStr() };
    const newMilestones = checkNewMilestones(nextDataForMilestoneCheck, exId, entry);
    const nextMilestones = newMilestones.length > 0
      ? [...(data.milestones || []), ...newMilestones.map(m => ({ id: m.id, earnedAt: todayStr() }))]
      : data.milestones;

    setData({
      ...data,
      exercises: nextExercises,
      strengthLog: nextStrengthLog,
      lastLogDate: todayStr(),
      milestones: nextMilestones,
    });

    playCompleteSound(improved, isAllTimePR);
    if (navigator.vibrate) navigator.vibrate(isAllTimePR ? [50, 40, 50, 40, 80] : improved ? [40, 30, 40] : [30]);
    if (improved) setSessionImproveCount(sessionImproveCount + 1);
    if (isAllTimePR) {
      setPrBanner({ exerciseName: currentEx.name, weight: weightNum });
      setSessionPRCount(c => c + 1);
      setTimeout(() => setPrBanner(null), 3500);
    }
    if (newMilestones.length > 0) {
      setMilestoneBanner(newMilestones[0]);
      playMilestoneSound();
      if (navigator.vibrate) navigator.vibrate([60, 40, 60, 40, 60, 40, 100]);
      setTimeout(() => setMilestoneBanner(null), 4500);
    }

    const newRows = rows.map((r, i) => i === rowIdx ? { ...r, done: true, isPR: isAllTimePR, loggedExId: exId, logIndex } : r);

    // Real-time, set-to-set progressive overload: reuse the exact same trusted function that
    // drives between-session weight adjustment, but feed it the set you JUST did instead of
    // your last session's set. This is what the user actually asked for — "recommendations on
    // the next set if you see areas we can increase or decrease weight" — not just adjustments
    // between one workout and the next.
    const nextPendingIdx = newRows.findIndex((r, i) => i > rowIdx && !r.done);
    const libEx = findLibraryExercise(exId, data.customExercises);
    const suggestion = calculateProgressiveOverload(
      currentEx.name,
      exHistory,
      { weight: weightNum, reps: repsNum, targetReps: currentEx.reps },
      libEx?.type,
      libEx?.equipment
    );
    let finalRows;
    if (nextPendingIdx !== -1) {
      const nextRow = newRows[nextPendingIdx];
      // Track "untouched" via an explicit flag set only by genuine user keystrokes, NOT by
      // comparing against currentEx.weight — that value isn't stable. It's recomputed every
      // render by the pre-existing adjustWorkoutForPerformance logic, which reacts to ANY
      // strengthLog entry, including ones logged seconds ago in this same session. Comparing
      // against it meant the baseline could silently shift mid-session and make an untouched
      // row look "manually edited," blocking the very suggestion it should have received.
      const nextRowUntouched = !nextRow.weightManuallyEdited;
      finalRows = newRows.map((r, i) => i === nextPendingIdx ? {
        ...r,
        weight: nextRowUntouched ? String(suggestion.nextWeight) : r.weight,
        suggestionNote: suggestion.recommendation,
        suggestionApplied: nextRowUntouched,
      } : r);
    } else {
      // No next set THIS session (single-set exercise, or you just finished the last set) —
      // there's nowhere to auto-fill a suggested weight, but the coaching message still
      // belongs somewhere visible instead of silently vanishing. Attach it to the row that
      // was just completed, framed as guidance for NEXT time rather than "fill this in."
      finalRows = newRows.map((r, i) => i === rowIdx ? { ...r, lastSetCoachNote: suggestion.recommendation, lastSetCoachWeight: suggestion.nextWeight } : r);
    }

    updateRowsFor(exIdx, finalRows);
    setRestTimerSignal(s => s + 1);
    setSessionVolume(v => v + (weightNum || 0) * repsNum);
  }

  // A note typed AFTER completion needs to patch the already-persisted strengthLog entry
  // directly (not just local row state) — the note UI only appears once a set is checked
  // off, by which point the entry has already been saved.
  function updateSetNote(exIdx, rowIdx, noteText) {
    const rows = getRowsFor(exIdx);
    const row = rows[rowIdx];
    updateRowsFor(exIdx, rows.map((r, i) => i === rowIdx ? { ...r, note: noteText } : r));
    if (!row.done || !row.loggedExId || row.logIndex === undefined) return;
    const exLog = data.strengthLog[row.loggedExId] || [];
    if (!exLog[row.logIndex]) return;
    const nextExLog = exLog.map((entry, i) => i === row.logIndex ? { ...entry, note: noteText } : entry);
    setData({ ...data, strengthLog: { ...data.strengthLog, [row.loggedExId]: nextExLog } });
  }

  // Unlocks a completed row's fields for correction — e.g. you typed 135 instead of 145.
  // Doesn't touch strengthLog yet; that only happens on saveEditedSet, so canceling an edit
  // (just navigating away) never leaves a half-applied change behind.
  function editSetRow(exIdx, rowIdx) {
    const rows = getRowsFor(exIdx);
    updateRowsFor(exIdx, rows.map((r, i) => i === rowIdx ? { ...r, editing: true } : r));
  }

  function cancelEditSetRow(exIdx, rowIdx) {
    const rows = getRowsFor(exIdx);
    const row = rows[rowIdx];
    // Restore the fields to what's actually persisted, in case the person typed something
    // then backed out — the displayed values shouldn't drift from storage just from opening
    // and canceling an edit.
    if (row.loggedExId != null && row.logIndex != null) {
      const persisted = (data.strengthLog[row.loggedExId] || [])[row.logIndex];
      if (persisted) {
        updateRowsFor(exIdx, rows.map((r, i) => i === rowIdx
          ? { ...r, editing: false, weight: String(persisted.weight), reps: String(persisted.reps), rpe: String(persisted.rpe) }
          : r));
        return;
      }
    }
    updateRowsFor(exIdx, rows.map((r, i) => i === rowIdx ? { ...r, editing: false } : r));
  }

  // Patches the EXISTING strengthLog entry in place — deliberately does not go through
  // completeRow's normal "log a new set" pipeline (PR detection, coaching suggestions,
  // milestone checks), since this is a correction to something already logged, not a new
  // set being performed. Going through that pipeline would double-count it and could
  // trigger a false PR/milestone off a typo fix.
  function saveEditedSet(exIdx, rowIdx) {
    const rows = getRowsFor(exIdx);
    const row = rows[rowIdx];
    if (row.loggedExId == null || row.logIndex == null) {
      updateRowsFor(exIdx, rows.map((r, i) => i === rowIdx ? { ...r, editing: false } : r));
      return;
    }
    const weightNum = row.weight === "" ? 0 : +row.weight;
    const repsNum = row.reps === "" ? 0 : +row.reps;
    const rpeNum = Math.max(1, Math.min(10, +row.rpe || 7));
    const exLog = data.strengthLog[row.loggedExId] || [];
    if (!exLog[row.logIndex]) {
      updateRowsFor(exIdx, rows.map((r, i) => i === rowIdx ? { ...r, editing: false } : r));
      return;
    }
    const existing = exLog[row.logIndex];
    const nextExLog = exLog.map((entry, i) => i === row.logIndex
      ? { ...entry, weight: weightNum, reps: repsNum, rpe: rpeNum, hitTarget: repsNum >= (entry.targetReps ?? repsNum) }
      : entry);
    setData({ ...data, strengthLog: { ...data.strengthLog, [row.loggedExId]: nextExLog } });
    updateRowsFor(exIdx, rows.map((r, i) => i === rowIdx
      ? { ...r, editing: false, weight: String(weightNum), reps: String(repsNum), rpe: String(rpeNum) }
      : r));
  }

  // Removes a set entirely — whether it was already logged (patches strengthLog and
  // storage, matching the exact same no-confirmation pattern History already uses for
  // deleting an individual set) or still pending (just drops the row, nothing persisted
  // to touch). Deleting a logged entry shifts every later index in that exercise's log
  // down by one, so any sibling row still pointing at a later entry needs its logIndex
  // corrected too, or notes/edits on those rows would silently patch the wrong set.
  function deleteLiveSet(exIdx, rowIdx) {
    const rows = getRowsFor(exIdx);
    const row = rows[rowIdx];
    if (row.done && row.loggedExId != null && row.logIndex != null) {
      const exLog = data.strengthLog[row.loggedExId] || [];
      const nextExLog = exLog.filter((_, i) => i !== row.logIndex);
      const nextStrengthLog = { ...data.strengthLog, [row.loggedExId]: nextExLog };
      setData({
        ...data,
        strengthLog: nextStrengthLog,
        lastLogDate: recomputeLastLogDate(nextStrengthLog, data.cardioLog, data.recoveryLog),
      });
      const newRows = rows
        .filter((r, i) => i !== rowIdx)
        .map(r => (r.loggedExId === row.loggedExId && r.logIndex != null && r.logIndex > row.logIndex)
          ? { ...r, logIndex: r.logIndex - 1 }
          : r);
      updateRowsFor(exIdx, newRows);
    } else {
      updateRowsFor(exIdx, rows.filter((_, i) => i !== rowIdx));
    }
  }

  // Whether there's a real, worth-asking-about reason to interrupt "Finish workout" — a
  // row that's genuinely pending with real data typed into it, not just an empty leftover
  // row nobody touched. Matches Strong's own distinction ("valid sets... not marked
  // complete" vs "invalid or empty sets will be removed").
  function hasUnfinishedValidSets() {
    return exercises.some((rawEx, exIdx) => {
      const rows = getRowsFor(exIdx);
      return rows.some(row => !row.done && row.weight !== "" && row.reps !== "" && +row.reps > 0);
    });
  }

  function handleFinishTap() {
    if (hasUnfinishedValidSets()) {
      setFinishConfirm(true);
    } else if (completedSets === 0) {
      // Nothing was ever actually logged this session — no completed sets, and (since we
      // already checked above) nothing pending with real data either. Showing "Workout
      // Complete!" with a genuine celebration, a PR-style banner, and an incremented
      // lifetime-workout count for a session where literally nothing happened is a real,
      // confusing false-positive — someone exploring "Start an empty workout" and
      // immediately tapping Finish shouldn't get congratulated for doing nothing. Quietly
      // return to the choose-workout screen instead, same cleanup as a normal "Done" tap.
      setSessionStarted(false);
      setSessionComplete(false);
      setFreeformMode(false);
      setFreeformExercises([]);
      setActiveRoutineName(null);
      setSaveRoutineName("");
      setRoutineSaved(false);
      try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
    } else {
      setSessionComplete(true);
    }
  }

  // Bulk-completes every pending row that has real data typed into it, exactly like a real
  // tap on each one's checkmark would — same PR/improvement detection, same strengthLog
  // entries. Rows with nothing entered are simply left alone (never logged, matching "empty
  // sets will be removed" — they were never going to be logged anyway). Builds ALL the
  // updates first and applies strengthLog + setRows each in a single combined call, rather
  // than looping individual completeRow/updateRowsFor calls — looping either one here would
  // reintroduce the exact stale-closure race a prior round already found and fixed, since
  // multiple setState calls in one handler each see the same pre-update snapshot.
  function finishUnfinishedSets() {
    let nextStrengthLog = { ...data.strengthLog };
    let nextExercises = [...data.exercises];
    let addedImprove = 0, addedPR = 0, addedVolume = 0;
    const rowUpdates = {};

    exercises.forEach((rawEx, exIdx) => {
      const override = exerciseOverrides[exIdx];
      const currentEx = override ? { ...rawEx, name: override.name, exId: override.exId } : rawEx;
      const exId = currentEx.exId;
      if (!exId) return;
      const rows = getRowsFor(exIdx);

      const updatedRows = rows.map(row => {
        if (row.done) return row;
        const repsNum = row.reps === "" ? NaN : +row.reps;
        if (row.weight === "" || row.reps === "" || isNaN(repsNum) || repsNum <= 0) return row; // nothing real entered — leave as-is, never logged

        const weightNum = row.weight === "" ? 0 : +row.weight;
        const rpeNum = Math.max(1, Math.min(10, +row.rpe || 7));
        const exHistory = nextStrengthLog[exId] || [];
        const priorMax = exHistory.reduce((m, e) => Math.max(m, e.weight || 0), 0);
        const isAllTimePR = exHistory.length > 0 && weightNum > priorMax;
        const hitTarget = repsNum >= currentEx.reps;
        const lastAttempt = exHistory.length > 0 ? exHistory[exHistory.length - 1] : null;
        const improved = lastAttempt ? (weightNum > lastAttempt.weight || (weightNum === lastAttempt.weight && repsNum > lastAttempt.reps)) : hitTarget;

        const logIndex = exHistory.length;
        const entry = { date: todayStr(), weight: weightNum, reps: repsNum, sets: 1, rpe: rpeNum, targetReps: currentEx.reps, hitTarget, improved, isAllTimePR, note: row.note || "" };
        nextStrengthLog = { ...nextStrengthLog, [exId]: [...exHistory, entry] };
        if (!nextExercises.some(e => e.id === exId)) {
          nextExercises = [...nextExercises, { id: exId, name: currentEx.name, group: currentEx.group }];
        }
        if (improved) addedImprove++;
        if (isAllTimePR) addedPR++;
        addedVolume += weightNum * repsNum;

        return { ...row, done: true, isPR: isAllTimePR, loggedExId: exId, logIndex };
      });
      rowUpdates[exIdx] = updatedRows;
    });

    setData({
      ...data,
      exercises: nextExercises,
      strengthLog: nextStrengthLog,
      lastLogDate: todayStr(),
    });
    setSetRows({ ...setRows, ...rowUpdates });
    setSessionImproveCount(sessionImproveCount + addedImprove);
    setSessionPRCount(c => c + addedPR);
    setSessionVolume(v => v + addedVolume);
    setFinishConfirm(false);
    setSessionComplete(true);
  }

  return (
    <div style={styles.stack}>
      {exercises.some(ex => ex._adjusted) && (
        <div style={{
          background: "var(--accent-dim)", border: "1px solid var(--accent)",
          padding: "12px 16px", borderRadius: 10, fontSize: 13, color: "var(--ink)",
        }}>
          <strong>📈 Smart Adjustments:</strong> Based on your recent performance, some weights below have been auto-increased for progressive overload.
        </div>
      )}
      {todayPlan && todayPlan.week % 4 === 0 && (
        <div style={{
          background: "rgba(0, 150, 136, 0.1)", border: "1px solid rgba(0, 150, 136, 0.3)",
          padding: "12px 16px", borderRadius: 10, fontSize: 13, color: "var(--ink)",
        }}>
          <strong>🔄 Deload Week:</strong> This week features reduced volume to help your body recover. You'll feel stronger next week!
        </div>
      )}

      {milestoneBanner && (
        <div style={{
          background: "linear-gradient(135deg, var(--fun-purple), var(--accent))", color: "#FFFFFF", borderRadius: 16, padding: "16px 18px",
          display: "flex", alignItems: "center", gap: 14, animation: "prPulse 0.5s ease",
          boxShadow: "0 6px 20px rgba(175,82,222,0.35)",
        }}>
          <div style={{ fontSize: 32 }}>{milestoneBanner.icon}</div>
          <div>
            <div style={{ fontSize: 15, fontWeight: 800 }}>{milestoneBanner.title}</div>
            <div style={{ fontSize: 12, opacity: 0.9, marginTop: 2 }}>{milestoneBanner.detail}</div>
          </div>
        </div>
      )}

      {prBanner && (
        <div style={{
          position: "relative", background: "linear-gradient(135deg, var(--energy), var(--fun-pink))", color: "#FFFFFF", borderRadius: 16, padding: "18px 20px",
          display: "flex", alignItems: "center", gap: 14, animation: "prPulse 0.5s ease, prGlow 1.5s ease-in-out infinite",
          overflow: "visible", boxShadow: "0 6px 20px rgba(255,55,95,0.35)",
        }}>
          {["🎉", "✨", "🎊", "⭐", "🔥", "💥", "✨", "🎉"].map((emoji, idx) => {
            const angle = (idx / 8) * Math.PI * 2 + Math.random() * 0.4;
            const distance = 60 + Math.random() * 40;
            const flyX = Math.cos(angle) * distance;
            const flyY = Math.sin(angle) * distance;
            return (
              <span
                key={idx}
                style={{
                  position: "absolute", left: "50%", top: "50%", fontSize: 18, pointerEvents: "none",
                  "--fly": `translate(${flyX}px, ${flyY}px)`,
                  "--spin": `${Math.round(Math.random() * 360 - 180)}deg`,
                  animation: `confettiBurst ${0.7 + Math.random() * 0.4}s ease-out forwards`,
                }}
              >
                {emoji}
              </span>
            );
          })}
          <div style={{ fontSize: 32, lineHeight: 1 }}>🏆</div>
          <div>
            <div style={{ fontSize: 16, fontWeight: 800, letterSpacing: "0.01em" }}>ALL-TIME PR!</div>
            <div style={{ fontSize: 13, fontWeight: 600, opacity: 0.95 }}>
              {prBanner.exerciseName} — {prBanner.weight} lb, your heaviest ever
            </div>
          </div>
        </div>
      )}

      {/* Workout title — Strong always names the session; freeform gets a sensible default */}
      <div style={{ fontFamily: "var(--font-display)", fontSize: 18, fontWeight: 700 }}>
        {activeRoutineName || (freeformMode ? "Freeform Workout" : (todayPlan?.focus || "Workout"))}
      </div>

      {!freeformMode && exercises.some((ex, i) => ex._comeback && !exerciseOverrides[i]) && (
        <div style={{
          display: "flex", alignItems: "flex-start", gap: 8, fontSize: 12, color: "var(--ink)",
          background: "var(--accent-dim)", padding: "10px 12px", borderRadius: 10, lineHeight: 1.5, fontWeight: 500,
        }}>
          <span>👋</span>
          <span style={{ minWidth: 0, overflowWrap: "break-word", wordBreak: "break-word" }}>
            <strong>Welcome back!</strong> It's been a bit since you trained some of these — we've eased the weights down so you can ease back in safely instead of picking up exactly where you left off.
          </span>
        </div>
      )}

      {/* One compact stat strip instead of a tall bordered card — the numbers you actually
          glance at mid-set, not a whole screen's worth of real estate before exercise #1. */}
      <div style={{
        display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8,
        fontSize: 12, color: "var(--ink-dim)", padding: "2px 2px 4px",
      }}>
        <span><strong style={{ color: "var(--accent)", fontFamily: "var(--font-mono)" }}>{completedSets}/{totalSets}</strong> sets</span>
        <span style={{ fontFamily: "var(--font-mono)" }}>{sessionVolume.toLocaleString()} lb</span>
        <span style={{ fontFamily: "var(--font-mono)" }}>{fmtDuration(elapsedSeconds)}</span>
        {sessionImproveCount > 0 && <span style={{ color: "var(--accent)", fontWeight: 600 }}>+{sessionImproveCount}</span>}
      </div>

      {/* The reassurance that sets auto-save doesn't need restating every single time — but
          the freeform-specific caveat (re-add exercises if you leave and come back) is real,
          actionable info specific to that mode, so it stays as visible text, not a hover
          tooltip — tooltips don't work at all on touch/mobile, which is the actual target here. */}
      {freeformMode && (
        <div style={{ fontSize: 11, color: "var(--ink-dim)", lineHeight: 1.4, padding: "0 2px", minWidth: 0, overflowWrap: "break-word", wordBreak: "break-word" }}>
          💾 Sets save as you go. In freeform mode, re-add exercises if you leave and come back.
        </div>
      )}

      {/* Rest timer — sticky so it stays visible and adjustable while scrolling through
          exercises, instead of needing to scroll back up to check or change it. */}
      <div style={{ position: "sticky", top: 0, zIndex: 20, background: "var(--bg)", paddingBottom: 2 }}>
        <RestTimer seconds={120} autoStartSignal={restTimerSignal} />
      </div>

      {exercises.map((rawEx, exIdx) => {
        const override = exerciseOverrides[exIdx];
        const currentEx = override ? { ...rawEx, name: override.name, exId: override.exId } : rawEx;
        const exHistory = data.strengthLog[currentEx.exId] || [];
        const lastAttempt = exHistory.length > 0 ? exHistory[exHistory.length - 1] : null;
        const libExForHint = findLibraryExercise(currentEx.exId, data.customExercises);
        const overload = lastAttempt ? calculateProgressiveOverload(currentEx.name, exHistory, lastAttempt, libExForHint?.type, libExForHint?.equipment) : null;
        const warmupSets = getWarmupSets(currentEx.weight, libExForHint?.equipment);
        const isBarbellEquipment = libExForHint?.equipment === "Barbell" || libExForHint?.equipment === "EZ Bar";
        const plateInfo = isBarbellEquipment ? calculatePlates(currentEx.weight, equipmentFloorAndBaseline(libExForHint?.equipment).floor) : null;
        const rows = getRowsFor(exIdx);
        const updateRows = (newRows) => updateRowsFor(exIdx, newRows);
        const showRpeHint = rpeHintOpenFor === exIdx;
        const showWeightHint = weightHintOpenFor === exIdx;

        return (
          <div data-exercise-card={currentEx.name} key={exIdx}>
          <Card title="">
            <div style={{display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8}}>
              <div style={styles.liveExName}>{currentEx.name}</div>
              {!override && currentEx._adjusted && (
                <div style={{fontSize: 12, background: "var(--accent)", color: "#FFFFFF", padding: "6px 12px", borderRadius: 8, fontWeight: 600, whiteSpace: "nowrap", marginLeft: 12, letterSpacing: "0.03em"}}>
                  📈 AUTO-ADJUSTED
                </div>
              )}
            </div>
            <div style={{fontSize: 13, color: "var(--ink-dim)", marginBottom: 4}}>
              Target: {currentEx.sets}×{currentEx.reps} @ {currentEx.weight} lb
              {!override && currentEx._originalWeight && currentEx._originalWeight !== currentEx.weight && (
                <span style={{marginLeft: 10, color: "var(--accent)", fontFamily: "var(--font-mono)", fontWeight: 700, fontSize: 12}}>
                  ↑ {currentEx._originalWeight} → {currentEx.weight} lb
                </span>
              )}
              {!freeformMode && (
                <button
                  onClick={() => setWeightHintOpenFor(showWeightHint ? null : exIdx)}
                  style={{
                    marginLeft: 10, background: "none", border: "none", padding: 0, font: "inherit",
                    color: "var(--ink-dim)", cursor: "pointer", textDecoration: "underline dotted", textUnderlineOffset: 3,
                  }}
                >
                  why this weight?
                </button>
              )}
            </div>
            {showWeightHint && !freeformMode && (
              <div style={{ fontSize: 11, color: "var(--ink-dim)", lineHeight: 1.6, marginBottom: 10, background: "var(--surface-2)", padding: "10px 12px", borderRadius: 10 }}>
                {currentEx._recommendation
                  ? <>{currentEx._recommendation}</>
                  : <>No history yet for this exercise, so this is a baseline starting point — log a set and next time the app will suggest a weight based on how it went.</>}
                <div style={{ marginTop: 6 }}>
                  <strong>The rule:</strong> hit your target reps → weight goes up next time (+5 lb for big compound lifts, +2.5 lb for accessories). Miss by 1 rep → same weight again. Miss by 2+ → weight drops slightly so the next attempt is achievable.
                </div>
              </div>
            )}
            {warmupSets.length > 0 && (
              <div style={{ fontSize: 12, color: "var(--ink-dim)", marginBottom: 10, display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
                <span style={{ fontWeight: 600 }}>Warm up:</span>
                {warmupSets.map((s, i) => (
                  <span key={i} style={{ fontFamily: "var(--font-mono)" }}>
                    {s.weight}×{s.reps}{i < warmupSets.length - 1 ? "," : ""}
                  </span>
                ))}
              </div>
            )}
            {plateInfo && plateInfo.plates.length > 0 && (() => {
              const uniqueSizes = [...new Set(plateInfo.plates)].sort((a, b) => b - a);
              return (
                <div style={{ fontSize: 12, color: "var(--ink-dim)", marginBottom: 10, display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
                  <span style={{ fontWeight: 600 }}>🏋️ Per side:</span>
                  {uniqueSizes.map((size, i) => {
                    const count = plateInfo.plates.filter(p => p === size).length;
                    return (
                      <span key={size} style={{ fontFamily: "var(--font-mono)" }}>
                        {count}×{size}{i < uniqueSizes.length - 1 ? "," : ""}
                      </span>
                    );
                  })}
                  {plateInfo.remainder > 0 && (
                    <span style={{ color: "var(--energy)" }}>(+{plateInfo.remainder} lb not exactly loadable with standard plates)</span>
                  )}
                </div>
              );
            })()}
            <button style={styles.swapExerciseLink} onClick={() => { setPickerIntent("swap"); setSwapTargetIdx(exIdx); setSwapPickerOpen(true); }}>
              <RotateCcw size={12} /> {override ? "Swapped — change again" : "Swap exercise"}
            </button>
            {/* "Last time" is genuinely useful context before you've done anything yet this
                session — but once you've logged a real set today, the real-time coaching
                banners below (which reflect what you JUST did) are more current and more
                useful. Showing both together is confusing, stale-vs-fresh clutter — e.g. a
                static "last time you hit the target!" sitting right next to a fresh "crushed
                it, go up next set" for the same exercise. Suppress the static block once
                today's own data has taken over. */}
            {!rows.some(r => r.done) && lastAttempt && (
              <div style={{fontSize: 12, color: "var(--ink-dim)", margin: "12px 0 4px"}}>
                Last time: <span style={{fontFamily: "var(--font-mono)", fontWeight: 600, color: "var(--ink)"}}>{lastAttempt.weight}×{lastAttempt.reps}</span> @ RPE {lastAttempt.rpe} ({lastAttempt.date})
              </div>
            )}
            {!rows.some(r => r.done) && overload && overload.hitTarget && (
              <div style={{fontSize: 12, color: "var(--accent)", fontWeight: 600, marginBottom: 16}}>
                ✅ You hit the target last time — ready to progress!
              </div>
            )}
            {!rows.some(r => r.done) && overload && !overload.hitTarget && overload.status === "close_to_target" && (
              <div style={{fontSize: 12, color: "var(--accent)", marginBottom: 16}}>
                🟡 So close last time — try again for the full target.
              </div>
            )}
            {(!overload || (overload.hitTarget === undefined && overload.status !== "close_to_target")) && lastAttempt && !rows.some(r => r.done) && (
              <div style={{ marginBottom: 4 }} />
            )}
            {(!lastAttempt || rows.some(r => r.done)) && <div style={{ marginBottom: 12 }} />}

            {/* Strong-style set table: every prescribed set is its own editable, checkable row */}
            <div style={styles.setTable}>
              <div style={styles.setTableHeader}>
                <div style={{ width: 20 }}>SET</div>
                <div style={{ flex: 1 }}>PREVIOUS</div>
                <div style={{ width: 58, textAlign: "center" }}>LB</div>
                <div style={{ width: 50, textAlign: "center" }}>REPS<span style={{ color: "var(--accent)", fontWeight: 700 }}> ({currentEx.reps})</span></div>
                <button
                  onClick={() => setRpeHintOpenFor(showRpeHint ? null : exIdx)}
                  style={{
                    width: 36, textAlign: "center", background: "none", border: "none", padding: 0,
                    font: "inherit", color: "inherit", cursor: "pointer", textDecoration: "underline dotted",
                    textDecorationColor: "var(--ink-dim)", textUnderlineOffset: 3,
                  }}
                >
                  RPE
                </button>
                <div style={{ width: 32 }} />
              </div>
              {showRpeHint && (
                <div style={{ fontSize: 11, color: "var(--ink-dim)", padding: "0 4px 8px", lineHeight: 1.5 }}>
                  RPE = how hard the set felt, 1–10. <strong>Fill it in after each set</strong> — it's not a target.
                  10 = couldn't do another rep · 7–8 = a few reps left in the tank · 5 = easy.
                </div>
              )}
              {rows.map((row, i) => {
                const priorForThisRow = exHistory[exHistory.length - rows.length + i];
                const isPendingSuggestion = !row.done && !!row.suggestionNote;
                return (
                  <div key={i}>
                    {isPendingSuggestion && (
                      <div style={{
                        fontSize: 11, color: "var(--energy)", background: "var(--energy-dim)",
                        padding: "6px 10px", borderRadius: 8, marginBottom: 4, fontWeight: 700,
                      }}>
                        {row.suggestionNote}
                        {row.suggestionApplied && <span style={{ fontWeight: 500, opacity: 0.85 }}> — filled in below, ready to go.</span>}
                      </div>
                    )}
                    <div style={{
                      ...styles.setTableRow,
                      ...(row.isPR ? { background: "var(--energy-dim)" } : row.done ? styles.setTableRowDone : {}),
                      ...(isPendingSuggestion ? { background: "var(--energy-dim)", border: "1px solid var(--energy)" } : {}),
                      ...(row.done ? { animation: "rowFlash 0.6s ease-out" } : {}),
                    }}>
                      <div style={{ width: 20, fontWeight: 700, color: "var(--ink-dim)", fontSize: 13 }}>
                        {row.isPR ? "🏆" : i + 1}
                      </div>
                      <div style={{ flex: 1, fontSize: 11, color: "var(--ink-dim)", fontFamily: "var(--font-mono)", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                        {priorForThisRow ? `${priorForThisRow.weight}×${priorForThisRow.reps}` : "—"}
                      </div>
                      <input
                        type="number" inputMode="decimal"
                        disabled={row.done && !row.editing}
                        style={{ ...styles.setTableInput, width: 58 }}
                        value={row.weight}
                        placeholder={String(currentEx.weight || 0)}
                        onChange={(e) => updateRows(rows.map((r, idx) => idx === i ? { ...r, weight: e.target.value, weightManuallyEdited: true } : r))}
                      />
                      <input
                        type="number" inputMode="numeric"
                        disabled={row.done && !row.editing}
                        style={{ ...styles.setTableInput, width: 50 }}
                        value={row.reps}
                        placeholder={String(currentEx.reps)}
                        onChange={(e) => updateRows(rows.map((r, idx) => idx === i ? { ...r, reps: e.target.value } : r))}
                      />
                      <input
                        type="number" inputMode="numeric"
                        min="1" max="10"
                        disabled={row.done && !row.editing}
                        style={{ ...styles.setTableInput, width: 36 }}
                        value={row.rpe}
                        onChange={(e) => updateRows(rows.map((r, idx) => idx === i ? { ...r, rpe: e.target.value } : r))}
                        onBlur={(e) => {
                          const v = +e.target.value;
                          const clamped = e.target.value === "" || isNaN(v) ? "7" : String(Math.max(1, Math.min(10, v)));
                          updateRows(rows.map((r, idx) => idx === i ? { ...r, rpe: clamped } : r));
                        }}
                      />
                      {row.done && !row.editing ? (
                        <button
                          style={{ ...styles.setCheckBtn, ...styles.setCheckBtnDone }}
                          onClick={() => editSetRow(exIdx, i)}
                          title="Edit this set"
                        >
                          <Pencil size={12} />
                        </button>
                      ) : row.editing ? (
                        <button
                          style={{ ...styles.setCheckBtn, background: "var(--accent)", color: "#FFFFFF", border: "none" }}
                          onClick={() => saveEditedSet(exIdx, i)}
                          title="Save changes"
                        >
                          <Check size={14} strokeWidth={3} />
                        </button>
                      ) : (
                        <button
                          style={{ ...styles.setCheckBtn, ...(row.done ? styles.setCheckBtnDone : {}), ...(row.done ? { animation: "checkBounce 0.4s ease" } : {}) }}
                          onClick={() => completeRow(exIdx, i)}
                          disabled={row.done}
                          title={row.done ? "Set completed" : "Complete this set"}
                        >
                          <Check size={14} strokeWidth={3} />
                        </button>
                      )}
                    </div>
                    {row.done && (
                      <div style={{ display: "flex", gap: 12, marginTop: 3, marginBottom: 2 }}>
                        {row.editing ? (
                          <button
                            onClick={() => cancelEditSetRow(exIdx, i)}
                            style={{ background: "none", border: "none", padding: 0, fontSize: 11, color: "var(--ink-dim)", cursor: "pointer", fontWeight: 600 }}
                          >
                            Cancel
                          </button>
                        ) : (
                          <button
                            onClick={() => deleteLiveSet(exIdx, i)}
                            style={{ background: "none", border: "none", padding: 0, fontSize: 11, color: "#FF6B6B", cursor: "pointer", fontWeight: 600 }}
                          >
                            Delete set
                          </button>
                        )}
                      </div>
                    )}
                    {row.done && row.lastSetCoachNote && (
                      <div style={{
                        fontSize: 11, color: "var(--energy)", background: "var(--energy-dim)",
                        padding: "6px 10px", borderRadius: 8, marginTop: 4, fontWeight: 700,
                      }}>
                        {row.lastSetCoachNote}
                      </div>
                    )}
                    {row.done && (
                      <div style={{ display: "flex", alignItems: "center", gap: 6, padding: "2px 4px 6px 32px" }}>
                        <button
                          onClick={() => updateRows(rows.map((r, idx) => idx === i ? { ...r, noteOpen: !r.noteOpen } : r))}
                          title="Add a note to this set"
                          style={{
                            background: "none", border: "none", padding: 0, cursor: "pointer",

                          }}

                          💬 {row.note ? "Edit note" : "Add note"}
                        </button>
                      </div>
                    )}
                    {row.done && (row.noteOpen || row.note) && (
                      <div style={{ padding: "0 4px 10px 32px" }}>
                        <input
                          type="text"
                          value={row.note}
                          placeholder="e.g. felt heavy, used straps…"
                          onChange={(e) => updateSetNote(exIdx, i, e.target.value)}
                          style={{
                            width: "100%", fontSize: 12, padding: "8px 10px", borderRadius: 8,

                          }}
